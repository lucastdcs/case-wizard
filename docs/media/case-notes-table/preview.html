/* ---------- Tokens: os mesmos de notes-styles.js / header-factory.js, mais os degraus de tom do Call Script ---------- */
:root{
  --primary:#1a73e8; --primary-hover:#1765cc; --primary-bg:#e8f0fe; --primary-ink:#1967d2;
  --ink:#202124; --ink2:#3c4043; --sub:#5f6368; --hint:#9aa0a6; --hint2:#74777c;
  --surface:#fff; --tone:#f5f5f7; --tone-1:#f8f9fa; --tone-2:#f1f3f4; --track:#e8e8ed;
  --hairline:rgba(60,64,67,.12);
  --ok:#188038; --ok-bg:#e6f4ea; --warn:#b06000; --warn-bg:#fef7e0; --err:#d93025;
  --font:'Google Sans','Google Sans Flex',Roboto,system-ui,sans-serif;
  --ease:cubic-bezier(.4,0,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);font-size:14px;color:var(--ink2);background:#f1f3f4;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea{font-family:inherit}
button{padding:0;margin:0}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}

/* ---------- Pano de fundo: o CRM (só contexto; não é do CW) ---------- */
.crm-top{height:64px;background:#fff;box-shadow:0 1px 0 #e8eaed;display:flex;align-items:center;justify-content:space-between;padding:0 24px}
.crm-top b{font-weight:400;font-size:24px;color:#5f6368}
.crm-top i{width:32px;height:32px;border-radius:50%;background:#1a73e8;color:#fff;font:500 14px/32px var(--font);text-align:center;font-style:normal}
.crm-body{display:flex;gap:24px;padding:24px;height:calc(100% - 64px)}
.crm-panel{background:#fff;border-radius:12px}
.crm-panel.l{width:272px}.crm-panel.r{flex:1}
.sk{height:16px;border-radius:8px;background:#f1f3f4;margin:16px}
.sk.s{width:60%}.sk.m{width:80%}

/* ---------- Janela: a mesma casca do Case Notes de hoje (stylePopup + HEADER_STYLE) ---------- */
.stage{position:absolute;left:792px;top:48px;width:560px;height:760px}
.win{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;overflow:hidden;border-radius:20px;background:rgba(255,255,255,.98);border:1px solid rgba(255,255,255,.7);box-shadow:0 20px 40px rgba(0,0,0,.12)}
.hdr{position:relative;flex:none;height:56px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;background:rgba(28,28,32,.85);backdrop-filter:blur(12px);color:#e8eaed;font-weight:500;letter-spacing:.5px;border-bottom:1px solid rgba(255,255,255,.08)}
.hdr .l{display:flex;align-items:center;gap:12px}
.hdr .logo{display:flex;width:20px;height:20px}
.hdr .t{font-size:16px}
.hdr .r{display:flex;align-items:center;gap:4px}
.hbtn{width:32px;height:32px;padding:0;display:grid;place-items:center;border:0;border-radius:50%;background:transparent;color:#9aa0a6;cursor:pointer;transition:background-color .2s var(--ease),color .2s var(--ease)}
.hbtn:hover{background:rgba(255,255,255,.1);color:#fff}
.hbtn.x:hover{background:rgba(242,139,130,.2);color:#f28b82}
.hbtn:focus-visible,.chip:focus-visible,.seg button:focus-visible,.btn:focus-visible,.na:focus-visible,.pick:focus-visible,.tab:focus-visible,.status:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.gline{position:absolute;left:0;bottom:0;width:100%;height:2px;background:linear-gradient(to right,#4285f4,#ea4335,#fbbc05,#34a853);opacity:.8}

/* ---------- Corpo: fundo tonal, cartões brancos (inset grouped), sem borda ---------- */
.bw{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--tone)}
.body{position:absolute;inset:0;overflow-y:auto;padding:24px;scrollbar-width:thin;scrollbar-color:#dadce0 transparent}
.sec{margin-bottom:24px}
.eyebrow{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:11px;font-weight:500;line-height:16px;letter-spacing:1px;text-transform:uppercase;color:var(--sub)}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--hairline)}
.sub-h{margin:8px 0 8px 16px;font-size:12px;font-weight:500;line-height:16px;color:var(--sub)}
#form>.eyebrow{margin-top:8px}
.eyebrow .n{letter-spacing:0;text-transform:none;font-weight:400;color:var(--hint)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cap{margin:8px 0 0 4px;font-size:12px;line-height:16px;color:var(--sub)}
.cap span{color:var(--ink)}

/* controle segmentado: Apple (trilho cinza, selecionado branco), o mesmo do Call Script */
.seg{display:flex;padding:4px;border-radius:12px;background:var(--track)}
.seg button{flex:1;height:32px;border:0;border-radius:8px;background:transparent;font-size:13px;font-weight:500;color:var(--sub);cursor:pointer;transition:background-color .2s var(--ease),color .2s var(--ease),box-shadow .2s var(--ease)}
.seg button:hover:not([aria-checked=true]){color:var(--ink)}
.seg button[aria-checked=true]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg.sm{display:inline-flex;padding:4px}
.seg.sm button{flex:none;min-width:56px;padding:0 12px}

/* ---------- Cartão e linha ---------- */
.card{background:var(--surface);border-radius:16px;overflow:hidden}
.cw{position:relative;margin-bottom:24px}

.row.stack{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"l n" "v v";row-gap:4px;padding:12px 16px}

.more{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:44px;padding:0 16px;border:0;background:transparent;font-size:13px;font-weight:500;color:var(--sub);cursor:pointer;text-align:left;position:relative}

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function h(tag,a={},...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(a)){if(k==='class')e.className=v;else if(k==='style')e.style.cssText=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(v===true)e.setAttribute(k,'');else if(v!==false&&v!=null)e.setAttribute(k,v);}for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c));}return e;}
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayISO=()=>fmt(new Date());
// dias úteis: pula sábado e domingo; feriados não entram (o CRM não os informa)
const addBusinessDays=n=>{const d=new Date();let left=n;while(left>0){d.setDate(d.getDate()+1);const w=d.getDay();if(w!==0&&w!==6)left--}return fmt(d)};
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return fmt(d)};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2400)}
const seg=k=>CATALOG.segments.find(s=>s.key===k);
const lbl=r=>(r.label[st.lang]||r.label.en);

const st={seg:'all',flow:'bau',europe:false,optIn:new Set(),substatus:'',tasks:new Set(['ads_conversion_tracking']),active:new Set(),vals:{},cids:[]};
const newCid=()=>({tbw:'TBW',cid:'',mcc:'',outcome:'',alink:'',sme:'YES',tag:'',caseid:'',elig:'',galactic:''});
st.cids=[Object.assign(newCid(),{cid:CAPTURED.cid,auto:true})];
const ensure=id=>st.vals[id]||(st.vals[id]={v:'',na:false,comment:'',commentOpen:false,touched:false,auto:false});
const hasTask=k=>k==='ecw'?st.tasks.has('ads_enhanced_conversions'):st.tasks.has(k);
let ignoreWhen=false; // a prévia da Central mostra todas as linhas, sem filtrar pelo estado do agente
function matches(w){
  if(!w)return true;
  if(w.flow&&st.flow!==w.flow)return false;
  if(w.europe!==undefined&&st.europe!==w.europe)return false;
  if(w.substatusAny&&!w.substatusAny.includes(st.substatus))return false;
  if(w.tasksAny&&!w.tasksAny.some(k=>st.tasks.has(k)))return false;
  if(w.rowIs&&ensure(w.rowIs.id).v!==w.rowIs.v)return false;
  return true;
}
const rowRequired=r=>r.requiredWhen?matches(r.requiredWhen):r.required;
function rowVisible(r){
  if(!r.visible)return false;
  if(ignoreWhen)return true;
  if(r.onlyFor&&!r.onlyFor.every(hasTask))return false;
  if(!matches(r.when))return false;
  if(r.optIn&&!st.optIn.has(r.id)&&!(r.requiredWhen&&matches(r.requiredWhen)))return false;
  return true;
}
const subRule=()=>{const f=SUBSTATUS.find(s=>s[0]===st.substatus);return f?f[1]:null};
function allRows(){const out=[];for(const b of Object.values(CATALOG.blocks))for(const s of b.sections)if(s.rows)out.push(...s.rows);return out}
function applyAuto(){
  for(const r of allRows()){
    const s=ensure(r.id);
    if(r.default!==undefined&&!s.touched&&!s.v&&!s.na)s.v=r.default;
    if(!r.auto||r.type==='derived'||s.touched)continue;
    if(r.auto==='today'){s.v=todayISO();s.auto=true}
    else if(r.auto==='cid'){s.v=CAPTURED.cid;s.auto=true}
    else if(r.auto==='followup'){const f=subRule();
      if(typeof f==='number'){s.v=addBusinessDays(f);s.na=false;s.auto=true}
      else if(f==='na'){s.v='';s.na=true;s.auto=true}
      else{if(s.auto){s.v='';s.na=false}s.auto=false}}
    else if(r.auto==='consent'){
      // NA nos dois sub-status sem call; no caso da Europa o agente marca; nos demais vale Yes (a alternativa fica escondida)
      if(CONSENT_NA.includes(st.substatus)){s.na=true;s.auto=true;s.defaulted=false}
      else if(st.europe){s.na=false;s.auto=false;if(s.defaulted)s.v='';s.defaulted=false}
      else{s.na=false;s.auto=false;s.v='Yes';s.defaulted=true}}
  }
}
function placements(){return seg(st.seg).blocks}
function isSuggested(p){
  if(!p.suggest)return false;
  if(p.suggest.tasksAny&&p.suggest.tasksAny.some(k=>st.tasks.has(k)))return true;
  if(p.suggest.substatusAny&&p.suggest.substatusAny.includes(st.substatus))return true;
  return false;
}
function activePlacements(){const s=seg(st.seg);return s.blocks.filter(p=>st.active.has(p.b))}
const EXTRAS={b:'extras',title:''};
function activeAll(){return activePlacements().length?[...activePlacements(),EXTRAS]:[]}
function resetActive(){
  const s=seg(st.seg);st.active=new Set();
  if(s.select==='multi')(s.always||[]).forEach(b=>st.active.add(b));
  else st.active.add(s.blocks[0].b);
}
const TS_TARGETS=TS_TARGETS_CAT;
const TS_DISCLAIMER='Tag created/verified by Tag Support, as the note automatically added to the case indicates. I am not including the screenshots, in line with the Win Criteria guidance.';
function tasksText(){const ts=ensure('ts_used').v==='Yes';return TASKS.filter(t=>st.tasks.has(t.k)).map(t=>ts&&TS_TARGETS.includes(t.k)?`${t.n} - ${TS_DISCLAIMER}`:t.n).join(', ')}
function resolved(r){
  const s=ensure(r.id);
  if(r.type==='derived'){
    if(r.auto==='substatus')return st.substatus||null;
    if(r.auto==='europe')return 'Yes';
    if(r.auto==='tasks'){const t=tasksText();if(t)return t;return s.na?'NA':null}
  }
  if(s.na&&r.na!==false)return 'NA';
  const v=(s.v||'').trim();
  if(v)return (r.na!==false&&v.toUpperCase()==='NA')?'NA':v;
  return rowRequired(r)?null:'NA';
}

const HAIR='1px solid rgba(60,64,67,.16)';
function td({col,row,span=1,rowspan=1,head,bg,bold,color,valign='top',vline},html){
  const stl=[`padding:8px 12px`,`font-size:13px`,`line-height:1.45`,`vertical-align:${valign}`,`word-break:break-word`,`overflow-wrap:anywhere`,
    row>0?`border-top:${HAIR}`:'',vline?`border-left:${HAIR}`:'',`background-color:${bg||C.surface}`,`color:${color||C.text}`,(bold||head)?'font-weight:700':'font-weight:400','text-align:left'].filter(Boolean).join(';');
  const tag=head?'th':'td';
  return `<${tag}${span>1?` colspan="${span}"`:''}${rowspan>1?` rowspan="${rowspan}"`:''} style="${stl}">${html}</${tag}>`;
}
function renderGrid(rows,live){
  const busy=[];let out='';
  rows.forEach((cells,r)=>{busy[r]=busy[r]||[];let c=0,html='';
    for(const cell of cells){while(busy[r][c])c++;const span=cell.span||1,rs=cell.rowspan||1;
      for(let k=0;k<rs;k++){busy[r+k]=busy[r+k]||[];for(let j=0;j<span;j++)busy[r+k][c+j]=true}
      html+=td({...cell,col:c,row:r},cell.html);c+=span}
    out+=`<tr${live&&cells.rowId?` data-row="${esc(cells.rowId)}"`:''}>${html}</tr>`});
  return out;
}
const PENDING_BG='#fef7e0';
const pendingHtml='<span style="color:#b06000;font-style:italic">pendente</span>';
const valHtml=v=>esc(v).replace(/\n/g,'<br>');
function cidCellValue(col,cr){
  if(col.type==='smeyes')return cr.sme||'YES';
  return (cr[col.id]||'').trim();
}
function blockTable(p,live){
  const blk=CATALOG.blocks[p.b],N=blk.cols,rows=[];
  for(const sec of blk.sections){
    if(sec.kind==='cid'){
      rows.push([{span:N,head:true,bg:C.primaryBg,html:esc(sec.title)}]);
      rows.push(sec.columns.map((c,i)=>({head:true,vline:i>0,bg:C.bgInput,color:C.textSub,html:esc(lbl(c))})));
      if(!st.cids.length)rows.push([{span:N,bg:live?PENDING_BG:null,html:live?pendingHtml:'NA'}]);
      st.cids.forEach((cr,ci)=>rows.push(Object.assign(sec.columns.map((c,i)=>{
        const v=cidCellValue(c,cr);
        if(!v&&live)return {bold:i===0,vline:i>0,bg:PENDING_BG,html:pendingHtml};
        return {bold:i===0,vline:i>0,html:valHtml(v||'NA')}}),{rowId:`cid:${ci}:${sec.columns[0].id}`})));
    } else {
      const vis=sec.rows.filter(rowVisible);if(!vis.length)continue;
      if(sec.kind==='group'){
        rows.push([{span:N-1,head:true,bg:C.primaryBg,html:esc(sec.title)},{head:true,vline:true,bg:C.bgInput,color:C.textSub,html:'Additional Comments (Optional)'}]);
        vis.forEach((r,i)=>{const v=resolved(r),s=ensure(r.id),line=[];
          if(i===0)line.push({rowspan:vis.length,bold:true,bg:C.bgInput,color:C.primary,valign:'middle',html:esc(sec.group)});
          line.push({bold:true,html:esc(lbl(r))},v===null?{bg:live?PENDING_BG:null,html:live?pendingHtml:'NA'}:{html:valHtml(v)},{vline:true,html:valHtml(s.comment||'')});
          rows.push(Object.assign(line,{rowId:r.id}))});
      } else {
        const ls=N===3?1:2,vs=N-ls-1;
        rows.push([{span:N-1,head:true,bg:C.primaryBg,html:esc(sec.title)},{head:true,vline:true,bg:C.bgInput,color:C.textSub,html:'Additional Comments (Optional)'}]);
        for(const r of vis){const v=resolved(r),s=ensure(r.id);
          rows.push(Object.assign([{span:ls,bold:true,bg:C.bgInput,html:esc(lbl(r))},v===null?{span:vs,bg:live?PENDING_BG:null,html:live?pendingHtml:'NA'}:{span:vs,html:valHtml(v)},{vline:true,html:valHtml(s.comment||'')}],{rowId:r.id}))}
      }
    }
  }
  const tableStyle=`width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0;border:${HAIR};border-radius:12px;overflow:hidden;font-family:${FONT};margin:0 0 4px 0`;
  if(!rows.length)return '';
  const cg=`<colgroup>${blk.widths.map(w=>`<col style="width:${w}%">`).join('')}</colgroup>`;
  const heading=(seg(st.seg).showTitle&&p.title)?`<div style="font-family:${FONT};font-size:13px;font-weight:700;color:${C.primary};margin:16px 0 6px 0">${esc(p.title)}</div>`:'';
  return `${heading}<table style="${tableStyle}">${cg}<tbody>${renderGrid(rows,live)}</tbody></table>`;
}
const FOOT_I18N={pt:'Nota criada através do Cases Wizard.',es:'Nota creada a través de Cases Wizard.',en:'Note created through Cases Wizard.'};
function noteHtml(live){
  const parts=activeAll().map(p=>blockTable(p,live)).filter(Boolean);
  if(!parts.length)return '';
  return parts.join('<div style="height:10px"></div>')+`<div style="font-family:${FONT};font-size:12px;font-style:italic;color:${C.textSub};margin-top:8px">${FOOT_I18N[st.lang]||FOOT_I18N.en}</div>`;
}
function missingList(){
  const out=[];
  for(const p of activeAll()){
    const blk=CATALOG.blocks[p.b];
    for(const sec of blk.sections){
      if(sec.kind==='cid'){
        if(!st.cids.length)out.push('CID-Level Details: ao menos 1 CID');
        st.cids.forEach((cr,i)=>sec.columns.forEach(c=>{if(c.required&&!cidCellValue(c,cr))out.push(`CID ${i+1}: ${lbl(c).replace(/[:?]\s*$/,'')}`)}));
      } else for(const r of sec.rows.filter(rowVisible))if(resolved(r)===null)out.push(lbl(r).replace(/[:?]\s*$/,''));
    }
  }
  return out;
}

/* ---------- helpers de linha ---------- */
const hiddenDerived=r=>r.type==='derived'&&(r.auto==='substatus'||r.auto==='europe'||(r.auto==='tasks'&&resolved(r)!==null));
const isAutoRow=r=>{if(r.type==='derived')return false;const s=ensure(r.id);return resolved(r)!==null&&!!(s.auto||s.defaulted)};
const isOpt=r=>!rowRequired(r)&&!(r.optIn&&st.optIn.has(r.id));
const secRows=sec=>(sec.rows||[]).filter(rowVisible).filter(r=>!hiddenDerived(r));
function allVisibleRows(){return activeAll().flatMap(p=>CATALOG.blocks[p.b].sections.flatMap(secRows))}
function missingIds(){
  const out=new Set();
  for(const p of activeAll())for(const sec of CATALOG.blocks[p.b].sections){
    if(sec.kind==='cid'){st.cids.forEach((cr,i)=>sec.columns.forEach(c=>{if(c.required&&!cidCellValue(c,cr))out.add(`cid:${i}:${c.id}`)}));continue}
    for(const r of (sec.rows||[]).filter(rowVisible))if(resolved(r)===null)out.add(r.id);
  }
  return out;
}
const linkOk=v=>/^https?:\/\/\S+$/i.test((v||'').trim());
const isBad=(r,v)=>{v=v.trim();if(!v)return false;if(r.na===false&&v.toUpperCase()==='NA')return true;if(r.type==='date')return !/^\d{4}-\d{2}-\d{2}$/.test(v);if(r.type==='link')return v.toUpperCase()!=='NA'&&!/^https?:\/\/\S+$/i.test(v);return false};
const autosize=t=>{t.style.height='auto';t.style.height=Math.max(44,t.scrollHeight)+'px'};

/* ---------- controles ---------- */
function segCtl(label,opts,val,onPick,small){
  const g=h('div',{class:'seg'+(small?' sm':''),role:'radiogroup','aria-label':label});
  opts.forEach(([k,t])=>{
    const b=h('button',{type:'button',role:'radio','aria-checked':String(k===val),tabindex:k===val?'0':'-1',onclick:()=>onPick(k)},t);
    b.addEventListener('keydown',e=>{
      if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft')return;
      e.preventDefault();const i=opts.findIndex(o=>o[0]===val),j=(i+(e.key==='ArrowRight'?1:opts.length-1))%opts.length;
      onPick(opts[j][0]);queueMicrotask(()=>{const n=$(`[aria-label="${label}"] [aria-checked=true]`);n&&n.focus()});
    });
    g.append(b);
  });
  return g;
}
function setFn(row,text){const cw=row.closest('.cw');const fn=cw&&cw.querySelector(':scope>.fn');if(fn)fn.textContent=text||fn.dataset.def||''}
function hl(id,on){$$('#preview tr[data-row]').forEach(tr=>tr.classList.toggle('hl',on&&tr.dataset.row===id))}

/* ---------- avançar para o próximo campo vazio (Enter, ou colar um link válido) ---------- */
function advance(from){
  const rows=$$('#form .row[data-row]'),i=rows.indexOf(from.closest('.row[data-row]'));
  for(let j=i+1;j<rows.length;j++){
    const f=rows[j].querySelector('input[type=text],textarea');
    if(f&&!f.value.trim()&&!rows[j].querySelector('.na[aria-pressed=true]')){f.focus();return true}
  }
  return false;
}

/* ---------- uma linha do formulário ---------- */
function mkRow(r,pend){
  const s=ensure(r.id),na=s.na&&r.na!==false,v=resolved(r),stack=r.type==='long';
  const row=h('div',{class:'row'+(stack?' stack':'')+(pend?' pending':''),'data-row':r.id});
  const tags=[];
  if(s.auto)tags.push(h('span',{class:'tag',title:'Preenchido automaticamente. Editar tira a marca.'},ico('check'),'Auto'));
  if(s.defaulted)tags.push(h('span',{class:'tag',title:'Valor padrão. Use Alterar para mudar.'},'Padrão'));
  if(r.auto==='consent'&&st.europe&&!na&&v===null)tags.push(h('span',{class:'tag warn'},'Caso da Europa: marque'));
  row.append(h('label',{class:'rl',for:'f-'+r.id},labUi(r),...tags));
  const rv=h('div',{class:'rv'+(r.type==='date'?' date':'')+(r.type==='speakeasy'?' sp':'')+(r.type==='cid'?' cidv':'')+(r.type==='link'?' lk':'')+(r.type==='link'&&linkOk(s.v)?' ok':'')});
  let extra=null;
  const touch=()=>{s.touched=true;s.auto=false;s.defaulted=false;$$('.tag',row).forEach(e=>e.remove())};
  const field=tag=>{
    const e=h(tag,tag==='input'?{id:'f-'+r.id,type:'text',autocomplete:'off',spellcheck:'false',placeholder:PH[r.type]||PH.text}:{id:'f-'+r.id,rows:'3',placeholder:PH.long});
    e.value=s.v;
    e.addEventListener('input',()=>{touch();s.v=e.value;row.classList.toggle('bad',isBad(r,e.value));if(r.type==='link')rv.classList.toggle('ok',linkOk(e.value));if(tag==='textarea')autosize(e);refresh()});
    if(tag==='input'){
      e.addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();advance(row)}});
      if(r.type==='link')e.addEventListener('paste',()=>setTimeout(()=>{if(linkOk(e.value))advance(row)},0));
    }
    if(r.type==='cid')e.addEventListener('blur',()=>{const d=e.value.replace(/\D/g,'');if(d.length===10){e.value=s.v=`${d.slice(0,3)}-${d.slice(3,6)}-${d.slice(6)}`;refresh()}});
    return e;
  };
  if(na){rv.append(h('span',{class:'val muted'},'NA'))}
  else if(r.type==='derived'){
    rv.append(h('span',{class:'val'+(v?'':' empty')},r.auto==='tasks'?(v?TASKS.filter(t=>st.tasks.has(t.k)).map(t=>t.n).join(', '):'Nenhuma task marcada'):(v||'—')));
  } else if(r.type==='yesno'){
    if(r.auto==='consent'&&!st.europe&&s.defaulted&&!s.altOpen){
      rv.append(h('span',{class:'val'},'Yes'));
      extra=h('button',{class:'na',type:'button',onclick:()=>{s.altOpen=true;render()}},'Alterar');
    } else rv.append(segCtl(labUi(r),[['Yes','Yes'],['No','No']],s.v,k=>{touch();s.v=k;s.na=false;render()},true));
  } else if(r.type==='long'){
    const t=field('textarea');rv.append(t);queueMicrotask(()=>autosize(t));
  } else {
    rv.append(field('input'));
    if(r.type==='link')rv.append(h('span',{class:'ck','aria-hidden':'true'},ico('check')));
    if(r.type==='date'&&r.auto==='followup')rv.append(h('div',{class:'quick'},[2,3,5].map(n=>h('button',{class:'chip',type:'button',title:`+${n} dias úteis`,'aria-label':`Daqui a ${n} dias úteis`,onclick:()=>{touch();s.v=addBusinessDays(n);s.na=false;render()}},'+'+n))));
    if(r.type==='speakeasy')rv.append(h('button',{class:'chip',type:'button',onclick:()=>{touch();s.v=CAPTURED.speakeasy;s.na=false;render();toast('Speakeasy ID encontrado no case log.')}},'Auto busca'));
  }
  row.append(rv);
  const hasNA=(r.na!==false&&r.type!=='derived')||(r.type==='derived'&&r.auto==='tasks');
  if(extra)row.append(extra);
  else{
    const acts=h('div',{class:'acts'});
    if(r.type!=='derived')acts.append(h('button',{class:'cmt'+(s.comment||s.commentOpen?' on':' ghost'),type:'button','aria-label':'Comentário da linha','aria-pressed':String(!!s.commentOpen),title:s.comment?'Comentário: '+s.comment:'Adicionar comentário (vai na coluna Additional Comments)',onclick:()=>{s.commentOpen=!s.commentOpen;render();if(s.commentOpen)queueMicrotask(()=>{const f=$('#form [data-row="'+r.id+'"] .cmrow input');f&&f.focus()})}},ico(s.comment?'cmtOn':'cmt')));
    if(hasNA)acts.append(h('button',{class:'na ghost','aria-pressed':String(na),type:'button',title:na?'Desfazer NA':'Marcar como NA',onclick:()=>{touch();s.na=!s.na;render()}},na?'Desfazer':'NA'));
    row.append(acts);
  }
  if(s.commentOpen&&r.type!=='derived'){
    const ci=h('input',{type:'text',autocomplete:'off',spellcheck:'false',placeholder:'Comentário (opcional)','aria-label':'Comentário de '+labUi(r)});
    ci.value=s.comment||'';
    ci.addEventListener('input',()=>{s.comment=ci.value;const cb=row.querySelector('.cmt');if(cb)cb.replaceChildren(ico(ci.value.trim()?'cmtOn':'cmt'));refresh()});
    ci.addEventListener('blur',()=>{if(!ci.value.trim()&&s.commentOpen){s.commentOpen=false;render()}});
    row.append(h('div',{class:'cmrow'},ci));
  }
  row.addEventListener('focusin',()=>{setFn(row,r.hint);hl(r.id,true)});
  row.addEventListener('focusout',()=>{setFn(row,'');hl(r.id,false)});
  return row;
}

function cw(card,defNote){const fn=h('div',{class:'fn'},defNote||'');fn.dataset.def=defNote||'';return h('div',{class:'cw'},card,fn)}

/* ---------- cartão de uma seção (principais + "Mais opções") ---------- */
function sectionCard(key,sec,pend,top){
  const all=secRows(sec),rest=all.filter(r=>!isAutoRow(r)),main=rest.filter(r=>!isOpt(r)),opt=rest.filter(isOpt);
  const add=(sec.rows||[]).filter(r=>r.optIn&&r.visible&&!st.optIn.has(r.id)&&!(r.requiredWhen&&matches(r.requiredWhen)));
  if(!main.length&&!opt.length&&!add.length&&!top)return null;
  const card=h('div',{class:'card'});
  if(top)card.append(top);
  main.forEach(r=>card.append(mkRow(r,pend(r.id))));
  const n=opt.length+add.length,open=!!st.more[key];
  if(n){
    card.append(h('button',{class:'more',type:'button','aria-expanded':String(open),onclick:()=>{st.more[key]=!open;render()}},h('span',{},open?'Menos opções':`Mais opções · ${n}`),ico('chev')));
    if(open){opt.forEach(r=>card.append(mkRow(r,pend(r.id))));add.forEach(r=>card.append(h('div',{class:'row add'},h('span'),h('button',{class:'add-btn',type:'button',onclick:()=>{st.optIn.add(r.id);render()}},'+ '+labUi(r)),h('span'))))}
  }
  return cw(card,'');
}

/* ---------- cartão "Preenchido automaticamente" ---------- */
function autoCard(rows,pend){
  const open=st.autoOpen;
  const head=h('button',{class:'auto-h',type:'button','aria-expanded':String(open),'aria-controls':'autoBody',onclick:()=>{st.autoOpen=!open;render()}},
    h('span',{class:'ic'},ico('checkc')),'Preenchido automaticamente',h('span',{class:'c'},String(rows.length),ico('chev')));
  const card=h('div',{class:'card',id:'autoBody'},head);
  if(!open)card.append(h('div',{class:'auto-sum'},rows.map(r=>h('span',{},(AUTO_SHORT[r.id]||labUi(r))+' ',h('b',{},resolved(r))))));
  else rows.forEach(r=>card.append(mkRow(r,pend(r.id))));
  return cw(card,'');
}

/* ---------- seção por CID (uma pequena lista por CID) ---------- */
function cidSection(sec,pend){
  const wrap=h('div',{});
  wrap.append(h('div',{class:'eyebrow'},'CID-level details'));
  st.cids.forEach((cr,i)=>{
    const card=h('div',{class:'card'});
    sec.columns.forEach((c,ci)=>{
      const miss=pend(`cid:${i}:${c.id}`),row=h('div',{class:'row'+(miss?' pending':''),'data-row':`cid:${i}:${c.id}`});
      row.append(h('label',{class:'rl',for:`c-${i}-${c.id}`},labUi(c)+(ci===0&&st.cids.length>1?` ${i+1}`:'')));
      const rv=h('div',{class:'rv'+(c.type==='cid'?' cidv':'')});
      if(c.type==='tbw')rv.append(segCtl(`To Be Worked? ${i+1}`,[['TBW','TBW'],['N-TBW','N-TBW']],cr.tbw,k=>{cr.tbw=k;render()},true));
      else if(c.type==='yn')rv.append(segCtl(`${labUi(c)} ${i+1}`,[['YES','YES'],['NO','NO']],cr.mcc,k=>{cr.mcc=k;render()},true));
      else if(c.type==='smeyes')rv.append(segCtl(`${labUi(c)} ${i+1}`,[['YES','YES'],['NO','NO']],cr.sme||'YES',k=>{cr.sme=k;render()},true));
      else{
        const e=h('input',{id:`c-${i}-${c.id}`,type:'text',autocomplete:'off',spellcheck:'false',placeholder:PH[c.type]||PH.text});e.value=cr[c.id]||'';
        e.addEventListener('input',()=>{cr[c.id]=e.value;cr.auto=false;refresh()});
        if(c.type==='cid')e.addEventListener('blur',()=>{const d=e.value.replace(/\D/g,'');if(d.length===10){e.value=cr[c.id]=`${d.slice(0,3)}-${d.slice(3,6)}-${d.slice(6)}`;refresh()}});
        rv.append(e);
      }
      row.append(rv);
      if(ci===0&&st.cids.length>1)row.append(h('button',{class:'na',type:'button','aria-label':`Remover CID ${i+1}`,onclick:()=>{st.cids.splice(i,1);render()}},ico('close')));
      else row.append(h('span'));
      row.addEventListener('focusin',()=>setFn(row,'A lista de CIDs fica com o caso: trocar de fase não a perde.'));
      row.addEventListener('focusout',()=>setFn(row,''));
      card.append(row);
    });
    wrap.append(cw(card,''));
  });
  const add=h('button',{class:'chip',type:'button',onclick:()=>{if(st.cids.length>=6){toast('Máximo de 6 CIDs, como no template.');return}st.cids.push(newCid());render()}},'+ CID');
  wrap.append(h('div',{class:'sec'},add));
  return wrap;
}

/* ---------- contexto (topo) ---------- */
function ctxNote(){
  if(!st.substatus)return 'Digite o nome ou o atalho (ex.: ts so verif) para achar o sub-status.';
  if(!SUBSTATUS.some(s=>s[0]===st.substatus))return 'Fora da lista oficial. Confirme que está idêntico ao Q+.';
  const f=subRule();
  if(typeof f==='number')return `Follow-up sugerido: ${f} dias úteis.`;
  if(f==='na')return 'Follow-up não se aplica a este sub-status.';
  return 'O follow-up deste sub-status é decisão sua.';
}
// O tipo de nota que o agente usa quase sempre (preferência em Configurações: all|sbse|mms|last).
// Só ele some da tela; os outros dois ficam dentro da linha "Nota", e a linha avisa quando o ativo não é o padrão.
const DEFAULT_SEG='all';
function renderCtx(){
  const c=$('#ctx');c.innerHTML='';
  const s=seg(st.seg),card=h('div',{class:'card ctx'});
  const pick=h('button',{class:'pick',id:'pick',type:'button','aria-haspopup':'listbox','aria-expanded':String(st.pick),onclick:e=>{e.stopPropagation();st.pick?closePick():openPick()}},
    h('span',{class:'rl'},'Sub-status'),h('span',{class:'v'+(st.substatus?'':' empty')},st.substatus||'Escolher'),ico('chev'));
  card.append(pick);
  card.append(h('div',{class:'row chiprow'},h('span',{class:'rl'},'Tasks'),h('div',{class:'chips'},TASKS.map(t=>h('button',{class:'chip',type:'button','aria-pressed':String(st.tasks.has(t.k)),title:t.n,onclick:()=>{st.tasks.has(t.k)?st.tasks.delete(t.k):st.tasks.add(t.k);applyAuto();render()}},TSHORT[t.k]||t.n))),h('span')));
  card.append(h('div',{class:'row chiprow'},h('span',{class:'rl'},s.select==='multi'?'Blocos':'Fase'),h('div',{class:'chips'},s.blocks.filter(p=>!(s.select==='multi'&&(s.always||[]).includes(p.b))).map(p=>{
    const on=st.active.has(p.b),sug=isSuggested(p)&&!on;
    return h('button',{class:'chip',type:'button','aria-pressed':String(on),title:p.when+(sug?' (sugerido)':''),onclick:()=>{if(s.select==='single')st.active=new Set([p.b]);else on?st.active.delete(p.b):st.active.add(p.b);render()}},CHIP[`${s.key}.${p.b}`]||p.title,sug?h('span',{class:'dot','aria-hidden':'true'}):null);
  })),h('span')));
  const sumNote=[st.lang.toUpperCase(),st.flow.toUpperCase(),st.europe?'Caso da Europa':'Fora da Europa'].join(' · ');
  const notePick=h('button',{class:'pick',id:'notePick',type:'button','aria-expanded':String(st.ctxOpen),'aria-controls':'ctxMore',onclick:()=>{st.ctxOpen=!st.ctxOpen;render()}},
    h('span',{class:'rl'},'Nota'),h('span',{class:'v'+(st.europe?' warn':'')},st.seg!==DEFAULT_SEG?h('b',{class:'segtag'},seg(st.seg).name):null,sumNote),ico('chev'));
  notePick.addEventListener('focusin',()=>setFn(notePick,'Tipo de nota, idioma, fluxo e Europa. Abra para trocar.'));
  notePick.addEventListener('focusout',()=>setFn(notePick,''));
  card.append(notePick);
  if(st.ctxOpen){
    const lineSeg=(label,opts,val,fn)=>h('div',{class:'row'},h('span',{class:'rl'},label),h('div',{class:'rv'},segCtl(label,opts,val,fn,true)),h('span'));
    card.append(h('div',{class:'row'},h('span',{class:'rl'},'Tipo'),
      h('div',{class:'rv'},segCtl('Tipo de nota',CATALOG.segments.map(x=>[x.key,x.name]),st.seg,k=>{st.seg=k;resetActive();applyAuto();render()},true),
        h('div',{class:'cap2'},'Sales program no CRM: ',h('span',{},CAPTURED.salesProgram))),h('span')));
    card.append(lineSeg('Idioma',[['pt','PT'],['es','ES'],['en','EN']],st.lang,k=>{st.lang=k;render()}));
    card.append(lineSeg('Fluxo',[['bau','BAU'],['lm','LM']],st.flow,k=>{st.flow=k;applyAuto();render()}));
    card.append(h('div',{class:'row',id:'ctxMore'},h('span',{class:'rl'},'Europa'),h('span',{class:'val muted',style:'font-size:12px;line-height:16px'},'Com Sim, você marca o consentimento'),
      h('button',{class:'sw',type:'button',role:'switch','aria-checked':String(st.europe),'aria-label':'Caso da Europa',onclick:()=>{st.europe=!st.europe;applyAuto();render()}})));
  }
  c.append(cw(card,ctxNote()));
}

/* ---------- seletor de sub-status ---------- */
function closePick(){const p=$('#pop');if(p)p.remove();st.pick=false;const b=$('#pick');if(b)b.setAttribute('aria-expanded','false')}
function openPick(){
  closePick();st.pick=true;
  const bw=$('#bw'),btn=$('#pick'),top=btn.getBoundingClientRect().bottom-bw.getBoundingClientRect().top+4;
  const pop=h('div',{class:'pop',id:'pop',role:'dialog','aria-label':'Escolher sub-status',style:`top:${top}px`});
  const inp=h('input',{type:'text',placeholder:'Buscar por nome ou atalho',autocomplete:'off','aria-label':'Buscar sub-status'});
  const list=h('div',{class:'pop-l',role:'listbox'});
  list.style.maxHeight=Math.max(160,bw.clientHeight-top-72)+'px';
  pop.append(h('div',{class:'pop-s'},ico('search'),inp),list);
  const choose=n=>{st.substatus=n;st.pick=false;applyAuto();render();toast(n+' selecionado.')};
  const opt=n=>h('button',{class:'opt'+(n===st.substatus?' on':''),type:'button',role:'option','aria-selected':String(n===st.substatus),onclick:()=>choose(n)},h('span',{},n),n===st.substatus?h('span',{class:'ck'},ico('check')):h('span',{class:'hk'},HK[n]||''));
  const draw=q=>{
    list.innerHTML='';const ql=q.trim().toLowerCase();let any=false;
    for(const [g,items] of SUB_GROUPS){
      const m=items.filter(n=>!ql||n.toLowerCase().includes(ql)||(HK[n]||'').toLowerCase().includes(ql));
      if(!m.length)continue;any=true;list.append(h('div',{class:'pop-g'},g));m.forEach(n=>list.append(opt(n)));
    }
    if(ql&&!any){list.append(h('div',{class:'pop-g'},'Sem resultado na lista'),h('button',{class:'opt',type:'button',onclick:()=>choose(q.trim())},h('span',{},`Usar “${q.trim()}”`),h('span',{class:'hk'},'ex.: PI - …')))}
  };
  inp.addEventListener('input',()=>draw(inp.value));
  inp.addEventListener('keydown',e=>{
    if(e.key==='Escape'){closePick();$('#pick').focus()}
    if(e.key==='Enter'){const f=list.querySelector('.opt');f&&f.click()}
    if(e.key==='ArrowDown'){e.preventDefault();const f=list.querySelector('.opt');f&&f.focus()}
  });
  list.addEventListener('keydown',e=>{
    const os=[...list.querySelectorAll('.opt')],i=os.indexOf(document.activeElement);
    if(e.key==='ArrowDown'){e.preventDefault();os[Math.min(os.length-1,i+1)].focus()}
    if(e.key==='ArrowUp'){e.preventDefault();i<=0?inp.focus():os[i-1].focus()}
    if(e.key==='Escape'){closePick();$('#pick').focus()}
  });
  draw('');bw.append(pop);btn.setAttribute('aria-expanded','true');inp.focus();
}
document.addEventListener('mousedown',e=>{if(st.pick&&!e.target.closest('#pop')&&!e.target.closest('#pick'))closePick()});

/* ---------- formulário ---------- */
function renderForm(){
  const host=$('#form');host.innerHTML='';
  if(!st.substatus){host.append(h('div',{class:'empty-s'},h('b',{},'Escolha o sub-status'),'Os campos da nota aparecem em seguida, só os que pedem a sua atenção.'));return}
  const miss=missingIds(),pend=id=>st.showPending&&miss.has(id);
  const auto=[];const seen=new Set();
  allVisibleRows().forEach(r=>{if(isAutoRow(r)&&!seen.has(r.id)){seen.add(r.id);auto.push(r)}});
  if(auto.length)host.append(autoCard(auto,pend));
  for(const p of activeAll()){
    const blk=CATALOG.blocks[p.b],isX=p.b==='extras',parts=[];
    blk.sections.forEach((sec,si)=>{
      if(sec.kind==='cid'){parts.push(cidSection(sec,pend));return}
      const key=`${p.b}.${si}`;
      let top=null;
      if(!isX&&secRows(sec).some(r=>['call_summary','case_comments','oncall_comments'].includes(r.id))){
        top=h('div',{class:'row stackc'},h('div',{class:'rl'},'Cenário rápido'),h('div',{class:'chips'},SCEN.map((sc,i)=>h('button',{class:'chip',type:'button',title:sc.sum,onclick:()=>applyScenario(sc)},SCEN_SHORT[i]))));
      }
      const cd=sectionCard(key,sec,pend,top);
      if(!cd)return;
      if(si>0&&sec.kind!=='cid')parts.push(h('div',{class:'sub-h'},secUi(sec.title)));
      parts.push(cd);
    });
    if(!parts.length)continue;
    host.append(h('div',{class:'eyebrow'},SHORT[p.b]||p.title),...parts);
  }
}
function applyScenario(sc){
  const ids=new Set(allVisibleRows().map(r=>r.id));
  const put=(cands,text)=>{const id=cands.find(i=>ids.has(i));if(id){const s=ensure(id);s.v=text;s.na=false;s.touched=true;s.auto=false}};
  put(['call_summary','case_comments','oncall_comments'],sc.sum);put(['substatus_reason'],sc.reason);
  render();toast('Cenário aplicado nos campos de texto.');
}

/* ---------- rodapé, aba, prévia, faixa fixa ---------- */
function refresh(){
  const miss=missingList(),n=miss.length;
  $('#preview').innerHTML=noteHtml(true)||'';
  $('#sTxt').textContent=n?`${n} pendente${n>1?'s':''}`:'Pronta para preencher';
  $('#status').classList.toggle('ready',!n);
  $('#bFill').classList.toggle('blocked',!!n);
  const tb=$('#tBadge');tb.className='bd'+(n?'':' ok');tb.innerHTML='';n?tb.append(String(n)):tb.append(ico('check'));
  const ds=$('#dState');ds.className='pill'+(n?'':' ok');ds.textContent=n?`${n} pendente${n>1?'s':''}`:'Pronta';
  $('#tab').setAttribute('aria-label',n?`Ver a nota (${n} pendentes)`:'Ver a nota (pronta)');
  const sk=$('#sticky');sk.innerHTML='';
  [...(st.seg!==DEFAULT_SEG?[seg(st.seg).name]:[]),st.flow.toUpperCase(),st.lang.toUpperCase(),st.substatus||'Sem sub-status'].forEach((t,i)=>{if(i)sk.append(h('i',{},'·'));sk.append(t)});
  sk.append(ico('up'));
  if(!n)st.showPending=false;
  $('#pbar').classList.toggle('on',st.showPending&&n>0);$('#pTxt').textContent=`${n} pendente${n>1?'s':''}`;
}
function updateSticky(){const b=$('#body'),e=$('#ctxEnd');$('#sticky').classList.toggle('on',b.scrollTop>e.offsetTop-8&&!$('#pbar').classList.contains('on'))}
function render(){
  const b=$('#body'),top=b.scrollTop;
  closePick();renderCtx();renderForm();refresh();
  b.scrollTop=top;updateSticky();
}
function setDrawer(on){st.drawer=on;$('#drawer').classList.toggle('open',on);$('#tab').setAttribute('aria-expanded',String(on));$('#dIn').toggleAttribute('inert',!on)}
function focusRow(id){
  let el=$(`#form [data-row="${id}"]`);
  if(!el){st.autoOpen=true;activeAll().forEach(p=>CATALOG.blocks[p.b].sections.forEach((s,si)=>{st.more[`${p.b}.${si}`]=true}));render();el=$(`#form [data-row="${id}"]`)}
  if(!el)return;
  el.scrollIntoView({block:'center',behavior:'smooth'});
  const f=el.querySelector('input,textarea,button');if(f)f.focus({preventScroll:true});
}
function showPending(){
  st.showPending=true;st.pi=0;render();
  const first=missingIds().values().next().value;
  if(first)focusRow(first);
}
function nextPending(){const ids=[...missingIds()];if(!ids.length)return;st.pi=((st.pi||0)+1)%ids.length;focusRow(ids[st.pi])}
function bulkNA(){
  let n=0;
  for(const r of allVisibleRows()){const s=ensure(r.id);if(rowRequired(r)&&r.na!==false&&resolved(r)===null){s.na=true;n++}}
  render();toast(n?`${n} linha${n>1?'s':''} marcada${n>1?'s':''} como NA.`:'Nada para marcar como NA.');
}
function copyHtml(html){
  const c=h('div',{style:'position:fixed;left:-9999px'});c.innerHTML=html;document.body.append(c);
  const r=document.createRange();r.selectNodeContents(c);const s=getSelection();s.removeAllRanges();s.addRange(r);
  let ok=false;try{ok=document.execCommand('copy')}catch(e){}
  s.removeAllRanges();c.remove();return ok;
}

/* ---------- ligações ---------- */
$('#tab').onclick=()=>setDrawer(!st.drawer);
$('#sticky').onclick=()=>$('#body').scrollTo({top:0,behavior:'smooth'});
$('#body').addEventListener('scroll',updateSticky,{passive:true});
$('#pNext').onclick=nextPending;
$('#pNa').onclick=bulkNA;
$('#status').onclick=()=>{if(missingList().length)showPending();else toast('Nada pendente.')};
$('#bClear').onclick=()=>{st.vals={};st.optIn=new Set();st.more={};st.autoOpen=false;st.substatus='';st.cids=[Object.assign(newCid(),{cid:CAPTURED.cid,auto:true})];resetActive();applyAuto();render();toast('Formulário limpo.')};
$('#bDraft').onclick=()=>toast('Rascunho guardado. Reabre com os mesmos campos, blocos e CIDs.');
$('#bCopy').onclick=()=>{if(missingList().length){showPending();return}copyHtml(noteHtml(false));toast('Texto copiado.')};
$('#bFill').onclick=()=>{if(missingList().length){showPending();return}copyHtml(noteHtml(false));toast('Texto inserido e copiado!')};
$('#preview').addEventListener('click',e=>{const tr=e.target.closest('tr[data-row]');if(tr)focusRow(tr.dataset.row)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&st.drawer&&!st.pick)setDrawer(false)});

(function init(){st.seg=DEFAULT_SEG;resetActive();applyAuto();render()})();

</script></body></html>
