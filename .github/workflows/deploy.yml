name: Build and Deploy (GH Pages & Apps Script)

on:
  push:
    branches:
      - main
      - refactor-structure

jobs:
  # ==========================================
  # JOB 1: FRONTEND (Esbuild -> GitHub Pages)
  # ==========================================
  build-and-deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install esbuild
        run: npm install esbuild

      # --- BUILD DE PRODUÇÃO (Apenas na main) ---
      - name: Build Production (bundle.js)
        if: github.ref == 'refs/heads/main'
        run: ./node_modules/.bin/esbuild src/app.js --bundle --outfile=dist/bundle.js --minify

      # --- BUILD DE DESENVOLVIMENTO (Apenas na refactor) ---
      - name: Build Development (bundle-dev.js)
        if: github.ref == 'refs/heads/refactor-structure'
        run: ./node_modules/.bin/esbuild src/app.js --bundle --outfile=dist/bundle-dev.js --minify
        
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          cname: ''
          keep_files: true

  # ==========================================
  # JOB 2: BACKEND (Clasp -> Google Apps Script)
  # ==========================================
  deploy-backend-gas:
    runs-on: ubuntu-latest
    # Removendo a trava do 'if' para que rode em ambas as branches
    
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Instalar o Google Clasp
        run: npm install -g @google/clasp

      - name: Autenticar Clasp (Forçando credencial local)
        run: |
          # 1. Entra na pasta do backend
          cd gas-backend
          
          # 2. Cria o arquivo de credenciais localmente (dentro da gas-backend)
          cat << 'EOF' > .clasprc.json
          ${{ secrets.CLASPRC_JSON }}
          EOF
          
          # 3. Copia também para o global por garantia
          cp .clasprc.json ~/.clasprc.json

      - name: Validar integridade do JSON
        run: |
          cd gas-backend
          # Testa se o arquivo é um JSON válido. Se não for, o erro aparece AQUI, antes do Clasp.
          jq . .clasprc.json >/dev/null || (echo "ERRO: O Secret CLASPRC_JSON não é um JSON válido!" && exit 1)

      - name: Push para o Apps Script
        run: |
          cd gas-backend
          clasp push -f

      # --- PROMOÇÃO AUTOMÁTICA DA IMPLANTAÇÃO (Apenas na refactor-structure) ---
      # `clasp push` só atualiza o HEAD do projeto (visível no editor); a URL
      # de produção (/exec) fica travada numa versão até alguém promover uma
      # implantação existente pra uma versão nova. Aqui automatizamos essa
      # promoção só pro deployment de desenvolvimento (o ID abaixo é o mesmo
      # SCRIPT_ID usado em src/modules/shared/data-service.js nesta branch —
      # se ele for rotacionado algum dia, atualize os dois em conjunto).
      # A implantação de produção (usada pela `main`) continua manual, de propósito.
      - name: Promover implantação de desenvolvimento
        if: github.ref == 'refs/heads/refactor-structure'
        run: |
          cd gas-backend
          clasp deploy -i "AKfycbxkheuq28ENsHMZMH8t9-u4EIrktHC6cBi-87boDre0jJfl1lnSCPBzaEkw6hy3Cx6fAg" -d "Auto-deploy via GitHub Actions ($GITHUB_SHA)"