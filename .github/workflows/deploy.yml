name: Build and Deploy (GH Pages & Apps Script)

on:
  push:
    branches:
      - main
      - refactor-structure

jobs:
  # ==========================================
  # JOB 1: FRONTEND (Esbuild -> GitHub Pages)
  # ==========================================
  build-and-deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install esbuild
        run: npm install esbuild

      # --- BUILD DE PRODUÇÃO (Apenas na main) ---
      - name: Build Production (bundle.js)
        if: github.ref == 'refs/heads/main'
        run: ./node_modules/.bin/esbuild src/app.js --bundle --outfile=dist/bundle.js --minify

      # --- BUILD DE DESENVOLVIMENTO (Apenas na refactor) ---
      - name: Build Development (bundle-dev.js)
        if: github.ref == 'refs/heads/refactor-structure'
        run: ./node_modules/.bin/esbuild src/app.js --bundle --outfile=dist/bundle-dev.js --minify
        
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          cname: ''
          keep_files: true

  # ==========================================
  # JOB 2: BACKEND (Clasp -> Google Apps Script)
  # ==========================================
  deploy-backend-gas:
    runs-on: ubuntu-latest
    # Removendo a trava do 'if' para que rode em ambas as branches
    
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Instalar o Google Clasp
        run: npm install -g @google/clasp

      - name: Autenticar Clasp (Injetando o Secret)
        run: |
          echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json

      - name: Push para o Apps Script
        run: |
          cd gas-backend
          clasp push -f