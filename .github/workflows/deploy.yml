name: Build and Deploy (Firebase, GH Pages & Apps Script)

on:
  push:
    branches:
      - main
      - refactor-structure

# Declarado explicitamente para que o GITHUB_TOKEN não venha com o conjunto
# permissivo padrão. `id-token: write` é o que permite ao job do frontend
# pedir o token OIDC do WIF, e por isso fica só nele, não aqui.
permissions:
  contents: read

jobs:
  # ==========================================
  # JOB 1: FRONTEND (Esbuild -> GitHub Pages)
  # ==========================================
  build-and-deploy-frontend:
    runs-on: ubuntu-latest
    # O backend vai PRIMEIRO, sempre. Os dois jobs rodavam em paralelo, e é
    # essa corrida que abre a janela de erro: um frontend novo publicado
    # antes do backend chama operações que a implantação ainda não conhece,
    # e o agente vê só o timeout de 15s do JSONP. Na ordem inversa não há
    # janela - backend novo com frontend antigo continua funcionando, porque
    # operação nova que ninguém chama ainda é inofensiva.
    needs: deploy-backend-gas

    # `id-token: write` deixa o runner pedir ao GitHub o token OIDC que o
    # Workload Identity Federation troca por credencial do Google Cloud. É o
    # que substitui uma chave de service account guardada como secret: nada
    # de longa duração fica no repositório, e o token vale minutos.
    #
    # `contents: write` existe por causa do passo legado do GitHub Pages, que
    # empurra um commit para a branch `gh-pages`. Enquanto não houve bloco
    # `permissions:` no workflow, o GITHUB_TOKEN vinha com o conjunto
    # permissivo padrão e isso funcionava por acidente; declarar apenas
    # `contents: read` derrubou a publicação com 403. Some junto com o passo
    # do Pages, no corte - a partir dali o job volta a precisar só de leitura.
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'
          cache: 'npm'

      # `npm ci` no lugar de `npm install esbuild`: instala exatamente o que
      # está no package-lock.json em vez de baixar o compilador solto a cada
      # build. Fecha a #352.
      - name: Install dependencies
        run: npm ci

      # `--define:__CW_BUILD_ENV__` é o que faz src/modules/shared/data-service.js
      # escolher entre o deployment de produção e o de desenvolvimento do Apps
      # Script. Sem ele o bundle cai no fallback "development" e produção passa
      # a falar com o backend que este mesmo workflow republica a cada push na
      # refactor-structure. Se um dia alguém adicionar um terceiro build aqui,
      # ele PRECISA vir com o define - o fallback é silencioso.

      # --- BUILD DE PRODUÇÃO (Apenas na main) ---
      - name: Build Production (bundle.js)
        id: build_prod
        if: github.ref == 'refs/heads/main'
        run: ./node_modules/.bin/esbuild src/app.js --bundle --outfile=dist/bundle.js --minify --define:__CW_BUILD_ENV__='"production"'

      # --- BUILD DE DESENVOLVIMENTO (Apenas na refactor) ---
      - name: Build Development (bundle-dev.js)
        id: build_dev
        if: github.ref == 'refs/heads/refactor-structure'
        run: ./node_modules/.bin/esbuild src/app.js --bundle --outfile=dist/bundle-dev.js --minify --define:__CW_BUILD_ENV__='"development"'
        
      # --- DESTINO ANTIGO: GITHUB PAGES --------------------------------------
      #
      # Vai PRIMEIRO, pela mesma lógica que faz o backend ir antes do frontend:
      # o caminho de que as pessoas já dependem nunca pode ficar refém do
      # caminho novo. Este passo esteve depois do Firebase por um commit, e a
      # primeira falha do deploy novo pulou a publicação legada inteira - os
      # agentes com o favorito antigo teriam ficado sem a atualização por causa
      # de um problema numa rota que nenhum deles usa ainda.
      #
      # Mantido de propósito durante a transição. Enquanto houver agente com o
      # favorito antigo, desligar isto congelaria o bundle dele na última
      # versão publicada - o pior modo de falha, porque a ferramenta continua
      # abrindo e ninguém percebe que parou de receber correções.
      #
      # Remover este passo é o corte, e só depois que todos migrarem. Junto
      # dele, desativar o GitHub Pages nos DOIS repositórios: `case-wizard` e
      # `techsol_DialIn_AutoCopy`, cujo bundle.js ainda responde 200 e é o que
      # o README instalava até recentemente.
      - name: Deploy to GitHub Pages (legado, remover no corte)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          cname: ''
          keep_files: true

      # --- DESTINO NOVO: FIREBASE HOSTING ------------------------------------
      #
      # Autentica por Workload Identity Federation. O GitHub emite um token
      # OIDC para ESTE repositório - não para uma pessoa - e o Google troca
      # por credencial de curta duração. A condição travada no provider
      # (`assertion.repository == 'lucastdcs/case-wizard'`) é o que impede
      # qualquer outro repositório de assumir a mesma identidade.
      #
      # Diferente do CLASPRC_JSON do job de backend, aqui não existe
      # credencial armazenada: nada a vazar, nada a rotacionar.
      #
      # A service account precisa de DOIS papéis, e é fácil parar no primeiro:
      # `firebasehosting.admin` autoriza publicar, mas resolver o projeto passa
      # pela API de gerenciamento e exige `firebase.viewer`. Só com o primeiro,
      # o deploy falha com "Failed to get Firebase project", que parece
      # problema de credencial e é de permissão.

      # A condição dos dois passos abaixo mantém os destinos INDEPENDENTES.
      # Passos de um job são sequenciais, então sem ela um destino que falha
      # pula o outro - e a ordem só decide qual dos dois sequestra o outro. Já
      # aconteceu nos dois sentidos: o Firebase falhando pulou o Pages, depois
      # o Pages falhando pulou o Firebase. O job ainda falha se qualquer um
      # falhar, então nenhum sinal de erro se perde; o que muda é que uma rota
      # quebrada não impede a publicação da outra.
      #
      # A condição olha o BUILD, não só `!cancelled()`. A diferença importa:
      # com `!cancelled()` sozinho, um build que falhasse ainda dispararia o
      # deploy, e `firebase deploy` com dist/ vazio APAGA os arquivos do site.
      # O Pages não corre esse risco porque usa keep_files. Como um dos dois
      # builds é sempre pulado por branch, a condição aceita qualquer um dos
      # dois com sucesso.
      - name: Autenticar no Google Cloud (WIF)
        if: ${{ !cancelled() && (steps.build_prod.outcome == 'success' || steps.build_dev.outcome == 'success') }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: cases-wizard
          workload_identity_provider: projects/185063379439/locations/global/workloadIdentityPools/github/providers/github
          service_account: gh-deployer@cases-wizard.iam.gserviceaccount.com

      # Cada branch publica no SEU site, espelhando a separação que o job de
      # backend já faz entre as implantações do Apps Script:
      #
      #   refactor-structure  ->  cases-wizard-dev.web.app
      #   main                ->  cases-wizard.web.app
      #
      # A versão do firebase-tools é fixa pelo mesmo motivo do `npm ci` acima:
      # nada que constrói ou publica deve ser baixado solto. Ao atualizar,
      # mude aqui de propósito.
      - name: Publicar no Firebase Hosting
        if: ${{ !cancelled() && (steps.build_prod.outcome == 'success' || steps.build_dev.outcome == 'success') }}
        env:
          TARGET: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
          BUNDLE: ${{ github.ref == 'refs/heads/main' && 'bundle.js' || 'bundle-dev.js' }}
        run: |
          # Trava contra publicar vazio. `firebase deploy` sincroniza o
          # diretório: se dist/ chegar sem o bundle, ele não falha - ele apaga
          # o site e reporta sucesso. Falhar aqui é sempre melhor.
          if [ ! -s "dist/${BUNDLE}" ]; then
            echo "::error::dist/${BUNDLE} não existe ou está vazio. Abortando para não esvaziar o site."
            ls -la dist/ || echo "(dist/ nem existe)"
            exit 1
          fi
          echo "Publicando dist/${BUNDLE} ($(stat -c%s "dist/${BUNDLE}") bytes) em hosting:${TARGET}"

          npx --yes firebase-tools@15.28.2 deploy \
            --only "hosting:${TARGET}" \
            --project cases-wizard \
            --message "${GITHUB_SHA}" \
            --non-interactive

  # ==========================================
  # JOB 2: BACKEND (Clasp -> Google Apps Script)
  # ==========================================
  deploy-backend-gas:
    runs-on: ubuntu-latest
    # Removendo a trava do 'if' para que rode em ambas as branches
    
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Instalar o Google Clasp
        run: npm install -g @google/clasp

      - name: Autenticar Clasp (Forçando credencial local)
        run: |
          # 1. Entra na pasta do backend
          cd gas-backend
          
          # 2. Cria o arquivo de credenciais localmente (dentro da gas-backend)
          cat << 'EOF' > .clasprc.json
          ${{ secrets.CLASPRC_JSON }}
          EOF
          
          # 3. Copia também para o global por garantia
          cp .clasprc.json ~/.clasprc.json

      - name: Validar integridade do JSON
        run: |
          cd gas-backend
          # Testa se o arquivo é um JSON válido. Se não for, o erro aparece AQUI, antes do Clasp.
          jq . .clasprc.json >/dev/null || (echo "ERRO: O Secret CLASPRC_JSON não é um JSON válido!" && exit 1)

      - name: Push para o Apps Script
        run: |
          cd gas-backend
          clasp push -f

      # --- PROMOÇÃO DA IMPLANTAÇÃO -------------------------------------------
      #
      # `clasp push` (acima) só atualiza o HEAD do projeto - o que se vê no
      # editor. As URLs /exec e /dev continuam presas à versão promovida pela
      # última vez. Promover é um passo à parte, e é ELE que muda o que os
      # agentes realmente usam.
      #
      # Cada branch promove a SUA implantação, e só a sua:
      #
      #   refactor-structure  ->  implantação de desenvolvimento
      #   main                ->  implantação de produção
      #
      # Ou seja: enquanto não houver merge para a `main`, nada que se faça na
      # branch de desenvolvimento altera a produção. O portão de produção é o
      # merge, não um comando manual depois dele - antes, o frontend ia
      # sozinho para produção a cada push na `main` enquanto o backend
      # esperava alguém lembrar de promovê-lo à mão, e os dois lados
      # divergiam em silêncio.
      #
      # Os IDs abaixo precisam bater com o mapa DEPLOYMENTS de
      # src/modules/shared/data-service.js. Ao rotacionar um, mude os dois.
      #
      # A descrição (data/hora + commit) fica visível em "Gerenciar
      # implantações" no editor do Apps Script, e o mesmo resumo vai pro Job
      # Summary desta execução - dá pra confirmar em que commit cada ambiente
      # está sem precisar abrir o editor.

      - name: Promover implantação de desenvolvimento
        if: github.ref == 'refs/heads/refactor-structure'
        env:
          AMBIENTE: desenvolvimento
          DEPLOYMENT_ID: "AKfycbyUtczRMulDAyO_1ku39Rb01zarPMw1JvO7aNOdJPYeAgCC7G9mmb-P_EuXP6kvo8l2LA"
        run: bash scripts/promote-deployment.sh

      - name: Promover implantação de produção
        if: github.ref == 'refs/heads/main'
        env:
          AMBIENTE: produção
          DEPLOYMENT_ID: "AKfycbxkheuq28ENsHMZMH8t9-u4EIrktHC6cBi-87boDre0jJfl1lnSCPBzaEkw6hy3Cx6fAg"
        run: bash scripts/promote-deployment.sh