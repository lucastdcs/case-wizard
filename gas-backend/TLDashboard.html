<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>TL Dashboard - Powered by Cases Wizard</title>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet" />
    <style>
        :root {
            /* Paleta Gemini AI / Google Materials */
            --bg-base: #0f0f10;
            --surface-level-1: #1c1c1e;
            --surface-level-2: #2c2c2e;
            --surface-level-3: #3a3a3c;
            --border-subtle: rgba(255, 255, 255, 0.08);

            --text-primary: #f2f2f2;
            --text-secondary: #a1a1aa;
            --text-tertiary: #71717a;

            /* Vibrancy Tokens */
            --label: var(--text-primary);
            --secondaryLabel: var(--text-secondary);
            --tertiaryLabel: var(--text-tertiary);

            /* Gradientes e Auras */
            --gemini-blue: #8ab4f8;
            --gemini-purple: #c58af9;
            --gemini-peach: #f2b8b5;
            --gemini-gradient: linear-gradient(90deg, #4285f4, #9b72cb, #d96570);
            --discard-gradient: linear-gradient(135deg, #442726 0%, #1c1c1e 100%);

            --success: #81c995;
            --danger: #f28b82;
            --warning: #fdd663;

            --radius-sm: 12px;
            --radius-md: 18px;
            --radius-lg: 28px;
            --radius-pill: 100px;

            /* Motion Tokens - Springs */
            --spring-standard: cubic-bezier(0.4, 0.0, 0.2, 1);
            --spring-expressive: cubic-bezier(0.175, 0.885, 0.32, 1.275);
            --spring-spatial: cubic-bezier(0.34, 1.56, 0.64, 1); /* Bounce */
            --spring-spatial-functional: cubic-bezier(0.2, 0, 0, 1); /* No bounce */
            --spring-effects: cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Fallback for reduced motion */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }

        body {
            font-family: 'Google Sans', system-ui, sans-serif;
            background-color: var(--bg-base);
            margin: 0;
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Top Navigation - Liquid Glass */
        .topnav {
            background: rgba(15, 15, 16, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            padding: 0 40px;
            height: 80px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-subtle);
        }

        .topnav::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 1px;
            background: var(--gemini-gradient);
            opacity: 0.3;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .brand-main {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 22px;
            font-weight: 500;
            letter-spacing: -0.5px;
        }

        .brand-icon {
            background: var(--gemini-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-variation-settings: 'FILL' 1;
            font-size: 28px !important;
        }

        /* Perfil do Usuário no Header */
        .user-profile-header {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 6px 16px 6px 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-pill);
            border: 1px solid var(--border-subtle);
        }

        .user-photo-container {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.1);
            background: var(--surface-level-3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .user-photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .user-ldap {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
        }

        /* Tab System */
        .tab-container {
            display: flex;
            gap: 8px;
            background: var(--surface-level-1);
            padding: 6px;
            border-radius: var(--radius-pill);
            width: fit-content;
            margin: 32px auto;
            border: 1px solid var(--border-subtle);
        }

        .tab-item {
            padding: 10px 24px;
            border-radius: var(--radius-pill);
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.25s var(--spring-standard);
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid transparent;
        }

        .tab-item:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.05);
        }

        .tab-item.active {
            background: var(--text-primary);
            color: var(--bg-base);
        }

        .tab-item.tab-discard.active {
            background: #f28b82;
            color: #000;
        }

        .tab-badge {
            font-size: 11px;
            background: rgba(0,0,0,0.1);
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 700;
        }

        /* Workspace & Grid */
        .workspace {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 40px 80px 40px;
        }

        .case-grid {
            display: grid;
            gap: 20px;
            opacity: 1;
            transition: opacity 0.3s var(--spring-standard);
        }

        .case-grid.loading {
            opacity: 0.5;
            pointer-events: none;
        }

        .case-card {
            background: var(--surface-level-1);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 24px;
            display: grid;
            grid-template-columns: 2fr 2fr 1.5fr 1fr;
            align-items: center;
            gap: 32px;
            transition: transform 0.3s var(--spring-spatial), background 0.2s var(--spring-standard), box-shadow 0.3s var(--spring-standard);
            position: relative;
            overflow: hidden;
            cursor: pointer;
            height: auto;
            max-height: 500px;
            opacity: 1;
        }

        .case-card:hover {
            background: var(--surface-level-2);
            border-color: rgba(255, 255, 255, 0.12);
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
        }

        .case-card.removing {
            max-height: 0 !important;
            padding-top: 0 !important;
            padding-bottom: 0 !important;
            margin-top: 0 !important;
            margin-bottom: -20px !important;
            opacity: 0 !important;
            transform: scale(0.95) translateY(10px);
            transition: all 300ms var(--spring-spatial-functional) !important;
            pointer-events: none;
        }

        .case-card.success-glow {
            animation: successGlow 0.6s var(--spring-effects);
        }

        @keyframes successGlow {
            0% { box-shadow: 0 0 0 0 rgba(129, 201, 149, 0); }
            50% { box-shadow: 0 0 40px 10px rgba(129, 201, 149, 0.3); }
            100% { box-shadow: 0 0 0 0 rgba(129, 201, 149, 0); }
        }

        /* Custom Modal - Thick Material */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s var(--spring-standard);
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            background: var(--surface-level-1);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            width: 90%;
            max-width: 560px;
            transform: translateY(40px) scale(0.95);
            transition: transform 0.3s var(--spring-spatial);
            overflow: hidden;
            box-shadow: 0 32px 64px rgba(0, 0, 0, 0.6);
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0) scale(1);
        }

        .modal-header {
            padding: 32px 40px 16px 40px;
            font-size: 24px;
            font-weight: 500;
            color: var(--label); /* Vibrancy */
        }

        .modal-body {
            padding: 16px 40px 32px 40px;
            color: var(--secondaryLabel); /* Vibrancy */
            line-height: 1.6;
            font-size: 16px;
        }

        .modal-footer {
            padding: 24px 40px;
            background: rgba(255, 255, 255, 0.03);
            display: flex;
            justify-content: flex-end;
            gap: 16px;
        }

        /* Buttons with Expressive Spring */
        .btn {
            height: 48px;
            padding: 0 28px;
            border-radius: var(--radius-pill);
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: transform 100ms var(--spring-expressive), background 200ms;
            border: none;
        }

        .btn:active {
            transform: scale(0.92); /* Spatial Spring / Tactile bounce via spring-expressive */
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
        }

        .btn-ghost:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }

        .btn-primary {
            background: var(--text-primary);
            color: var(--bg-base);
        }

        .btn-danger {
            background: var(--danger);
            color: #000;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--surface-level-3);
            color: var(--text-primary);
            padding: 14px 28px;
            border-radius: var(--radius-pill);
            font-size: 14px;
            border: 1px solid var(--border-subtle);
            box-shadow: 0 12px 24px rgba(0,0,0,0.4);
            transition: transform 0.3s var(--spring-standard);
            z-index: 2000;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* Loader */
        .shimmer {
            background: linear-gradient(90deg, var(--surface-level-1) 25%, var(--surface-level-2) 50%, var(--surface-level-1) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite linear;
        }

        @keyframes shimmer {
            from { background-position: 200% 0; }
            to { background-position: -200% 0; }
        }
    </style>
</head>

<body>
    <nav class="topnav">
        <div class="brand-container">
            <div class="brand-main">
                <span class="material-symbols-rounded brand-icon">auto_awesome</span>
                Cases Wizard
            </div>
            <div style="width: 1px; height: 28px; background: var(--border-subtle);"></div>
            <div style="display: flex; flex-direction: column;">
                <span style="font-size: 14px; font-weight: 500;">BAU Central</span>
                <span style="font-size: 11px; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 1px;">TL Dashboard</span>
            </div>
        </div>

        <div class="user-profile-header" id="header-user-profile">
            <div class="user-photo-container">
                <span class="material-symbols-rounded" style="font-size: 20px; color: var(--text-tertiary);">person</span>
            </div>
            <span class="user-ldap">Carregando...</span>
        </div>
    </nav>

    <div class="tab-container">
        <div class="tab-item active" onclick="switchTab('creation', this)">
            <span class="material-symbols-rounded" style="font-size: 18px;">add_circle</span>
            Criação
            <span class="tab-badge" id="badge-creation">0</span>
        </div>
        <div class="tab-item tab-discard" onclick="switchTab('discard', this)">
            <span class="material-symbols-rounded" style="font-size: 18px;">delete_sweep</span>
            Descarte
            <span class="tab-badge" id="badge-discard">0</span>
        </div>
        <div class="tab-item" onclick="switchTab('history', this)">
            <span class="material-symbols-rounded" style="font-size: 18px;">history</span>
            Histórico
        </div>
    </div>

    <main class="workspace">
        <div id="case-grid" class="case-grid">
            <!-- Cases will be rendered here -->
        </div>
    </main>

    <!-- Custom Modal Structure -->
    <div id="custom-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header" id="modal-title">Título do Modal</div>
            <div class="modal-body" id="modal-body">Mensagem de corpo do modal.</div>
            <div class="modal-footer" id="modal-footer">
                <!-- Buttons will be injected here -->
            </div>
        </div>
    </div>

    <div id="toast" class="toast">Notificação</div>

    <script>
        let currentData = {
            pendingCreation: [],
            pendingDiscard: [],
            history: []
        };
        let activeTab = 'creation';
        let currentUser = null;

        window.onload = () => {
            loadUserData();
            loadDashboard();
        };

        function loadUserData() {
            google.script.run
                .withSuccessHandler(user => {
                    currentUser = user;
                    const container = document.getElementById('header-user-profile');
                    const ldap = user.ldap;
                    const photoUrl = `https://moma-teams-photos.corp.google.com/photos/${ldap}?sz=600&type=PLUS`;

                    container.innerHTML = `
                        <div class="user-photo-container">
                            <img src="${photoUrl}" class="user-photo" onerror="handleImageError(this, '${ldap[0].toUpperCase()}')">
                        </div>
                        <span class="user-ldap">${ldap}</span>
                    `;
                })
                .getTLUserInfo();
        }

        function handleImageError(img, initial) {
            const container = img.parentElement;
            container.innerHTML = `<span style="font-weight: 700; color: var(--gemini-purple); font-size: 18px;">${initial}</span>`;
        }

        function loadDashboard() {
            const grid = document.getElementById('case-grid');
            grid.classList.add('loading');

            google.script.run
                .withSuccessHandler(data => {
                    currentData = data;
                    grid.classList.remove('loading');
                    updateBadges();
                    renderActiveTab();
                })
                .getTLDashboardData();
        }

        function updateBadges() {
            document.getElementById('badge-creation').textContent = currentData.pendingCreation.length;
            document.getElementById('badge-discard').textContent = currentData.pendingDiscard.length;
        }

        function switchTab(tab, el) {
            if (activeTab === tab) return;

            document.querySelectorAll('.tab-item').forEach(item => item.classList.remove('active'));
            el.classList.add('active');

            activeTab = tab;
            renderActiveTab();
        }

        function renderActiveTab() {
            const grid = document.getElementById('case-grid');
            let list = [];

            if (activeTab === 'creation') list = currentData.pendingCreation;
            else if (activeTab === 'discard') list = currentData.pendingDiscard;
            else list = currentData.history;

            if (list.length === 0) {
                grid.innerHTML = `
                    <div style="padding: 100px; text-align: center; color: var(--text-tertiary);">
                        <span class="material-symbols-rounded" style="font-size: 64px; margin-bottom: 16px;">task_alt</span>
                        <div style="font-size: 18px;">Fila vazia. Tudo em dia!</div>
                    </div>
                `;
                return;
            }

            grid.innerHTML = list.map(c => renderCaseCard(c)).join('');
        }

        function renderCaseCard(c) {
            const isHistory = activeTab === 'history';
            const isDiscard = c.status.includes('DISCARD');
            const date = new Date(c.date).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });

            return `
                <div class="case-card" id="card-${c.id}" onclick="openDetails('${c.id}')">
                    <div>
                        <div style="font-size: 16px; font-weight: 500; margin-bottom: 4px;">${c.advName}</div>
                        <div style="font-size: 13px; color: var(--text-tertiary);">CID: <span style="font-family: monospace; color: var(--gemini-blue);">${c.cid}</span></div>
                    </div>
                    <div>
                        <div style="font-size: 15px; margin-bottom: 4px;">${c.task}</div>
                        <div style="font-size: 13px; color: var(--text-tertiary); display: flex; align-items: center; gap: 4px;">
                            <span class="material-symbols-rounded" style="font-size: 14px;">calendar_today</span>
                            ${date}
                        </div>
                    </div>
                    <div>
                        <div style="font-size: 13px; color: var(--text-secondary);">${c.agentEmail.split('@')[0]}</div>
                        <div style="font-size: 11px; color: var(--text-tertiary);">${c.caseId}</div>
                    </div>
                    <div style="display: flex; justify-content: flex-end; gap: 12px;">
                        ${isHistory ? renderHistoryBadge(c.status) : renderActionButtons(c.id, isDiscard)}
                    </div>
                </div>
            `;
        }

        function renderHistoryBadge(status) {
            let color = 'var(--text-tertiary)';
            let icon = 'info';
            if (status === 'CREATED') { color = 'var(--success)'; icon = 'check_circle'; }
            if (status === 'DISCARDED' || status === 'REJECTED') { color = 'var(--danger)'; icon = 'cancel'; }

            return `
                <div style="display: flex; align-items: center; gap: 6px; color: ${color}; font-size: 13px; font-weight: 500;">
                    <span class="material-symbols-rounded" style="font-size: 18px;">${icon}</span>
                    ${status}
                </div>
            `;
        }

        function renderActionButtons(id, isDiscard) {
            return `
                <button class="btn btn-ghost" style="width: 40px; height: 40px; padding: 0; min-width: 40px;" onclick="event.stopPropagation(); requestDiscard('${id}')">
                    <span class="material-symbols-rounded">close</span>
                </button>
                <button class="btn btn-primary" style="width: 40px; height: 40px; padding: 0; min-width: 40px;" onclick="event.stopPropagation(); requestApprove('${id}')">
                    <span class="material-symbols-rounded">check</span>
                </button>
            `;
        }

        // Custom Modal Logic
        function showModal({ title, body, confirmText, cancelText, onConfirm, type = 'primary' }) {
            const modal = document.getElementById('custom-modal');
            const titleEl = document.getElementById('modal-title');
            const bodyEl = document.getElementById('modal-body');
            const footerEl = document.getElementById('modal-footer');

            titleEl.textContent = title;
            bodyEl.innerHTML = body;
            
            footerEl.innerHTML = `
                <button class="btn btn-ghost" id="modal-cancel">${cancelText || 'Cancelar'}</button>
                <button class="btn ${type === 'danger' ? 'btn-danger' : 'btn-primary'}" id="modal-confirm">${confirmText || 'Confirmar'}</button>
            `;

            document.getElementById('modal-cancel').onclick = closeModal;
            document.getElementById('modal-confirm').onclick = () => {
                onConfirm();
                closeModal();
            };

            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('custom-modal').classList.remove('active');
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // Actions
        function requestApprove(id) {
            showModal({
                title: 'Confirmar Aprovação',
                body: 'Você deseja aprovar este caso? O agente será notificado imediatamente.',
                confirmText: 'Aprovar',
                onConfirm: () => processAction(id, 'CREATED')
            });
        }

        function requestDiscard(id) {
            showModal({
                title: 'Confirmar Descarte',
                body: 'Tem certeza que deseja descartar este caso? Esta ação não pode ser desfeita.',
                confirmText: 'Descartar',
                type: 'danger',
                onConfirm: () => processAction(id, 'DISCARDED')
            });
        }

        function processAction(id, newStatus) {
            const card = document.getElementById(`card-${id}`);
            card.classList.add('success-glow');

            google.script.run
                .withSuccessHandler(() => {
                    card.classList.add('removing');
                    setTimeout(() => {
                        card.remove();
                        loadDashboard(); // Refresh data to sync tabs and badges
                        showToast(newStatus === 'CREATED' ? 'Caso aprovado com sucesso!' : 'Caso descartado.');
                    }, 300);
                })
                .updateBAUCaseStatus(id, newStatus);
        }

        function openDetails(id) {
            const list = [...currentData.pendingCreation, ...currentData.pendingDiscard, ...currentData.history];
            const c = list.find(item => item.id === id);
            if (!c) return;

            showModal({
                title: 'Detalhes do Caso',
                body: `
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                        <div>
                            <div style="font-size: 11px; text-transform: uppercase; color: var(--tertiaryLabel);">Anunciante</div>
                            <div style="color: var(--label);">${c.advName}</div>
                        </div>
                        <div>
                            <div style="font-size: 11px; text-transform: uppercase; color: var(--tertiaryLabel);">CID</div>
                            <div style="color: var(--label); font-family: monospace;">${c.cid}</div>
                        </div>
                        <div>
                            <div style="font-size: 11px; text-transform: uppercase; color: var(--tertiaryLabel);">Task</div>
                            <div style="color: var(--label);">${c.task}</div>
                        </div>
                        <div>
                            <div style="font-size: 11px; text-transform: uppercase; color: var(--tertiaryLabel);">Case ID</div>
                            <div style="color: var(--label);">${c.caseId}</div>
                        </div>
                    </div>
                    <div style="margin-top: 20px;">
                        <div style="font-size: 11px; text-transform: uppercase; color: var(--tertiaryLabel);">Motivo / Justificativa</div>
                        <div style="color: var(--label); font-style: italic; background: rgba(255,255,255,0.03); padding: 12px; border-radius: 8px; margin-top: 4px;">
                            "${c.reason}"
                        </div>
                    </div>
                `,
                confirmText: 'Fechar',
                cancelText: '',
                onConfirm: () => {}
            });
        }
    </script>
</body>
</html>
