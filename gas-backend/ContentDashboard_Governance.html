<!-- Parte de gas-backend/ContentDashboard.html. Ver o cabeçalho de lá. -->
<!-- GOVERNANÇA: Aprovações, Pessoas e Acessos. -->
<script>
        // --- Aprovações ---
        function loadPendingCount() {
            if (!SESSION || !SESSION.canApprove) return;
            google.script.run
                .withSuccessHandler(function (list) {
                    PENDING_TOTAL = (list || []).length;

                    var chip = document.getElementById('pending-count');
                    chip.textContent = PENDING_TOTAL;
                    chip.classList.toggle('hidden', !PENDING_TOTAL);

                    // A home mostra o mesmo número: se ela estiver aberta,
                    // precisa acompanhar em vez de ficar com o valor velho.
                    if (!document.getElementById('pane-home').classList.contains('hidden')) {
                        renderHome();
                    }
                })
                .withFailureHandler(function () { })
                .listPendingApprovals();
        }

        // --- Diff por palavra ---
        //
        // A revisão mostrava dois blocos de texto integral lado a lado, sem
        // realce nenhum. Num corpo de e-mail de quarenta linhas, achar a vírgula
        // que mudou era trabalho manual — e a fila de aprovação existe
        // justamente para evitar o "confie no texto novo".
        //
        // LCS clássico sobre PALAVRAS, não caracteres: a unidade que quem revisa
        // lê é a palavra, e o diff por caractere transforma uma troca de acento
        // num confete ilegível. Vanilla puro, sem biblioteca — o rulebook do
        // projeto proíbe dependência de front sem autorização, e são 30 linhas.
        function separarEmPalavras(texto) {
            // Mantém os separadores como pedaços próprios: assim uma quebra de
            // linha que mudou aparece como mudança, e o texto remonta idêntico.
            return String(texto == null ? '' : texto).split(/(\s+)/).filter(function (p) { return p !== ''; });
        }

        function diffDePalavras(antes, depois) {
            var a = separarEmPalavras(antes);
            var b = separarEmPalavras(depois);

            // Texto muito grande não ganha diff: a matriz do LCS é O(n*m), e
            // travar a fila de revisão é pior que mostrar os dois lados inteiros.
            if (a.length * b.length > 400000) return null;

            var m = a.length, n = b.length;
            var tabela = [];
            for (var i = 0; i <= m; i++) tabela.push(new Array(n + 1).fill(0));

            for (var i = m - 1; i >= 0; i--) {
                for (var j = n - 1; j >= 0; j--) {
                    tabela[i][j] = (a[i] === b[j])
                        ? tabela[i + 1][j + 1] + 1
                        : Math.max(tabela[i + 1][j], tabela[i][j + 1]);
                }
            }

            var pedacos = [];
            var x = 0, y = 0;
            function empurrar(tipo, texto) {
                var ultimo = pedacos[pedacos.length - 1];
                if (ultimo && ultimo.tipo === tipo) ultimo.texto += texto;
                else pedacos.push({ tipo: tipo, texto: texto });
            }

            while (x < m && y < n) {
                if (a[x] === b[y]) { empurrar('igual', a[x]); x++; y++; }
                else if (tabela[x + 1][y] >= tabela[x][y + 1]) { empurrar('saiu', a[x]); x++; }
                else { empurrar('entrou', b[y]); y++; }
            }
            while (x < m) { empurrar('saiu', a[x]); x++; }
            while (y < n) { empurrar('entrou', b[y]); y++; }

            return pedacos;
        }

        // Um lado do diff. `lado` escolhe o que este painel mostra: o texto de
        // antes (o que saiu, marcado) ou o de depois (o que entrou).
        function pintarLado(pedacos, lado) {
            return pedacos.map(function (p) {
                if (p.tipo === 'igual') return esc(p.texto);
                if (lado === 'antes' && p.tipo === 'saiu') {
                    return '<mark class="dif-saiu">' + esc(p.texto) + '</mark>';
                }
                if (lado === 'depois' && p.tipo === 'entrou') {
                    return '<mark class="dif-entrou">' + esc(p.texto) + '</mark>';
                }
                return '';
            }).join('');
        }

        // Modelos de e-mail são HTML. Quem edita já tinha prévia; quem APROVA,
        // que é justamente quem precisa ver o que o anunciante vai receber,
        // revisava o código-fonte em fonte monoespaçada.
        function previaDeEmail(raw) {
            try {
                var v = JSON.parse(raw);
                if (!v || !v.template) return '';
                return '<details class="previa"><summary>Ver como o anunciante recebe</summary>' +
                    '<div class="previa-corpo">' +
                    '<div class="previa-assunto">' + esc(v.subject || '(sem assunto)') + '</div>' +
                    previaIsolada(v.template) +
                    '</div></details>';
            } catch (e) {
                return '';
            }
        }

        function loadApprovals() {
            var host = document.getElementById('approvals-list');

            if (!SESSION.canApprove) {
                host.innerHTML =
                    '<div class="state"><span class="material-symbols-rounded">visibility_off</span>' +
                    '<h2>Seu papel não revisa propostas</h2>' +
                    '<p>Suas próprias propostas aparecem na aba do módulo, com o selo “em revisão”.</p></div>';
                return;
            }

            host.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div>';

            google.script.run
                .withSuccessHandler(function (list) {
                    if (!list || !list.length) {
                        host.innerHTML =
                            '<div class="state"><span class="material-symbols-rounded">task_alt</span>' +
                            '<h2>Nada esperando revisão</h2><p>Toda proposta enviada aparece aqui.</p></div>';
                        return;
                    }

                    host.innerHTML = list.map(function (d) {
                        var cur = d.currentValue ? prettyValue(d.currentValue) : '(item novo)';
                        var neu = d.value ? prettyValue(d.value) : '(remoção — item sai do ar)';

                        // Item novo e remoção não têm o que comparar: não existe
                        // "antes" num, nem "depois" no outro. Nesses dois casos o
                        // texto integral é a informação, e o diff só atrapalharia.
                        var pedacos = (d.currentValue && d.value) ? diffDePalavras(cur, neu) : null;
                        var ladoAntes = pedacos ? pintarLado(pedacos, 'antes') : esc(cur);
                        var ladoDepois = pedacos ? pintarLado(pedacos, 'depois') : esc(neu);

                        var mudou = pedacos && pedacos.some(function (p) { return p.tipo !== 'igual'; });
                        var legenda = pedacos
                            ? (mudou
                                ? '<div class="dif-legenda">Só o que mudou está marcado.</div>'
                                : '<div class="dif-legenda">O texto é idêntico ao que está no ar.</div>')
                            : '';

                        // A prévia é para quem APROVA: quem edita já tinha a dele,
                        // e é o revisor que precisa ver o que o anunciante recebe.
                        var previa = (d.module === 'email_template' && d.value)
                            ? previaDeEmail(d.value) : '';
                        var selfNote = d.isSelfProposed
                            ? (d.canReview
                                ? '<div class="note warn">Proposta sua. Como ADMIN, você pode aprovar mesmo assim — fica registrado como autoaprovação.</div>'
                                : '<div class="note warn">Proposta sua. Outra pessoa precisa revisar.</div>')
                            : '';

                        return '<div class="card">' +
                            '<div class="row-between">' +
                            '<div><div class="card-title">' + esc(d.label) + '</div>' +
                            '<p class="card-sub">' + esc(d.module) + ' · ' + esc(d.key) +
                            ' · proposto por <strong>' + esc(d.proposedBy) + '</strong></p></div>' +
                            '<span class="estado estado-espera">pendente</span>' +
                            '</div>' + selfNote + legenda +
                            '<div class="diff">' +
                            '<div class="diff-side"><div class="diff-label">Hoje no ar</div>' +
                            '<div class="diff-body">' + ladoAntes + '</div></div>' +
                            '<div class="diff-side new"><div class="diff-label">Proposto</div>' +
                            '<div class="diff-body">' + ladoDepois + '</div></div>' +
                            '</div>' + previa +
                            // Em prévia a fila é para OLHAR. Quem está vendo como
                            // outra pessoa não está decidindo, e a decisão sairia
                            // no nome de quem clicou, não no do papel previsto.
                            (MODO_PREVIA ? '' :
                                '<div class="modal-actions" style="margin-top:8px">' +
                                '<button class="btn btn-danger btn-sm" onclick="reviewDraft(\'' + d.draftId + '\',false)">Rejeitar</button>' +
                                '<button class="btn btn-success btn-sm" onclick="reviewDraft(\'' + d.draftId + '\',true)"' +
                                (d.canReview ? '' : ' disabled') + '>Aprovar e publicar</button>' +
                                '</div>') +
                            '</div>';
                    }).join('');
                })
                .withFailureHandler(function (err) {
                    host.innerHTML = '<div class="state"><span class="material-symbols-rounded">error</span>' +
                        '<h2>Falha ao carregar a fila</h2><p>' + esc(err.message) + '</p></div>';
                })
                .listPendingApprovals();
        }

        // Links chegam como JSON; mostrar o objeto cru na revisão atrapalha mais
        // do que ajuda, então viram linhas legíveis.
        function prettyValue(raw) {
            try {
                var v = JSON.parse(raw);
                // Registro de pessoa: o revisor precisa ver o que a mudança
                // PRODUZ (idioma e acesso), não só os campos digitados — é
                // disso que depende a decisão dele.
                if (v && v.ldap && v.roleCategory) {
                    return 'LDAP: ' + v.ldap +
                        '\nCargo: ' + (v.role || '—') +
                        '\nCategoria: ' + (v.roleCategory || '—') +
                        '\nSegmento: ' + (v.segment || '—') +
                        '\nIdioma do app: ' + peopleLangFor(v.segment) +
                        '\nAcesso: ' + (peopleIsOverhead(v.roleCategory) ? 'liderança (abre o TL Dashboard)' : 'agente');
                }
                if (v && v.url) {
                    return 'Nome: ' + v.name + '\nURL: ' + v.url +
                        '\nDescrição (PT): ' + (v.desc || '—') +
                        '\nDescrição (ES): ' + (v.desc_es || '—');
                }
                // Modelo de e-mail: o revisor compara ASSUNTO e CORPO, não um
                // objeto JSON. Sem isto o diff marcava aspas e chaves como se
                // fossem conteúdo, e a mudança real sumia no meio.
                if (v && typeof v.template === 'string') {
                    return 'Assunto: ' + (v.subject || '—') + '\n\n' + v.template;
                }
                // Aviso: tipo, título e texto — a mesma leitura que o agente faz.
                if (v && v.text && v.type) {
                    return 'Tipo: ' + v.type + '\nTítulo: ' + (v.title || '—') + '\n\n' + v.text;
                }
                // Modelo de nota: um campo por linha, na ordem em que a nota os
                // usa. O objeto cru esconde justamente qual campo mudou.
                if (v && v.fields && typeof v.fields === 'object') {
                    var campos = Object.keys(v.fields).map(function (k) {
                        return k.replace(/^field-/, '') + ': ' + v.fields[k];
                    });
                    return campos.length ? campos.join('\n') : raw;
                }
                return raw;
            } catch (e) {
                return raw;
            }
        }

        function reviewDraft(draftId, approve) {
            if (approve) {
                google.script.run
                    .withSuccessHandler(function (res) {
                        toast(res.outcome
                            ? peopleOutcomeMessage(res)
                            : (res.action === 'remove'
                                ? 'Item retirado do ar. A versão fica arquivada e pode voltar.'
                                : 'Publicado (versão ' + res.version + ').'));
                        loadApprovals();
                        loadPendingCount();
                        refreshContentLists();
                    })
                    .withFailureHandler(function (err) { toast(err.message, true); })
                    .approveContentDraft(draftId, '');
                return;
            }

            document.getElementById('modal-root').innerHTML =
                '<div class="modal-backdrop" onclick="if(event.target===this)closeModal()">' +
                '<div class="modal" role="dialog" aria-modal="true">' +
                '<h2>Rejeitar proposta</h2>' +
                '<p class="card-sub">Volta como rascunho para quem propôs, com o seu comentário.</p>' +
                '<label class="fld" for="rej-note">Motivo</label>' +
                '<textarea id="rej-note" placeholder="o que precisa mudar"></textarea>' +
                '<div class="modal-actions">' +
                '<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>' +
                '<button class="btn btn-danger" id="rej-go">Rejeitar</button>' +
                '</div></div></div>';

            document.getElementById('rej-go').onclick = function () {
                var note = document.getElementById('rej-note').value.trim();
                if (!note) return toast('Explique o motivo para quem propôs.', true);
                this.disabled = true;

                google.script.run
                    .withSuccessHandler(function () {
                        closeModal();
                        toast('Proposta devolvida ao autor.');
                        loadApprovals();
                        loadPendingCount();
                    })
                    .withFailureHandler(function (err) { toast(err.message, true); })
                    .rejectContentDraft(draftId, note);
            };
        }

        // --- Pessoas (aba People da planilha) ---
        //
        // A tela derive as MESMAS coisas que o backend deriva (idioma e
        // liderança) para poder mostrá-las enquanto a pessoa digita, antes de
        // salvar. As duas cópias não podem divergir: as funções servidoras são
        // defaultLanguageForSegment() e isOverheadRoleCategory(), no Código.gs,
        // e o teste `npm run test:people` prova o resultado do lado de lá.
        var PEOPLE = [];
        var PPL_SEGMENT = '';
        var PPL_QUERY = '';
        var PPL_EDITING = null;   // ldap em edição, '__new__', ou null
        var PPL_FLASH = null;     // { ldap, kind } a piscar no próximo render

        var PPL_NEW = '__new__';

        function peopleLangFor(segment) {
            var seg = String(segment || '').toLowerCase().trim();
            if (seg === 'es') return 'ES';
            if (seg === 'en') return 'EN';
            return 'PT-BR';
        }

        // Regra por lista de EXCLUSÃO, igual à do servidor: qualquer categoria
        // que não seja agent/apprentice conta como liderança. É permissiva de
        // propósito lá, e a tela mostra isso em vez de escondê-lo — daí o aviso
        // no editor quando a categoria digitada dá acesso.
        function peopleIsOverhead(roleCategory) {
            var c = String(roleCategory || '').toLowerCase();
            return !(c.indexOf('agent') !== -1 || c.indexOf('apprentice') !== -1);
        }

        // Paleta de identificação. Segmentos conhecidos têm cor fixa; qualquer
        // outro cai num hash estável — um segmento novo na planilha nasce com
        // cor própria e constante, sem precisar de deploy.
        var PPL_SEGMENT_COLORS = {
            pt: { bg: '#E8F0FE', fg: '#174EA6', dot: '#1A73E8' },
            'pt-br': { bg: '#E8F0FE', fg: '#174EA6', dot: '#1A73E8' },
            es: { bg: '#FEF7E0', fg: '#B06000', dot: '#F9AB00' },
            en: { bg: '#E6F4EA', fg: '#0D652D', dot: '#1E8E3E' },
            staff: { bg: '#F3E8FD', fg: '#6A1B9A', dot: '#9B72CB' }
        };

        var PPL_FALLBACK_COLORS = [
            { bg: '#E0F7F5', fg: '#00695C', dot: '#00BFA5' },
            { bg: '#FCE8E6', fg: '#B3261E', dot: '#D93025' },
            { bg: '#EDE7F6', fg: '#4527A0', dot: '#673AB7' },
            { bg: '#FFF3E0', fg: '#8C4B00', dot: '#E8710A' },
            { bg: '#E8EAED', fg: '#3C4043', dot: '#80868B' }
        ];

        function pplHashColor(value) {
            var str = String(value || '');
            var h = 0;
            for (var i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) % 100000;
            return PPL_FALLBACK_COLORS[h % PPL_FALLBACK_COLORS.length];
        }

        function pplSegmentColor(segment) {
            var key = String(segment || '').toLowerCase().trim();
            return PPL_SEGMENT_COLORS[key] || pplHashColor('seg:' + key);
        }

        // Categorias herdam a mesma ideia, com uma exceção que é semântica e não
        // estética: tudo que dá liderança vem no roxo Gemini, porque é o estado
        // que muda quem entra no TL Dashboard.
        function pplCategoryColor(category) {
            var key = String(category || '').toLowerCase().trim();
            if (peopleIsOverhead(key)) return { bg: '#F3E8FD', fg: '#6A1B9A', dot: '#9B72CB' };
            if (key.indexOf('apprentice') !== -1) return { bg: '#E0F7F5', fg: '#00695C', dot: '#00BFA5' };
            return { bg: '#E8EAED', fg: '#3C4043', dot: '#80868B' };
        }

        function pplChip(text, color) {
            return '<span class="ppl-chip" style="background:' + color.bg + ';color:' + color.fg + '">' +
                '<span class="ppl-dot" style="background:' + color.dot + '" aria-hidden="true"></span>' +
                esc(text || '—') + '</span>';
        }

        function peopleOutcomeMessage(res) {
            if (res.outcome === 'removed') return 'Baixa aplicada. A pessoa perdeu o perfil e volta ao acesso mínimo.';
            if (res.outcome === 'created') return 'Pessoa cadastrada. O perfil vale no próximo carregamento do app dela.';
            return 'Alteração aplicada na aba People.';
        }

        function loadPeople() {
            google.script.run
                .withSuccessHandler(function (list) {
                    PEOPLE = list || [];
                    renderPeople();
                })
                .withFailureHandler(function (err) {
                    document.getElementById('people-list').innerHTML =
                        '<div class="state"><span class="material-symbols-rounded">error</span>' +
                        '<h2>Não foi possível carregar o time</h2><p>' + esc(err.message) + '</p></div>';
                })
                .listPeople();
        }

        function pplMatches(p) {
            if (PPL_SEGMENT && String(p.segment).toLowerCase() !== PPL_SEGMENT) return false;
            if (!PPL_QUERY) return true;
            var hay = (p.ldap + ' ' + p.role + ' ' + p.roleCategory + ' ' + p.segment).toLowerCase();
            return hay.indexOf(PPL_QUERY) !== -1;
        }

        function renderPeople() {
            renderPeopleFilters();

            var host = document.getElementById('people-list');
            var visible = PEOPLE.filter(pplMatches);
            var lideranca = PEOPLE.filter(function (p) { return p.isOverhead && !p.isIncoming; }).length;
            var emRevisao = PEOPLE.filter(function (p) { return !!p.pending; }).length;

            document.getElementById('ppl-summary').textContent =
                PEOPLE.filter(function (p) { return !p.isIncoming; }).length + ' pessoas · ' +
                lideranca + ' com acesso de liderança' +
                (emRevisao ? ' · ' + emRevisao + ' em revisão' : '') +
                (visible.length !== PEOPLE.length ? ' · ' + visible.length + ' na busca' : '');

            var html = visible.length
                ? '<div class="ppl-head" aria-hidden="true">' +
                  '<div class="ppl-id">Pessoa</div>' +
                  '<div class="ppl-chips">Categoria e segmento</div>' +
                  '<div class="ppl-lang">Idioma</div>' +
                  '<div class="ppl-actions">&nbsp;</div>' +
                  '</div>'
                : '';
            html += (PPL_EDITING === PPL_NEW) ? renderPersonEditor(null) : '';

            if (!visible.length && PPL_EDITING !== PPL_NEW) {
                html += '<div class="state"><span class="material-symbols-rounded">group_off</span>' +
                    '<h2>' + (PEOPLE.length ? 'Ninguém bate com a busca' : 'A aba People está vazia') + '</h2>' +
                    '<p>' + (PEOPLE.length
                        ? 'Limpe a busca ou o filtro de segmento.'
                        : 'Cadastre a primeira pessoa para o app parar de tratar todo mundo como agente sem perfil.') +
                    '</p></div>';
            }

            visible.forEach(function (p) {
                html += (PPL_EDITING === p.ldap) ? renderPersonEditor(p) : renderPersonRow(p);
            });

            host.innerHTML = html;
            pplWireEditor();
            pplPlayFlash();
        }

        function renderPeopleFilters() {
            var segs = [];
            PEOPLE.forEach(function (p) {
                var s = String(p.segment || '').trim();
                if (s && segs.indexOf(s) === -1) segs.push(s);
            });
            segs.sort();

            var host = document.getElementById('ppl-filters');
            var botoes = [['', 'Todos os segmentos']].concat(segs.map(function (s) { return [s.toLowerCase(), s]; }));

            host.innerHTML = botoes.map(function (b) {
                var ativo = (PPL_SEGMENT === b[0]);
                var cor = b[0] ? pplSegmentColor(b[0]) : null;
                return '<button type="button" class="ppl-filter" data-act="filter" data-seg="' + esc(b[0]) + '"' +
                    ' aria-pressed="' + ativo + '">' +
                    (cor ? '<span class="ppl-dot" style="background:' + cor.dot + '" aria-hidden="true"></span>' : '') +
                    esc(b[1]) + '</button>';
            }).join('');
        }

        function renderPersonRow(p) {
            var pend = p.pending;
            var classes = 'ppl-row' + (pend ? ' is-pending' : '') + (p.isIncoming ? ' is-incoming' : '');

            var acoes = pend
                ? '<span class="pill pending">em revisão</span>'
                : '<button class="btn btn-ghost btn-sm" data-act="edit" data-ldap="' + esc(p.ldap) + '"' +
                  ' aria-label="Editar ' + esc(p.ldap) + '">Editar</button>' +
                  '<button class="btn btn-ghost btn-sm" data-act="remove" data-ldap="' + esc(p.ldap) + '"' +
                  ' aria-label="Dar baixa em ' + esc(p.ldap) + '">Dar baixa</button>';

            var linha = '<div class="' + classes + '" data-row="' + esc(p.ldap) + '">' +
                '<div class="ppl-id">' +
                '<div class="ppl-ldap">' + esc(p.ldap) +
                (p.isOverhead
                    ? '<span class="ppl-lead" title="Abre o TL Dashboard">' +
                      '<span class="material-symbols-rounded" aria-hidden="true">shield_person</span>' +
                      '<span class="sr-only">acesso de liderança</span></span>'
                    : '') +
                '</div>' +
                '<div class="ppl-role">' + esc(p.role || '—') + '</div>' +
                '</div>' +
                '<div class="ppl-chips">' +
                pplChip(p.roleCategory, pplCategoryColor(p.roleCategory)) +
                pplChip(p.segment, pplSegmentColor(p.segment)) +
                '</div>' +
                '<div class="ppl-lang" title="Idioma em que o app abre para esta pessoa">' +
                '<span class="sr-only">Idioma do app: </span>' +
                '<span class="ppl-lang-code">' + esc(p.defaultLanguage) + '</span></div>' +
                '<div class="ppl-actions">' + acoes + '</div>' +
                '</div>';

            if (pend) {
                var proposto = pend.action === 'remove'
                    ? 'baixa proposta'
                    : pplDescribeChange(p, pend);
                linha += '<div class="ppl-pending-note">' + esc(proposto) +
                    ' · proposto por ' + esc(pend.proposedBy) +
                    ' · aguardando o ADMIN na aba Aprovações</div>';
            }

            return linha;
        }

        // Diz o que MUDA, não o que foi enviado: numa fila, "segmento PT → ES"
        // se lê num relance, e o objeto inteiro não.
        function pplDescribeChange(atual, pend) {
            var novo;
            try { novo = JSON.parse(pend.value || '{}'); } catch (e) { novo = {}; }

            if (atual.isIncoming) return 'entrada proposta';

            var difs = [];
            if (novo.role && novo.role !== atual.role) difs.push('cargo ' + atual.role + ' → ' + novo.role);
            if (novo.roleCategory && novo.roleCategory !== atual.roleCategory) {
                difs.push('categoria ' + atual.roleCategory + ' → ' + novo.roleCategory);
            }
            if (novo.segment && novo.segment !== atual.segment) {
                difs.push('segmento ' + atual.segment + ' → ' + novo.segment);
            }
            return difs.length ? difs.join(' · ') : 'alteração proposta';
        }

        function pplDatalist(id, values) {
            var vistos = {};
            var opts = '';
            values.forEach(function (v) {
                var val = String(v || '').trim();
                if (!val || vistos[val.toLowerCase()]) return;
                vistos[val.toLowerCase()] = true;
                opts += '<option value="' + esc(val) + '"></option>';
            });
            return '<datalist id="' + id + '">' + opts + '</datalist>';
        }

        // Editor no lugar da linha. `p` nulo = admissão.
        function renderPersonEditor(p) {
            var novo = !p;
            var podeAplicar = SESSION && SESSION.canSelfApprove;

            return '<div class="ppl-editor" data-editor="1">' +
                '<div class="card-title" style="margin-bottom:10px">' +
                (novo ? 'Adicionar pessoa' : 'Editando ' + esc(p.ldap)) + '</div>' +
                (novo
                    ? '<label class="fld" for="ppl-f-ldap">LDAP</label>' +
                      '<input type="text" id="ppl-f-ldap" autocomplete="off" placeholder="ex.: anaflor">'
                    : '') +
                '<div class="ppl-editor-grid">' +
                '<div><label class="fld" for="ppl-f-role">Cargo</label>' +
                '<input type="text" id="ppl-f-role" list="ppl-dl-role" autocomplete="off" value="' +
                esc(novo ? '' : p.role) + '"></div>' +
                '<div><label class="fld" for="ppl-f-cat">Categoria</label>' +
                '<input type="text" id="ppl-f-cat" list="ppl-dl-cat" autocomplete="off" value="' +
                esc(novo ? '' : p.roleCategory) + '"></div>' +
                '<div><label class="fld" for="ppl-f-seg">Segmento (fluxo)</label>' +
                '<input type="text" id="ppl-f-seg" list="ppl-dl-seg" autocomplete="off" value="' +
                esc(novo ? '' : p.segment) + '"></div>' +
                '</div>' +
                pplDatalist('ppl-dl-role', PEOPLE.map(function (x) { return x.role; })) +
                pplDatalist('ppl-dl-cat', PEOPLE.map(function (x) { return x.roleCategory; })) +
                pplDatalist('ppl-dl-seg', PEOPLE.map(function (x) { return x.segment; })) +
                '<div class="ppl-derived" id="ppl-derived" role="status" aria-live="polite"></div>' +
                '<div class="modal-actions" style="margin-top:14px">' +
                '<button class="btn btn-ghost" data-act="cancel">Cancelar</button>' +
                '<button class="btn btn-primary" data-act="save" data-ldap="' + esc(novo ? '' : p.ldap) + '">' +
                (podeAplicar ? 'Salvar' : 'Enviar para aprovação') + '</button>' +
                '</div></div>';
        }

        // Mostra, enquanto se digita, o que a regra do servidor VAI derivar. Sem
        // isto, "Segmento" é um campo de texto qualquer — e é ele que decide o
        // idioma em que o app abre para a pessoa.
        function pplRefreshDerived() {
            var host = document.getElementById('ppl-derived');
            if (!host) return;

            var seg = (document.getElementById('ppl-f-seg') || {}).value || '';
            var cat = (document.getElementById('ppl-f-cat') || {}).value || '';
            var lider = peopleIsOverhead(cat);

            host.innerHTML =
                '<span>O app abrirá em <strong>' + esc(peopleLangFor(seg)) + '</strong></span>' +
                '<span aria-hidden="true">·</span>' +
                (String(cat).trim()
                    ? (lider
                        ? '<span class="ppl-warn-lead">esta categoria dá acesso de liderança (TL Dashboard)</span>'
                        : '<span>sem acesso de liderança</span>')
                    : '<span>preencha a categoria</span>');
        }

        function pplWireEditor() {
            var editor = document.querySelector('[data-editor]');
            if (!editor) return;

            ['ppl-f-seg', 'ppl-f-cat'].forEach(function (id) {
                var el = document.getElementById(id);
                if (el) el.addEventListener('input', pplRefreshDerived);
            });
            pplRefreshDerived();

            editor.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' && e.target.tagName === 'INPUT') {
                    e.preventDefault();
                    editor.querySelector('[data-act="save"]').click();
                }
                if (e.key === 'Escape') {
                    e.stopPropagation();
                    closePersonEditor();
                }
            });

            var primeiro = document.getElementById('ppl-f-ldap') || document.getElementById('ppl-f-role');
            if (primeiro) primeiro.focus();
        }

        function openPersonEditor(ldap) {
            PPL_EDITING = ldap || PPL_NEW;
            renderPeople();
        }

        function closePersonEditor() {
            PPL_EDITING = null;
            renderPeople();
        }

        function savePerson(ldapOriginal, btn) {
            var campoLdap = document.getElementById('ppl-f-ldap');
            var payload = {
                ldap: campoLdap ? campoLdap.value : ldapOriginal,
                role: (document.getElementById('ppl-f-role') || {}).value || '',
                roleCategory: (document.getElementById('ppl-f-cat') || {}).value || '',
                segment: (document.getElementById('ppl-f-seg') || {}).value || ''
            };

            btn.disabled = true;

            google.script.run
                .withSuccessHandler(function (res) {
                    PPL_EDITING = null;
                    PPL_FLASH = { ldap: res.ldap, kind: res.applied ? 'applied' : 'queued' };
                    toast(res.applied
                        ? (res.isNew
                            ? 'Pessoa cadastrada. O perfil vale no próximo carregamento do app dela.'
                            : 'Alteração aplicada na aba People.')
                        : 'Enviado para aprovação do ADMIN. Nada mudou na planilha ainda.');
                    loadPeople();
                    loadPendingCount();
                })
                .withFailureHandler(function (err) {
                    btn.disabled = false;
                    toast(err.message, true);
                })
                .savePeopleChange(payload);
        }

        function askPersonRemoval(ldap) {
            document.getElementById('modal-root').innerHTML =
                '<div class="modal-backdrop" onclick="if(event.target===this)closeModal()">' +
                '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="ppl-rm-title">' +
                '<h2 id="ppl-rm-title">Dar baixa em ' + esc(ldap) + '</h2>' +
                '<p class="card-sub">A linha sai da aba People. A pessoa passa a ser tratada pelo app como ' +
                'agente sem perfil, sem nenhum acesso de liderança. O histórico fica na fila e no log.</p>' +
                '<label class="fld" for="ppl-rm-note">Motivo</label>' +
                '<textarea id="ppl-rm-note" placeholder="saiu do time, mudou de área…"></textarea>' +
                '<div class="modal-actions">' +
                '<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>' +
                '<button class="btn btn-danger" id="ppl-rm-go">Dar baixa</button>' +
                '</div></div></div>';

            document.getElementById('ppl-rm-note').focus();

            document.getElementById('ppl-rm-go').onclick = function () {
                var motivo = document.getElementById('ppl-rm-note').value.trim();
                if (!motivo) return toast('Diga o motivo da baixa.', true);
                this.disabled = true;

                google.script.run
                    .withSuccessHandler(function (res) {
                        closeModal();
                        PPL_FLASH = { ldap: res.ldap, kind: res.applied ? 'applied' : 'queued' };
                        toast(res.applied
                            ? 'Baixa aplicada. A pessoa perdeu o perfil e volta ao acesso mínimo.'
                            : 'Baixa enviada para aprovação do ADMIN. Ninguém saiu da planilha ainda.');
                        loadPeople();
                        loadPendingCount();
                    })
                    .withFailureHandler(function (err) {
                        document.getElementById('ppl-rm-go').disabled = false;
                        toast(err.message, true);
                    })
                    .requestPeopleRemoval(ldap, motivo);
            };
        }

        // O pisca acontece DEPOIS do repinte, na linha que mudou: é o que liga o
        // toast ("aplicado") ao lugar onde aquilo aconteceu.
        function pplPlayFlash() {
            if (!PPL_FLASH) return;
            var row = document.querySelector('[data-row="' + PPL_FLASH.ldap + '"]');
            var kind = PPL_FLASH.kind;
            PPL_FLASH = null;
            if (!row) return;

            row.classList.add('flash-' + kind);
            row.scrollIntoView({ block: 'nearest' });
            setTimeout(function () { row.classList.remove('flash-' + kind); }, 950);
        }

        // Um listener só para a lista inteira: as linhas são repintadas a cada
        // alteração, e religar handler por botão a cada render é como se perde
        // clique em lista que muda.
        document.getElementById('people-list').addEventListener('click', function (e) {
            var btn = e.target.closest('[data-act]');
            if (!btn) return;
            var act = btn.dataset.act;

            if (act === 'edit') openPersonEditor(btn.dataset.ldap);
            else if (act === 'remove') askPersonRemoval(btn.dataset.ldap);
            else if (act === 'cancel') closePersonEditor();
            else if (act === 'save') savePerson(btn.dataset.ldap, btn);
        });

        document.getElementById('ppl-filters').addEventListener('click', function (e) {
            var btn = e.target.closest('[data-act="filter"]');
            if (!btn) return;
            PPL_SEGMENT = btn.dataset.seg;
            renderPeople();
        });

        document.getElementById('ppl-search').addEventListener('input', function (e) {
            PPL_QUERY = e.target.value.toLowerCase().trim();
            renderPeople();
        });

        // --- Auditoria completa ---
        //
        // A barra lateral responde "o que está acontecendo"; esta responde "o
        // que aconteceu". São perguntas diferentes, e é por isso que são duas
        // telas: a barra tem janela fixa e nenhum filtro, esta tem filtro,
        // período e paginação.
        //
        // O cursor é o número da LINHA da planilha onde a varredura parou. É o
        // que faz "carregar mais" custar sempre o mesmo: paginar por "pule N
        // resultados" obrigaria o servidor a refiltrar tudo que já foi mostrado.
        var AUD_CURSOR = 0;
        var AUD_LINHAS = [];
        var AUD_MONTADO = false;

        function filtroDaAuditoria() {
            return {
                text: document.getElementById('aud-texto').value.trim(),
                actor: document.getElementById('aud-quem').value.trim(),
                action: document.getElementById('aud-acao').value,
                module: document.getElementById('aud-modulo').value,
                from: document.getElementById('aud-de').value,
                to: document.getElementById('aud-ate').value
            };
        }

        function montarFiltrosDaAuditoria() {
            if (AUD_MONTADO) return;
            AUD_MONTADO = true;

            var acao = document.getElementById('aud-acao');
            acao.innerHTML = '<option value="">Todas</option>' +
                Object.keys(ATIVIDADE_VERBO).sort().map(function (a) {
                    return '<option value="' + esc(a) + '">' + esc(ATIVIDADE_VERBO[a]) + '</option>';
                }).join('');

            var mod = document.getElementById('aud-modulo');
            mod.innerHTML = '<option value="">Todos</option>' +
                (SESSION.modules || []).map(function (m) {
                    return '<option value="' + esc(m) + '">' +
                        esc(ATIVIDADE_MODULO[m] || m) + '</option>';
                }).join('');
        }

        function loadAudit() {
            if (!SESSION.canViewAudit) return;
            montarFiltrosDaAuditoria();
            buscarAuditoria();
        }

        function buscarAuditoria() {
            AUD_CURSOR = 0;
            AUD_LINHAS = [];
            document.getElementById('aud-lista').innerHTML =
                '<div class="skeleton"></div><div class="skeleton"></div>';
            pedirAuditoria(null);
        }

        function maisAuditoria(btn) {
            pedirAuditoria(btn);
        }

        function limparAuditoria() {
            ['aud-texto', 'aud-quem', 'aud-de', 'aud-ate'].forEach(function (id) {
                document.getElementById(id).value = '';
            });
            document.getElementById('aud-acao').value = '';
            document.getElementById('aud-modulo').value = '';
            buscarAuditoria();
        }

        function pedirAuditoria(btn) {
            if (btn) { btn.disabled = true; btn.textContent = 'Carregando…'; }

            google.script.run
                .withSuccessHandler(function (r) {
                    if (btn) { btn.disabled = false; btn.textContent = 'Carregar mais'; }
                    AUD_LINHAS = AUD_LINHAS.concat(r.rows || []);
                    AUD_CURSOR = r.nextCursor || 0;
                    renderAuditoria(r);
                })
                .withFailureHandler(function (err) {
                    if (btn) { btn.disabled = false; btn.textContent = 'Carregar mais'; }
                    document.getElementById('aud-lista').innerHTML =
                        '<div class="note warn">' + esc(err.message) + '</div>';
                })
                .listContentAudit(Object.assign(filtroDaAuditoria(), { cursor: AUD_CURSOR }));
        }

        function renderAuditoria(r) {
            var host = document.getElementById('aud-lista');
            var mais = document.getElementById('aud-mais');

            if (!AUD_LINHAS.length) {
                host.innerHTML =
                    '<div class="state"><span class="material-symbols-rounded" ' +
                    'aria-hidden="true">manage_search</span><h2>Nada com esses filtros</h2>' +
                    '<p>Tente um período maior ou tire um filtro.</p></div>';
                mais.classList.add('hidden');
                document.getElementById('aud-resumo').textContent = '';
                return;
            }

            host.innerHTML =
                '<div class="aud-scroll"><table class="aud-tabela">' +
                '<thead><tr>' +
                '<th scope="col">Quando</th><th scope="col">Quem</th>' +
                '<th scope="col">O quê</th><th scope="col">Onde</th>' +
                '<th scope="col">Detalhe</th></tr></thead><tbody>' +
                AUD_LINHAS.map(function (l) {
                    var alvo = l.label || l.key || '';
                    return '<tr>' +
                        '<td class="aud-quando">' + esc(dataCurta(l.at)) + '</td>' +
                        '<td>' + fotoDoLdap(l.actor) + ' ' + esc(l.actor) + '</td>' +
                        '<td>' + esc(ATIVIDADE_VERBO[l.action] || l.action) +
                        (alvo ? ' <strong>' + esc(alvo) + '</strong>' : '') + '</td>' +
                        '<td>' + esc(ATIVIDADE_MODULO[l.module] || l.module || '—') + '</td>' +
                        '<td class="aud-detalhe">' + esc(l.detail) + '</td>' +
                        '</tr>';
                }).join('') +
                '</tbody></table></div>';

            // `done` é sobre a ABA ter acabado, não sobre a página ter enchido:
            // uma página curta porque o teto de varredura foi atingido ainda tem
            // continuação, e esconder o botão ali faria parecer que acabou.
            mais.classList.toggle('hidden', !!r.done || !r.nextCursor);

            document.getElementById('aud-resumo').textContent =
                AUD_LINHAS.length + (AUD_LINHAS.length === 1 ? ' registro' : ' registros') +
                (r.done ? ' — fim do histórico.' : ' até aqui.');
        }

        function exportarAuditoria(btn) {
            var rotulo = btn.innerHTML;
            btn.disabled = true;
            btn.textContent = 'Exportando…';

            google.script.run
                .withSuccessHandler(function (r) {
                    btn.disabled = false;
                    btn.innerHTML = rotulo;
                    toast('Aba "' + r.sheet + '" gerada com ' + r.rows +
                        (r.rows === 1 ? ' registro' : ' registros') +
                        (r.truncated ? ' (cortado no teto de exportação).' : '.'));
                })
                .withFailureHandler(function (err) {
                    btn.disabled = false;
                    btn.innerHTML = rotulo;
                    toast(err.message, true);
                })
                .exportContentAudit(filtroDaAuditoria());
        }

        // Enter em qualquer campo de texto busca — é o gesto que se faz sem
        // pensar num formulário de filtro.
        document.getElementById('pane-audit').addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && e.target.tagName === 'INPUT') buscarAuditoria();
        });

        // --- Papéis (matriz editável — ADR-0009) ---
        //
        // A tela NÃO é a fronteira: cada regra deste arquivo existe também no
        // servidor, e é lá que ela vale. O que a tela faz é dizer em voz alta o
        // que está prestes a acontecer — que é a parte que o servidor sozinho
        // não consegue fazer.

        var ROL = null;          // resposta de listContentRoles()
        var ROL_ATUAL = null;    // nome do papel em edição, ou ROL_NOVO
        var ROL_NOVO = '__novo__';

        var ROL_ACAO_NOME = {
            view: 'Ver', propose: 'Propor', approve: 'Aprovar',
            publish: 'Publicar direto', rollback: 'Reverter'
        };

        var ROL_GLOBAL_NOME = {
            manageAccess: 'Gerenciar acessos',
            manageRoles: 'Gerenciar papéis',
            viewAudit: 'Ver a auditoria completa',
            selfApprove: 'Aprovar a própria proposta'
        };

        var ROL_GLOBAL_AJUDA = {
            manageAccess: 'Conceder e tirar o acesso de outras pessoas.',
            manageRoles: 'Editar esta matriz — inclusive a de quem já a edita.',
            viewAudit: 'Ver quem mudou o quê, incluindo mudanças de acesso.',
            selfApprove: 'Publicar a própria proposta sem que ninguém revise.'
        };

        var ROL_MODULO_NOME = {
            links: 'Links', call_script: 'Call Script', note_template: 'Case Notes',
            email_template: 'E-mails', tips: 'Dicas', broadcast: 'Avisos',
            bau_availability: 'Disponibilidade', people: 'Pessoas'
        };

        function loadRoles() {
            if (!SESSION.canManageRoles || MODO_PREVIA) return;

            google.script.run
                .withSuccessHandler(function (r) {
                    ROL = r;
                    if (!ROL_ATUAL || (ROL_ATUAL !== ROL_NOVO && !acharPapel(ROL_ATUAL))) {
                        ROL_ATUAL = r.roles.length ? r.roles[0].role : ROL_NOVO;
                    }
                    renderRoles();
                })
                .withFailureHandler(function (err) {
                    document.getElementById('rol-matriz').innerHTML =
                        '<div class="note warn">' + esc(err.message) + '</div>';
                })
                .listContentRoles();
        }

        function acharPapel(nome) {
            if (!ROL) return null;
            for (var i = 0; i < ROL.roles.length; i++) {
                if (ROL.roles[i].role === nome) return ROL.roles[i];
            }
            return null;
        }

        // A matriz que a tela está mostrando AGORA — lida dos checkboxes, não
        // do que veio do servidor. É ela que vai no salvar e a que alimenta o
        // aviso de escalada em tempo real.
        function matrizDaTela() {
            var modules = {};

            ROL.modules.forEach(function (m) {
                modules[m] = {};
                ROL.actionsByModule[m].forEach(function (acao) {
                    var cx = document.getElementById('rol-cx-' + m + '-' + acao);
                    modules[m][acao] = !!(cx && cx.checked);
                });
            });

            var global = {};
            ROL.globalPerms.forEach(function (nome) {
                var cx = document.getElementById('rol-gl-' + nome);
                global[nome] = !!(cx && cx.checked);
            });

            return { modules: modules, global: global };
        }

        // Publicação unilateral: propõe, aprova e pode aprovar a si mesmo.
        // Mesma conta do servidor — aqui ela existe para APARECER, não para
        // decidir.
        function escaladaDaTela(m) {
            if (!m.global.selfApprove) return [];
            return ROL.modules.filter(function (mod) {
                var c = m.modules[mod] || {};
                if (!c.propose || !c.approve) return false;
                var exige = ROL.approvalRequiresGlobal[mod];
                return !exige || m.global[exige];
            });
        }

        function renderRoles() {
            if (!ROL) return;

            var sel = document.getElementById('rol-papel');
            sel.innerHTML = ROL.roles.map(function (r) {
                return '<option value="' + esc(r.role) + '"' +
                    (r.role === ROL_ATUAL ? ' selected' : '') + '>' + esc(r.role) +
                    ' · ' + r.people + (r.people === 1 ? ' pessoa' : ' pessoas') + '</option>';
            }).join('') +
                '<option value="' + ROL_NOVO + '"' +
                (ROL_ATUAL === ROL_NOVO ? ' selected' : '') + '>— novo papel —</option>';

            document.getElementById('rol-nome-nova').classList.toggle('hidden', ROL_ATUAL !== ROL_NOVO);

            var atual = acharPapel(ROL_ATUAL);
            var resumo = document.getElementById('rol-resumo');

            if (ROL.fallback) {
                // Editar em cima de um fallback é editar no escuro: o que está
                // na tela não é o que está gravado.
                resumo.textContent =
                    'A aba Content_Roles não pôde ser lida. Isto é o preset do código — ' +
                    'salvar aqui vai GRAVAR o que você vir.';
            } else if (ROL_ATUAL === ROL_NOVO) {
                resumo.textContent = 'Papel novo. Ninguém o tem ainda.';
            } else {
                resumo.textContent = atual.people
                    ? 'Vale para ' + atual.people + (atual.people === 1 ? ' pessoa' : ' pessoas') +
                      ', no ato em que você salvar.'
                    : 'Ninguém tem este papel no momento.';
            }

            renderMatriz(atual ? atual.permissions : null);
            renderGlobais(atual ? atual.permissions : null);
            aoMexerNaMatriz();
        }

        function renderMatriz(perms) {
            var acoes = ROL.moduleActions;

            var cabecalho = '<tr><th scope="col">Módulo</th>' + acoes.map(function (a) {
                return '<th scope="col">' + esc(ROL_ACAO_NOME[a] || a) + '</th>';
            }).join('') + '</tr>';

            var linhas = ROL.modules.map(function (m) {
                var possiveis = ROL.actionsByModule[m];

                var celulas = acoes.map(function (acao) {
                    // Casa que não existe neste regime não vira checkbox
                    // desligado: vira traço. Um checkbox que não faz nada é uma
                    // promessa falsa, e a matriz passaria a afirmar coisas sobre
                    // operações que não existem.
                    if (possiveis.indexOf(acao) === -1) {
                        return '<td class="rol-na" aria-label="não se aplica">—</td>';
                    }

                    var id = 'rol-cx-' + m + '-' + acao;
                    var marcado = !!(perms && perms.modules[m] && perms.modules[m][acao]);
                    return '<td><input type="checkbox" id="' + id + '"' +
                        (marcado ? ' checked' : '') +
                        ' aria-label="' + esc((ROL_ACAO_NOME[acao] || acao) + ' — ' +
                            (ROL_MODULO_NOME[m] || m)) + '"></td>';
                }).join('');

                return '<tr><th scope="row">' + esc(ROL_MODULO_NOME[m] || m) + '</th>' + celulas + '</tr>';
            }).join('');

            document.getElementById('rol-matriz').innerHTML =
                '<div class="card-title" style="margin-bottom:4px">O que este papel faz em cada módulo</div>' +
                '<p class="card-sub" style="margin-bottom:14px">' +
                'O traço marca o que não existe naquele módulo: catálogo passa pela fila, ' +
                'operação publica direto.</p>' +
                '<div class="rol-scroll"><table class="rol-matriz">' +
                '<thead>' + cabecalho + '</thead><tbody>' + linhas + '</tbody></table></div>';
        }

        function renderGlobais(perms) {
            var itens = ROL.globalPerms.map(function (nome) {
                var marcado = !!(perms && perms.global[nome]);
                return '<label class="rol-global">' +
                    '<input type="checkbox" id="rol-gl-' + nome + '"' + (marcado ? ' checked' : '') + '>' +
                    '<span><strong>' + esc(ROL_GLOBAL_NOME[nome] || nome) + '</strong>' +
                    '<span class="rol-global-ajuda">' + esc(ROL_GLOBAL_AJUDA[nome] || '') + '</span>' +
                    '</span></label>';
            }).join('');

            document.getElementById('rol-globais').innerHTML =
                '<div class="card-title" style="margin-bottom:14px">Permissões que não são de módulo</div>' +
                itens;
        }

        // Um listener só, na aba inteira: a matriz é repintada a cada troca de
        // papel, e religar handler por checkbox é como se perde evento em lista
        // que muda.
        document.getElementById('pane-roles').addEventListener('change', function (e) {
            if (e.target.type === 'checkbox') aoMexerNaMatriz();
        });

        function aoMexerNaMatriz() {
            if (!ROL) return;

            var atual = acharPapel(ROL_ATUAL);
            var agora = matrizDaTela();
            var escalada = escaladaDaTela(agora);
            var aviso = document.getElementById('rol-escalada');

            aviso.classList.toggle('hidden', !escalada.length);
            if (escalada.length) {
                aviso.innerHTML = '<strong>Publicação sem revisão.</strong> Quem tem este papel ' +
                    'propõe e aprova a si mesmo em ' +
                    esc(escalada.map(function (m) { return ROL_MODULO_NOME[m] || m; }).join(', ')) +
                    ' — vai ao ar sem ninguém olhar.';
            }

            // O diff ao vivo, e não só na confirmação: quem está mexendo precisa
            // saber o que já mudou antes de decidir salvar.
            var mudancas = diffDaMatriz(atual ? atual.permissions : null, agora);
            document.getElementById('rol-mudancas').textContent = mudancas.length
                ? mudancas.length + (mudancas.length === 1 ? ' alteração' : ' alterações')
                : 'Nada alterado.';
        }

        function diffDaMatriz(antes, depois) {
            var linhas = [];
            var texto = function (v) { return v ? 'sim' : 'não'; };

            ROL.modules.forEach(function (m) {
                ROL.actionsByModule[m].forEach(function (acao) {
                    var a = !!(antes && antes.modules[m] && antes.modules[m][acao]);
                    var b = !!(depois.modules[m] && depois.modules[m][acao]);
                    if (a !== b) {
                        linhas.push((ROL_MODULO_NOME[m] || m) + ' · ' +
                            (ROL_ACAO_NOME[acao] || acao) + ': ' + texto(a) + ' → ' + texto(b));
                    }
                });
            });

            ROL.globalPerms.forEach(function (nome) {
                var a = !!(antes && antes.global[nome]);
                var b = !!depois.global[nome];
                if (a !== b) {
                    linhas.push((ROL_GLOBAL_NOME[nome] || nome) + ': ' + texto(a) + ' → ' + texto(b));
                }
            });

            return linhas;
        }

        function aoTrocarPapel() {
            ROL_ATUAL = document.getElementById('rol-papel').value;
            renderRoles();
        }

        function novoPapel() {
            ROL_ATUAL = ROL_NOVO;
            renderRoles();
            var campo = document.getElementById('rol-nome');
            if (campo) { campo.value = ''; campo.focus(); }
        }

        function salvarPapel(btn, opcoes) {
            if (!ROL) return;

            var nome = ROL_ATUAL === ROL_NOVO
                ? String(document.getElementById('rol-nome').value || '').toUpperCase().trim()
                : ROL_ATUAL;

            if (!nome) return toast('Dê um nome ao papel.', true);

            var perms = matrizDaTela();
            if (btn) btn.disabled = true;

            google.script.run
                .withSuccessHandler(function (res) {
                    if (btn) btn.disabled = false;

                    // `confirm` não é erro: é o servidor pedindo uma declaração,
                    // e ele NÃO gravou nada. O diálogo mostra o que MUDA, não o
                    // estado final — "agora tem 14 permissões" não é uma frase
                    // sobre a qual alguém decida.
                    if (res.status === 'confirm') {
                        pedirConfirmacaoDePapel(nome, res, opcoes || {});
                        return;
                    }

                    toast('Papel ' + nome + ' salvo. Vale a partir de agora.');
                    ROL_ATUAL = nome;

                    // Mexeu no próprio papel: o que a tela tem em memória já não
                    // vale, inclusive as abas que ela decidiu mostrar.
                    if (res.reloadSession) location.reload();
                    else loadRoles();
                })
                .withFailureHandler(function (err) {
                    if (btn) btn.disabled = false;
                    toast(err.message, true);
                })
                .saveContentRole(nome, JSON.stringify(perms), opcoes || {});
        }

        function pedirConfirmacaoDePapel(nome, res, opcoes) {
            var lista = (res.changes || []).map(function (l) {
                return '<li>' + esc(l) + '</li>';
            }).join('');

            document.getElementById('modal-root').innerHTML =
                '<div class="modal-backdrop" onclick="if(event.target===this)closeModal()">' +
                '<div class="modal" style="max-width:520px" role="dialog" aria-modal="true"' +
                ' aria-labelledby="rol-cf-titulo">' +
                '<h2 id="rol-cf-titulo">' +
                (res.reason === 'self' ? 'É o seu próprio papel' : 'Isto publica sem revisão') +
                '</h2>' +
                '<div class="note warn">' + esc(res.message) + '</div>' +
                (lista ? '<p class="card-sub" style="margin-top:16px">O que muda:</p>' +
                    '<ul class="rol-diff">' + lista + '</ul>' : '') +
                '<div class="modal-actions">' +
                '<button class="btn btn-ghost" onclick="closeModal()">Voltar e revisar</button>' +
                '<button class="btn btn-primary" id="rol-cf-go">Salvar assim mesmo</button>' +
                '</div></div></div>';

            document.getElementById('rol-cf-go').onclick = function () {
                closeModal();
                // Os dois motivos podem aparecer em sequência: acumular a
                // declaração e reenviar é o que faz a segunda pergunta chegar em
                // vez de o salvamento voltar à estaca zero.
                var novas = {};
                Object.keys(opcoes).forEach(function (k) { novas[k] = opcoes[k]; });
                if (res.reason === 'escalation') novas.confirmEscalation = true;
                if (res.reason === 'self') novas.confirmSelf = true;
                salvarPapel(document.getElementById('rol-salvar'), novas);
            };

            document.getElementById('rol-cf-go').focus();
        }

        // --- Acessos ---
        function loadAccess() {
            if (!SESSION.canManageAccess) return;

            // Conceder acesso é decisão; em prévia a aba é só a lista.
            document.getElementById('acc-editor').classList.toggle('hidden', MODO_PREVIA);

            // Os papéis viraram dado: o seletor tem que perguntar quais existem
            // em vez de repetir uma lista que envelhece no primeiro papel novo.
            google.script.run
                .withSuccessHandler(function (nomes) {
                    var sel = document.getElementById('acc-role');
                    var escolhido = sel.value;
                    sel.innerHTML = (nomes || []).map(function (n) {
                        return '<option value="' + esc(n) + '">' + esc(n) + '</option>';
                    }).join('');
                    if (escolhido) sel.value = escolhido;
                })
                .withFailureHandler(function (err) { toast(err.message, true); })
                .listContentRoleNames();

            google.script.run
                .withSuccessHandler(function (list) {
                    var host = document.getElementById('access-list');
                    host.innerHTML = (list || []).map(function (a) {
                        return '<div class="item-row">' +
                            '<div class="item-main">' +
                            '<div class="item-name">' + esc(a.ldap) + '</div>' +
                            '<div class="item-meta">concedido por ' + esc(a.grantedBy) + '</div>' +
                            '</div>' +
                            '<div style="display:flex;gap:8px;align-items:center">' +
                            '<span class="pill ' + (a.active ? 'live' : 'archived') + '">' +
                            esc(a.role) + (a.active ? '' : ' · inativo') + '</span>' +
                            // O botão aparece inclusive para si mesmo: a trava
                            // deixou de ser "não se remova" e passou a ser "não
                            // fique sem ninguém que governe" (ADR-0009). Quem for
                            // o último a governar recebe o erro do servidor, que
                            // explica exatamente isso.
                            (MODO_PREVIA ? '' :
                                '<button class="btn btn-ghost btn-sm" onclick="toggleAccess(\'' +
                                esc(a.ldap) + '\',\'' + esc(a.role) + '\',' + (!a.active) + ')">' +
                                (a.active ? 'Desativar' : 'Reativar') + '</button>') +
                            '</div></div>';
                    }).join('');
                })
                .withFailureHandler(function (err) { toast(err.message, true); })
                .listContentAccess();
        }

        function saveAccess() {
            var ldap = document.getElementById('acc-ldap').value.trim();
            if (!ldap) return toast('Informe o LDAP.', true);

            google.script.run
                .withSuccessHandler(function () {
                    document.getElementById('acc-ldap').value = '';
                    toast('Acesso salvo.');
                    loadAccess();
                })
                .withFailureHandler(function (err) { toast(err.message, true); })
                .saveContentAccess(ldap, document.getElementById('acc-role').value, true);
        }

        function toggleAccess(ldap, role, active) {
            google.script.run
                .withSuccessHandler(function () {
                    toast('Acesso atualizado.');
                    loadAccess();
                })
                .withFailureHandler(function (err) { toast(err.message, true); })
                .saveContentAccess(ldap, role, active);
        }
</script>
