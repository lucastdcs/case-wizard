<!-- Parte de gas-backend/ContentDashboard.html. Ver o cabeçalho de lá. -->
<!-- Módulos de CATÁLOGO: passam pela fila de aprovação.
     Links, Call Script, Case Notes, E-mails e Dicas. -->
<script>
        // --- Links ---
        //
        // Duas vistas no mesmo destino. A BIBLIOTECA (links e categorias) passa
        // pela fila de revisão; os DESTAQUES (Ops.html) vão ao ar na hora. A vista
        // escolhida vive só na memória: o endereço (#/links) é um destino, não
        // um estado de aba.
        var LK_VIEW = 'lib';
        var CAT_LOAD_FAILED = false;

        function lkSwitchView(v) {
            LK_VIEW = v === 'hl' ? 'hl' : 'lib';
            var lib = LK_VIEW === 'lib';
            document.getElementById('lk-view-lib').classList.toggle('hidden', !lib);
            document.getElementById('lk-view-hl').classList.toggle('hidden', lib);
            document.getElementById('lk-actions-lib').classList.toggle('hidden', !lib);
            document.getElementById('lk-actions-hl').classList.toggle('hidden', lib);
            document.getElementById('lk-seg-lib').setAttribute('aria-selected', String(lib));
            document.getElementById('lk-seg-hl').setAttribute('aria-selected', String(!lib));
        }

        function loadLinks() {
            google.script.run
                .withSuccessHandler(function (items) {
                    LIVE_LINKS = items || [];
                    google.script.run
                        .withSuccessHandler(function (drafts) {
                            MY_DRAFTS = drafts || [];
                            delete DRAFTS_OFFLINE.links;
                            renderLinks();
                            renderHighlights();
                        })
                        .withFailureHandler(function () {
                            MY_DRAFTS = []; DRAFTS_OFFLINE.links = true;
                            renderLinks();
                            renderHighlights();
                        })
                        .listContentDrafts('links');
                })
                .withFailureHandler(function (err) {
                    document.getElementById('links-list').innerHTML =
                        '<div class="state"><span class="material-symbols-rounded">error</span>' +
                        '<h2>Não foi possível carregar os links</h2><p>' + esc(err.message) + '</p></div>';
                })
                .listContentItems('links');

            loadLinkCategories();
            loadHighlights();
        }

        // Categorias criadas pela tela, e as propostas da própria pessoa. Falhar
        // aqui não pode apagar os links: eles só passam a aparecer sob o nome da
        // chave, e a tela AVISA que a lista de categorias não carregou.
        function loadLinkCategories() {
            google.script.run
                .withSuccessHandler(function (items) {
                    CUSTOM_LINK_CATS = items || [];
                    CAT_LOAD_FAILED = false;
                    google.script.run
                        .withSuccessHandler(function (drafts) { MY_CAT_DRAFTS = drafts || []; renderLinks(); })
                        .withFailureHandler(function () { MY_CAT_DRAFTS = []; renderLinks(); })
                        .listContentDrafts('link_categories');
                })
                .withFailureHandler(function () {
                    CUSTOM_LINK_CATS = [];
                    CAT_LOAD_FAILED = true;
                    renderLinks();
                })
                .listContentItems('link_categories');
        }

        function draftForItem(itemId) {
            for (var i = 0; i < MY_DRAFTS.length; i++) {
                if (MY_DRAFTS[i].itemId === itemId) return MY_DRAFTS[i];
            }
            return null;
        }

        // Links agrupados por categoria, na ordem do produto (embutidas) e depois
        // as criadas pela tela. Chave sem definição vai por último, sob o próprio
        // nome: um link nunca some por causa da categoria dele.
        function lkGruposPorCategoria() {
            var ordem = linkCategories().map(function (c) { return c.key; });
            var grupos = {};
            LIVE_LINKS.forEach(function (it) {
                if (ordem.indexOf(it.key) === -1) ordem.push(it.key);
                (grupos[it.key] = grupos[it.key] || []).push(it);
            });
            return { ordem: ordem, grupos: grupos };
        }

        function lkRenderCategorias() {
            var host = document.getElementById('lk-cats');
            var contagem = {};
            LIVE_LINKS.forEach(function (it) { contagem[it.key] = (contagem[it.key] || 0) + 1; });
            var pode = podeEscrever('link_categories');

            var chips = linkCategories().map(function (c) {
                var t = LINK_CAT_COLORS[c.color];
                var n = contagem[c.key] || 0;
                var acoes = '';
                if (c.custom && pode) {
                    acoes =
                        '<button class="btn-icon" title="Editar a categoria" aria-label="Editar a categoria ' +
                        esc(c.label) + '" onclick="openCategoryEditor(\'' + esc(c.itemId) + '\')">' +
                        '<span class="material-symbols-rounded" aria-hidden="true">edit</span></button>' +
                        '<button class="btn-icon" title="Tirar a categoria do ar" aria-label="Tirar a categoria ' +
                        esc(c.label) + ' do ar" onclick="askCategoryRemoval(\'' + esc(c.itemId) + '\')">' +
                        '<span class="material-symbols-rounded" aria-hidden="true">delete</span></button>';
                }
                return '<span class="lk-chip" title="' + esc(c.custom ? 'Criada pela tela · chave ' + c.key : 'Categoria do sistema · chave ' + c.key) + '">' +
                    '<span class="lk-chip-ico" style="background:' + t.bg + ';color:' + t.color + '">' +
                    '<span class="material-symbols-rounded" aria-hidden="true">' + esc(c.icon) + '</span></span>' +
                    esc(c.label) + ' <span class="lk-chip-n">' + n + '</span>' + acoes + '</span>';
            }).join('');

            // Propostas de categoria da própria pessoa que ainda não entraram no ar.
            var pendentes = MY_CAT_DRAFTS.filter(function (d) { return d.status === 'pending' || d.status === 'draft'; })
                .map(function (d) {
                    var v = parseCatValue(d.value);
                    return '<span class="lk-chip"><span class="lk-chip-ico" style="background:' +
                        LINK_CAT_COLORS[v.color].bg + ';color:' + LINK_CAT_COLORS[v.color].color + '">' +
                        '<span class="material-symbols-rounded" aria-hidden="true">' + esc(v.icon) + '</span></span>' +
                        esc(v.label || d.key) + ' <span class="estado estado-espera">em revisão</span></span>';
                }).join('');

            var aviso = CAT_LOAD_FAILED
                ? '<div class="note warn" style="margin-bottom:12px">Não foi possível carregar as categorias criadas pela tela. ' +
                  'Os links delas aparecem abaixo sob o nome da chave. ' +
                  '<button class="btn btn-ghost btn-sm" style="margin-left:8px" onclick="loadLinkCategories()">Tentar de novo</button></div>'
                : '';

            host.innerHTML = '<div class="card-title">Categorias</div>' +
                '<p class="card-sub" style="margin-bottom:12px">A barra lateral do app do agente. ' +
                'As do sistema não mudam; as que você cria passam por revisão.</p>' + aviso +
                '<div class="lk-cats">' + chips + pendentes + '</div>';
        }

        function renderLinks() {
            var host = document.getElementById('links-list');
            var summary = document.getElementById('links-summary');
            var contador = document.getElementById('lk-n-lib');
            if (contador) contador.textContent = LIVE_LINKS.length ? String(LIVE_LINKS.length) : '';

            lkRenderCategorias();

            if (!LIVE_LINKS.length) {
                summary.textContent = 'Nenhum link publicado ainda.';
                host.innerHTML =
                    '<div class="state"><span class="material-symbols-rounded">link_off</span>' +
                    '<h2>Nenhum link na planilha ainda</h2>' +
                    '<p>Enquanto isso o app segue usando a lista embutida no código. ' +
                    'Rode a semeadura (seedContentModule) ou crie o primeiro link aqui.</p></div>';
                return;
            }

            var pend = MY_DRAFTS.length;
            summary.textContent = LIVE_LINKS.length + ' links publicados' +
                (pend ? ' · ' + pend + ' com alteração em andamento' : '');

            var agrupado = lkGruposPorCategoria();
            var podeDestacar = podeEscrever('link_highlights');

            var html = '';
            agrupado.ordem.forEach(function (cat) {
                var lista = agrupado.grupos[cat];
                if (!lista || !lista.length) return;

                html += '<div class="cat-head">' + esc(linkCatLabel(cat)) +
                    ' <span class="pill draft">' + lista.length + '</span></div>';

                lista.forEach(function (it) {
                    var v = parseLinkValue(it.value);
                    var d = draftForItem(it.id);
                    var badge = selosDoRascunho(d);

                    // Descartar só aparece quando existe rascunho não enviado e
                    // ele é seu: proposta em revisão se resolve pela fila.
                    var descarte = (d && d.status === 'draft' && !travadoPorOutro(d))
                        ? '<button class="btn btn-danger btn-sm" onclick="descartarRascunho(\'' +
                          d.draftId + '\', loadLinks)">Descartar rascunho</button>'
                        : '';

                    // Histórico é LEITURA: quem enxerga o item enxerga por onde ele
                    // passou. Só reverter é que depende de aprovar.
                    var historico = '<button class="btn btn-ghost btn-sm" '
                        + 'onclick="abrirHistorico(\'' + it.id + '\',\'' + it.lineage + '\',\'links\')">Histórico</button>'
                        + botaoComoAgente(it.id);

                    var destacar = podeDestacar
                        ? '<button class="btn btn-ghost btn-sm" onclick="openHighlightEditor(null,\'' +
                          esc(it.lineage) + '\')">Destacar</button>'
                        : '';

                    var actions = podeEscrever('links')
                        ? '<div style="display:flex;gap:8px;flex-wrap:wrap">' + historico + destacar + descarte +
                        '<button class="btn btn-ghost btn-sm" onclick="openLinkEditor(\'' + it.id + '\')">Editar</button>' +
                        '<button class="btn btn-danger btn-sm" onclick="askRemoval(\'' + it.id + '\')">Tirar do ar</button>' +
                        '</div>'
                        : '<div style="display:flex;gap:8px;flex-wrap:wrap">' + historico + destacar + descarte + '</div>';

                    // A prévia é opcional e vale para qualquer link; o que falta é
                    // dito aqui para o SME achar onde escrever.
                    var temPrevia = !!(v.about || v.when);

                    html += '<div class="item-row" data-item="' + esc(it.id) + '">' +
                        '<div class="item-main">' +
                        '<div class="item-name">' + esc(v.name) + ' ' + badge + '</div>' +
                        '<div class="item-meta">' + esc(v.desc) + ' — ' + esc(v.url) +
                        (temPrevia ? '' : ' · <span class="lk-missing">sem prévia</span>') + '</div>' +
                        '</div>' + actions + '</div>';
                });
            });

            host.innerHTML = avisoRascunhosOffline('links') + html;
        }

        function closeModal() {
            document.getElementById('modal-root').innerHTML = '';
        }

        // Salvar e enviar para revisão, numa viagem só ao servidor.
        //
        // Antes eram duas chamadas encadeadas (três nos e-mails e nas notas, que
        // ainda validavam antes), cada uma com a latência do google.script.run —
        // e um estado ruim no meio: falhar no envio deixava um rascunho salvo
        // que a pessoa achava ter mandado. A validação não se perdeu: o servidor
        // valida dentro de saveAndSubmitContentDraft(), antes de gravar.
        // Quais módulos falharam ao carregar os rascunhos nesta sessão.
        //
        // Antes a falha virava lista vazia e a tela desenhava "nenhuma proposta
        // em andamento" — indistinguível de realmente não haver nenhuma. Quem
        // então editava um item com proposta pendente levava uma recusa do
        // servidor sem ter como explicar. Erro que o usuário não vê é erro que
        // ele paga depois.
        var DRAFTS_OFFLINE = {};

        function avisoRascunhosOffline(module) {
            if (!DRAFTS_OFFLINE[module]) return '';
            return '<div class="note warn" style="margin-bottom:12px">' +
                'Não foi possível carregar as propostas em andamento deste módulo. ' +
                'A lista abaixo mostra só o que está no ar — um item pode ter uma ' +
                'proposta em revisão que não aparece aqui. ' +
                '<button class="btn btn-ghost btn-sm" style="margin-left:8px" ' +
                'onclick="switchTab(\'' + module + '\')">Tentar de novo</button></div>';
        }

        // Salvar SEM enviar. O rascunho existia no modelo de dados desde o
        // começo e era inalcançável: todo editor tinha um botão só, que salvava
        // e submetia no mesmo gesto. Sem isto não havia como guardar trabalho
        // parcial — fechar o editor descartava tudo — e a trava de edição
        // cooperativa nunca chegava a valer, porque nada ficava aberto.
        function salvarRascunho(payload, btn, aoConcluir) {
            var rotulo = btn.textContent;
            btn.disabled = true;
            btn.textContent = 'Salvando…';

            google.script.run
                .withSuccessHandler(function () {
                    closeModal();
                    toast('Rascunho salvo. Ninguém vê até você enviar.');
                    if (aoConcluir) aoConcluir();
                })
                .withFailureHandler(function (err) {
                    btn.disabled = false;
                    btn.textContent = rotulo;
                    toast(err.message, true);
                })
                .saveContentDraft(payload);
        }

        // Descartar o que foi guardado e não vai virar proposta. Sem esta saída
        // o rascunho vira armadilha: fica na lista, conta na home e a próxima
        // edição do item reabre o texto abandonado.
        function descartarRascunho(draftId, aoConcluir) {
            document.getElementById('modal-root').innerHTML =
                '<div class="modal-backdrop" onclick="if(event.target===this)closeModal()">' +
                '<div class="modal" style="max-width:440px" role="dialog" aria-modal="true"' +
                ' aria-labelledby="desc-titulo">' +
                '<h2 id="desc-titulo">Descartar este rascunho?</h2>' +
                '<p class="card-sub">O texto guardado some. O que está no ar não muda.</p>' +
                '<div class="modal-actions">' +
                '<button class="btn btn-ghost" onclick="closeModal()">Manter</button>' +
                '<button class="btn btn-danger" id="desc-go">Descartar</button>' +
                '</div></div></div>';

            document.getElementById('desc-go').onclick = function () {
                this.disabled = true;
                google.script.run
                    .withSuccessHandler(function () {
                        closeModal();
                        toast('Rascunho descartado.');
                        if (aoConcluir) aoConcluir();
                    })
                    .withFailureHandler(function (err) { toast(err.message, true); })
                    .discardContentDraft(draftId);
            };
        }

        // Quem está com o item aberto AGORA, se for outra pessoa. A trava é
        // cooperativa e expira sozinha (CONTENT_LOCK_TTL_MS no servidor); aqui
        // a janela é a mesma, para a tela não anunciar uma trava que o servidor
        // já não respeita.
        var TRAVA_TTL_MS = 10 * 60 * 1000;

        function travadoPorOutro(rascunho) {
            if (!rascunho || !rascunho.lockedBy || !SESSION) return '';
            if (rascunho.lockedBy === SESSION.ldap) return '';

            var quando = new Date(rascunho.lockedAt).getTime();
            if (isNaN(quando) || (Date.now() - quando) > TRAVA_TTL_MS) return '';

            return rascunho.lockedBy;
        }

        // Rótulo do rascunho na linha do item: o que ele é, e de quem.
        function selosDoRascunho(rascunho) {
            if (!rascunho) return '';

            if (rascunho.status === 'pending') {
                return ' <span class="estado estado-espera">em revisão</span>';
            }

            var quem = travadoPorOutro(rascunho);
            if (quem) {
                return ' <span class="estado estado-espera">' + esc(quem) + ' está editando</span>';
            }
            return ' <span class="estado estado-espera">rascunho seu</span>';
        }

        function enviarProposta(payload, btn, aoConcluir) {
            var rotulo = btn.textContent;
            btn.disabled = true;
            btn.textContent = 'Enviando…';

            google.script.run
                .withSuccessHandler(function () {
                    closeModal();
                    toast('Proposta enviada para revisão.');
                    if (aoConcluir) aoConcluir();
                    loadPendingCount();
                })
                .withFailureHandler(function (err) {
                    btn.disabled = false;
                    btn.textContent = rotulo;
                    toast(err.message, true);
                })
                .saveAndSubmitContentDraft(payload);
        }

        // --- Campos por idioma (descrição e prévia do link; título e resumo do destaque) ---
        //
        // Os três idiomas vivem no DOM o tempo todo e só um fica visível. Trocar de
        // aba não recria os campos — o que se digitou em ES continua lá quando
        // a pessoa volta do EN, e o envio lê os três de uma vez.
        var LK_LANGS = [['pt', 'PT'], ['es', 'ES'], ['en', 'EN']];

        function lkLangChips(prefix) {
            return '<div class="lk-lang" id="' + prefix + '-lang" role="group" aria-label="Idioma do texto">' +
                LK_LANGS.map(function (l, i) {
                    return '<button type="button" data-lang="' + l[0] + '" aria-pressed="' + (i === 0) + '" ' +
                        'onclick="lkSetLang(\'' + prefix + '\',\'' + l[0] + '\')">' + l[1] + '</button>';
                }).join('') + '</div>';
        }

        // Quem quiser reagir à troca (o destaque repinta a prévia no idioma
        // escolhido) registra aqui, por prefixo.
        var LK_LANG_HOOKS = {};

        function lkSetLang(prefix, lang) {
            document.querySelectorAll('[data-pane^="' + prefix + '-"]').forEach(function (p) {
                p.classList.toggle('hidden', p.getAttribute('data-pane') !== prefix + '-' + lang);
            });
            document.querySelectorAll('#' + prefix + '-lang button').forEach(function (b) {
                b.setAttribute('aria-pressed', String(b.getAttribute('data-lang') === lang));
            });
            if (typeof LK_LANG_HOOKS[prefix] === 'function') LK_LANG_HOOKS[prefix](lang);
        }

        // Marca "falta" no idioma sem nenhum campo preenchido: o agente desse idioma
        // vê o texto em português, e quem escreve precisa saber disso ANTES de enviar.
        function lkMarcarFaltas(prefix, ids) {
            LK_LANGS.forEach(function (l) {
                if (l[0] === 'pt') return;
                var preenchido = ids[l[0]].some(function (id) {
                    var el = document.getElementById(id);
                    return el && el.value.trim();
                });
                var b = document.querySelector('#' + prefix + '-lang button[data-lang="' + l[0] + '"]');
                if (!b) return;
                b.classList.toggle('miss', !preenchido);
                b.textContent = l[1] + (preenchido ? '' : ': falta');
            });
        }

        function lkContar(inputId, max) {
            var el = document.getElementById(inputId);
            var cnt = document.getElementById(inputId + '-n');
            if (el && cnt) cnt.textContent = el.value.length + ' / ' + max;
        }

        // Prévia do link: o que é e quando usar. É opcional, mas é ela que dá ao
        // agente mais que uma linha genérica ao passar o mouse.
        var LK_ABOUT_MAX = 200;
        var LK_WHEN_MAX = 160;

        function lkCamposDePrevia(v) {
            var suf = { pt: '', es: '_es', en: '_en' };
            return '<div class="lk-help" style="margin-top:20px"><strong>Prévia</strong> — aparece ao passar o mouse no app do agente.</div>' +
                lkLangChips('lnk-pv') +
                LK_LANGS.map(function (l, i) {
                    var s = suf[l[0]];
                    return '<div data-pane="lnk-pv-' + l[0] + '"' + (i === 0 ? '' : ' class="hidden"') + '>' +
                        '<label class="fld" for="lnk-about' + s + '">O que é <span class="lk-count" id="lnk-about' + s + '-n"></span></label>' +
                        '<textarea id="lnk-about' + s + '" maxlength="' + LK_ABOUT_MAX + '" style="min-height:64px" ' +
                        'oninput="lkContar(\'lnk-about' + s + '\',' + LK_ABOUT_MAX + ');lkMarcarFaltas(\'lnk-pv\',LK_PV_IDS)" ' +
                        'placeholder="Uma ou duas frases: o que é esta ferramenta ou documento.">' + esc(v['about' + s]) + '</textarea>' +
                        '<label class="fld" for="lnk-when' + s + '">Quando usar <span class="lk-count" id="lnk-when' + s + '-n"></span></label>' +
                        '<textarea id="lnk-when' + s + '" maxlength="' + LK_WHEN_MAX + '" style="min-height:64px" ' +
                        'oninput="lkContar(\'lnk-when' + s + '\',' + LK_WHEN_MAX + ');lkMarcarFaltas(\'lnk-pv\',LK_PV_IDS)" ' +
                        'placeholder="Em que situação do atendimento o agente deve abrir isto.">' + esc(v['when' + s]) + '</textarea>' +
                        '</div>';
                }).join('');
        }

        var LK_PV_IDS = {
            pt: ['lnk-about', 'lnk-when'],
            es: ['lnk-about_es', 'lnk-when_es'],
            en: ['lnk-about_en', 'lnk-when_en']
        };

        function openLinkEditor(itemId) {
            var item = null;
            for (var i = 0; i < LIVE_LINKS.length; i++) {
                if (LIVE_LINKS[i].id === itemId) item = LIVE_LINKS[i];
            }

            var existingDraft = itemId ? draftForItem(itemId) : null;
            var src = existingDraft || item;
            var v = parseLinkValue(src ? src.value : '{}');
            var cat = src ? src.key : 'tasks';

            var catOptions = linkCategories().map(function (c) {
                return '<option value="' + esc(c.key) + '"' + (c.key === cat ? ' selected' : '') + '>' +
                    esc(c.label) + '</option>';
            }).join('');
            // Chave que já não tem definição: o link continua editável, sem
            // empurrá-lo para outra categoria em silêncio.
            if (!linkCategories().some(function (c) { return c.key === cat; })) {
                catOptions = '<option value="' + esc(cat) + '" selected>' + esc(cat) + ' (sem definição)</option>' + catOptions;
            }

            document.getElementById('modal-root').innerHTML =
                '<div class="modal-backdrop" onclick="if(event.target===this)closeModal()">' +
                '<div class="modal" role="dialog" aria-modal="true">' +
                '<h2>' + (item ? 'Editar link' : 'Novo link') + '</h2>' +
                '<p class="card-sub">Isso cria uma proposta. O link no ar só muda depois da aprovação.</p>' +
                (existingDraft && existingDraft.status === 'pending'
                    ? '<div class="note warn" style="margin-top:14px">Este item já está em revisão. Cancele o envio para editar de novo.</div>'
                    : '') +
                '<label class="fld" for="lnk-name">Nome</label>' +
                '<input type="text" id="lnk-name" value="' + esc(v.name) + '">' +
                '<label class="fld" for="lnk-url">URL</label>' +
                '<input type="url" id="lnk-url" value="' + esc(v.url) + '">' +
                '<div class="grid-2">' +
                '<div><label class="fld" for="lnk-desc">Descrição (PT)</label>' +
                '<input type="text" id="lnk-desc" value="' + esc(v.desc) + '"></div>' +
                '<div><label class="fld" for="lnk-desc-es">Descrição (ES)</label>' +
                '<input type="text" id="lnk-desc-es" value="' + esc(v.desc_es) + '"></div>' +
                '<div><label class="fld" for="lnk-desc-en">Descrição (EN)</label>' +
                '<input type="text" id="lnk-desc-en" value="' + esc(v.desc_en) + '"></div>' +
                '</div>' +
                '<label class="fld" for="lnk-cat">Categoria</label>' +
                '<select id="lnk-cat">' + catOptions + '</select>' +
                lkCamposDePrevia(v) +
                '<div class="modal-actions">' +
                '<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>' +
                '<button class="btn btn-ghost" id="lnk-draft">Salvar rascunho</button>' +
                '<button class="btn btn-primary" id="lnk-save">Enviar para revisão</button>' +
                '</div></div></div>';

            document.getElementById('lnk-save').onclick = function () {
                submitLink(itemId, existingDraft ? existingDraft.draftId : null, this);
            };
            document.getElementById('lnk-draft').onclick = function () {
                submitLink(itemId, existingDraft ? existingDraft.draftId : null, this, true);
            };

            LK_ABOUT_IDS().concat(LK_WHEN_IDS()).forEach(function (id) {
                lkContar(id, id.indexOf('about') !== -1 ? LK_ABOUT_MAX : LK_WHEN_MAX);
            });

        // "Treinamento de TL" -> "treinamento_de_tl". É só sugestão: a chave é
        // identidade e a pessoa pode ajustá-la antes de criar.
        function lkSlug(texto) {
            var s = String(texto || '').normalize('NFD').replace(/[̀-ͯ]/g, '')
                .toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
            if (s && !/^[a-z]/.test(s)) s = 'c_' + s;
            return s.slice(0, 24);
        }

        // --- Call Script ---
        var CS_ITEMS = [];
        var CS_DRAFTS = [];

        var CS_GROUPS = [
            { key: 'inicio', label: 'Início' },
            { key: 'meio', label: 'Implementação (Tag Support)' },
            { key: 'fim', label: 'Encerramento' }
        ];

        function loadCallScript() {
            google.script.run
                .withSuccessHandler(function (items) {
                    CS_ITEMS = items || [];
                    google.script.run
                        .withSuccessHandler(function (d) { CS_DRAFTS = d || []; delete DRAFTS_OFFLINE.callscript; renderCallScript(); })
                        .withFailureHandler(function () { CS_DRAFTS = []; DRAFTS_OFFLINE.callscript = true; renderCallScript(); })
                        .listContentDrafts('call_script');
                })
                .withFailureHandler(function (err) {
                    document.getElementById('cs-list').innerHTML =
                        '<div class="state"><span class="material-symbols-rounded">error</span>' +
                        '<h2>Não foi possível carregar o roteiro</h2><p>' + esc(err.message) + '</p></div>';
                })
                .listContentItems('call_script');
        }

        function csDraftForItem(itemId) {
            for (var i = 0; i < CS_DRAFTS.length; i++) {
                if (CS_DRAFTS[i].itemId === itemId) return CS_DRAFTS[i];
            }
            return null;
        }

        function renderCallScript() {
            var host = document.getElementById('cs-list');
            var lang = idiomaAtual();
            var flow = document.getElementById('cs-flow').value;

            var mine = CS_ITEMS.filter(function (i) { return i.lang === lang && i.key === flow; });

            if (!mine.length) {
                host.innerHTML =
                    '<div class="state"><span class="material-symbols-rounded">support_agent</span>' +
                    '<h2>Nenhum passo publicado para ' + esc(lang + ' ' + flow) + '</h2>' +
                    '<p>Enquanto isso o app segue com o roteiro embutido no código. ' +
                    'Rode a semeadura (seedCallScriptNow) ou crie o primeiro passo aqui.</p></div>';
                return;
            }

            var html = '';
            CS_GROUPS.forEach(function (g) {
                var steps = mine.filter(function (i) { return i.field === g.key; })
                    .sort(function (a, b) { return a.sortOrder - b.sortOrder; });

                html += '<div class="cat-head">' + esc(g.label) +
                    ' <span class="pill draft">' + steps.length + '</span></div>';

                // A seção de Implementação ainda não existe em ES: é conteúdo que
                // nunca chegou, não bug. Dizer isso explicitamente evita que pareça
                // uma falha de carregamento.
                if (!steps.length) {
                    html += '<div class="item-row"><div class="item-main">' +
                        '<div class="item-meta">Sem passos cadastrados nesta seção. ' +
                        'Use “Novo passo” para preencher.</div></div></div>';
                    return;
                }

                steps.forEach(function (it, idx) {
                    var d = csDraftForItem(it.id);
                    var badge = selosDoRascunho(d);

                    // Descartar só aparece quando existe rascunho não enviado e
                    // ele é seu: proposta em revisão se resolve pela fila.
                    var descarte = (d && d.status === 'draft' && !travadoPorOutro(d))
                        ? '<button class="btn btn-danger btn-sm" onclick="descartarRascunho(\'' +
                          d.draftId + '\', loadCallScript)">Descartar rascunho</button>'
                        : '';

                    // Histórico é LEITURA: quem enxerga o item enxerga por onde ele
                    // passou. Só reverter é que depende de aprovar.
                    var historico = '<button class="btn btn-ghost btn-sm" '
                        + 'onclick="abrirHistorico(\'' + it.id + '\',\'' + it.lineage + '\',\'call_script\')">Histórico</button>'
                        + botaoComoAgente(it.id);

                    var actions = podeEscrever('call_script')
                        ? '<div style="display:flex;gap:8px">' + historico + descarte +
                        '<button class="btn btn-ghost btn-sm" onclick="openStepEditor(\'' + it.id + '\')">Editar</button>' +
                        '<button class="btn btn-danger btn-sm" onclick="askRemoval(\'' + it.id + '\')">Remover</button>' +
                        '</div>'
                        : '<div style="display:flex;gap:8px">' + historico + descarte + '</div>';

                    html += '<div class="item-row" data-item="' + esc(it.id) + '">' +
                        '<div class="item-main">' +
                        '<div class="item-name">' + (idx + 1) + '. ' + badge + '</div>' +
                        '<div class="item-meta">' + esc(it.value) + '</div>' +
                        '</div>' + actions + '</div>';
                });
            });

            host.innerHTML = avisoRascunhosOffline('callscript') + html;
        }

        function openStepEditor(itemId) {
            var item = null;
            for (var i = 0; i < CS_ITEMS.length; i++) {
                if (CS_ITEMS[i].id === itemId) item = CS_ITEMS[i];
            }

            var existingDraft = itemId ? csDraftForItem(itemId) : null;
            var src = existingDraft || item;
            var lang = idiomaAtual();
            var flow = document.getElementById('cs-flow').value;
            var group = src ? src.field : 'inicio';
            var text = src ? src.value : '';

            var groupOptions = CS_GROUPS.map(function (g) {
                return '<option value="' + g.key + '"' + (g.key === group ? ' selected' : '') + '>' +
                    esc(g.label) + '</option>';
            }).join('');

            document.getElementById('modal-root').innerHTML =
                '<div class="modal-backdrop" onclick="if(event.target===this)closeModal()">' +
                '<div class="modal" role="dialog" aria-modal="true">' +
                '<h2>' + (item ? 'Editar passo' : 'Novo passo') + '</h2>' +
                '<p class="card-sub">' + esc(lang + ' ' + flow) +
                ' — vira proposta; o roteiro no ar só muda depois da aprovação.</p>' +
                (existingDraft && existingDraft.status === 'pending'
                    ? '<div class="note warn" style="margin-top:14px">Este passo já está em revisão.</div>'
                    : '') +
                '<label class="fld" for="cs-group">Seção</label>' +
                '<select id="cs-group">' + groupOptions + '</select>' +
                '<label class="fld" for="cs-text">Texto do passo</label>' +
                '<textarea id="cs-text" placeholder="o que o agente deve dizer ou fazer">' + esc(text) + '</textarea>' +
                '<div class="modal-actions">' +
                '<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>' +
                '<button class="btn btn-ghost" id="cs-draft">Salvar rascunho</button>' +
                '<button class="btn btn-primary" id="cs-save">Enviar para revisão</button>' +
                '</div></div></div>';

            document.getElementById('cs-save').onclick = function () {
                submitStep(itemId, existingDraft ? existingDraft.draftId : null, src, this);
            };
            document.getElementById('cs-draft').onclick = function () {
                submitStep(itemId, existingDraft ? existingDraft.draftId : null, src, this, true);
            };
            document.getElementById('cs-text').focus();
        }

        function submitStep(itemId, draftId, src, btn, apenasRascunho) {
            var text = document.getElementById('cs-text').value.trim();
            if (!text) return toast('Escreva o texto do passo.', true);

            var group = document.getElementById('cs-group').value;
            var lang = idiomaAtual();
            var flow = document.getElementById('cs-flow').value;

            // Passo novo vai para o fim da seção; passo existente mantém a posição.
            var sortOrder;
            if (src) {
                sortOrder = src.sortOrder;
            } else {
                var inGroup = CS_ITEMS.filter(function (i) {
                    return i.lang === lang && i.key === flow && i.field === group;
                });
                sortOrder = inGroup.reduce(function (max, i) {
                    return Math.max(max, i.sortOrder);
                }, 0) + 1;
            }

            (apenasRascunho ? salvarRascunho : enviarProposta)({
                draftId: draftId || '',
                itemId: itemId || '',
                module: 'call_script',
                key: flow,
                field: group,
                lang: lang,
                label: text,
                value: text,
                sortOrder: sortOrder
            }, btn, loadCallScript);
        }

        // --- Case Notes (modelos de nota inteira) ---
        var NT_ITEMS = [];
        var NT_DRAFTS = [];
        var NOTE_FIELDS = [];
        var NOTE_SUBSTATUS = [];

        function subDef(key) {
            for (var i = 0; i < NOTE_SUBSTATUS.length; i++) {
                if (NOTE_SUBSTATUS[i].key === key) return NOTE_SUBSTATUS[i];
            }
            return null;
        }

        function fieldLabel(key) {
            for (var i = 0; i < NOTE_FIELDS.length; i++) {
                if (NOTE_FIELDS[i].key === key) return NOTE_FIELDS[i].labelPt;
            }
            return key;
        }

        function loadNoteCatalog(done) {
            if (NOTE_SUBSTATUS.length) return done();

            google.script.run
                .withSuccessHandler(function (cat) {
                    NOTE_FIELDS = (cat && cat.fields) || [];
                    NOTE_SUBSTATUS = (cat && cat.substatus) || [];

                    var sel = document.getElementById('nt-sub');
                    sel.innerHTML = '<option value="" data-i18n="ntAll">' + esc(tt('ntAll')) + '</option>' +
                        NOTE_SUBSTATUS.map(function (s) {
