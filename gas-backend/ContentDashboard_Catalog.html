                        }).join('');
                    done();
                })
                .withFailureHandler(function (err) { toast(err.message, true); done(); })
                .getNoteFieldCatalog();
        }

        function loadNoteTemplates() {
            loadNoteCatalog(function () {
                google.script.run
                    .withSuccessHandler(function (items) {
                        NT_ITEMS = items || [];
                        google.script.run
                            .withSuccessHandler(function (d) { NT_DRAFTS = d || []; delete DRAFTS_OFFLINE.notes; renderNoteTemplates(); })
                            .withFailureHandler(function () { NT_DRAFTS = []; DRAFTS_OFFLINE.notes = true; renderNoteTemplates(); })
                            .listContentDrafts('note_template');
                    })
                    .withFailureHandler(function (err) {
                        document.getElementById('nt-list').innerHTML =
                            '<div class="state"><span class="material-symbols-rounded">error</span>' +
                            '<h2>Não foi possível carregar os modelos</h2><p>' + esc(err.message) + '</p></div>';
                    })
                    .listContentItems('note_template');
            });
        }

        function ntDraftForItem(itemId) {
            for (var i = 0; i < NT_DRAFTS.length; i++) {
                if (NT_DRAFTS[i].itemId === itemId) return NT_DRAFTS[i];
            }
            return null;
        }

        function parseTpl(raw) {
            try { return JSON.parse(raw || '{}'); } catch (e) { return { fields: {} }; }
        }

        function renderNoteTemplates() {
            var host = document.getElementById('nt-list');
            var fSub = document.getElementById('nt-sub').value;
            var lang = idiomaAtual();

            var mine = NT_ITEMS.filter(function (i) {
                if (i.lang !== lang) return false;
                if (fSub && i.key !== fSub) return false;
                return true;
            });

            if (!mine.length) {
                host.innerHTML =
                    '<div class="state"><span class="material-symbols-rounded">edit_note</span>' +
                    '<h2>Nenhum modelo em ' + esc(lang) + (fSub ? ' para este substatus' : '') + '</h2>' +
                    '<p>Enquanto isso o app segue com os cenários embutidos no código. ' +
                    'Rode a semeadura (seedNoteTemplatesNow) para trazer os atuais.</p></div>';
                return;
            }

            var porSub = {};
            mine.forEach(function (it) { (porSub[it.key] = porSub[it.key] || []).push(it); });

            var html = '';
            Object.keys(porSub).sort().forEach(function (sub) {
                var def = subDef(sub);
                html += '<div class="cat-head">' + esc(def ? def.name : sub) +
                    ' <span class="pill draft">' + porSub[sub].length + '</span></div>';

                porSub[sub].forEach(function (it) {
                    var v = parseTpl(it.value);
                    var nCampos = Object.keys(v.fields || {}).length;
                    var d = ntDraftForItem(it.id);
                    var badge = selosDoRascunho(d);
                    var escopo = (it.field && it.field !== 'all')
                        ? '<span class="pill draft">' + esc(String(it.field).toUpperCase()) + '</span>'
                        : '';

                    // Descartar só aparece quando existe rascunho não enviado e
                    // ele é seu: proposta em revisão se resolve pela fila.
                    var descarte = (d && d.status === 'draft' && !travadoPorOutro(d))
                        ? '<button class="btn btn-danger btn-sm" onclick="descartarRascunho(\'' +
                          d.draftId + '\', loadNoteTemplates)">Descartar rascunho</button>'
                        : '';

                    // Histórico é LEITURA: quem enxerga o item enxerga por onde ele
                    // passou. Só reverter é que depende de aprovar.
                    var historico = '<button class="btn btn-ghost btn-sm" '
                        + 'onclick="abrirHistorico(\'' + it.id + '\',\'' + it.lineage + '\',\'note_template\')">Histórico</button>'
                        + botaoComoAgente(it.id);

                    var actions = podeEscrever('note_template')
                        ? '<div style="display:flex;gap:8px">' + historico + descarte +
                        '<button class="btn btn-ghost btn-sm" onclick="openTemplateEditor(\'' + it.id + '\')">Editar</button>' +
                        '<button class="btn btn-danger btn-sm" onclick="askRemoval(\'' + it.id + '\')">Remover</button>' +
                        '</div>'
                        : '<div style="display:flex;gap:8px">' + historico + descarte + '</div>';

                    html += '<div class="item-row" data-item="' + esc(it.id) + '">' +
                        '<div class="item-main">' +
                        '<div class="item-name">' + esc(it.label) + ' ' + badge + ' ' + escopo + '</div>' +
                        '<div class="item-meta">' + nCampos + ' campo' + (nCampos === 1 ? '' : 's') +
                        ' preenchido' + (nCampos === 1 ? '' : 's') + '</div>' +
                        '</div>' + actions + '</div>';
                });
            });

            host.innerHTML = avisoRascunhosOffline('notes') + html;
        }

        // Construtor da nota: escolhido o substatus, a tela oferece exatamente os
        // campos daquela nota. É o que substitui o antigo "um trecho por campo" —
        // aqui a unidade é a nota inteira, que é como o agente pensa.
        function openTemplateEditor(itemId) {
            var item = null;
            for (var i = 0; i < NT_ITEMS.length; i++) {
                if (NT_ITEMS[i].id === itemId) item = NT_ITEMS[i];
            }

            var existingDraft = itemId ? ntDraftForItem(itemId) : null;
            var src = existingDraft || item;
            var v = src ? parseTpl(src.value) : { fields: {} };

            var curSub = src ? src.key : (document.getElementById('nt-sub').value || (NOTE_SUBSTATUS[0] || {}).key);
            var curLang = src ? src.lang : idiomaAtual();
            var curEsc = src ? (src.field || 'all') : 'all';

            var subOptions = NOTE_SUBSTATUS.map(function (s) {
                return '<option value="' + esc(s.key) + '"' + (s.key === curSub ? ' selected' : '') + '>' +
                    esc(s.name) + '</option>';
            }).join('');

            var escOptions = [['all', 'BAU e LM'], ['bau', 'Só BAU'], ['lm', 'Só LM']].map(function (o) {
                return '<option value="' + o[0] + '"' + (o[0] === curEsc ? ' selected' : '') + '>' +
                    esc(o[1]) + '</option>';
            }).join('');

            var langOptions = ['PT', 'ES', 'EN'].map(function (l) {
                return '<option value="' + l + '"' + (l === curLang ? ' selected' : '') + '>' + l + '</option>';
            }).join('');

            document.getElementById('modal-root').innerHTML =
                '<div class="modal-backdrop" onclick="if(event.target===this)closeModal()">' +
                '<div class="modal" style="max-width:760px" role="dialog" aria-modal="true">' +
                '<h2>' + (item ? 'Editar modelo de nota' : 'Nova nota') + '</h2>' +
                '<p class="card-sub">O status vem do substatus escolhido. Preencha só o que deve vir pronto — ' +
                'o resto o agente completa no atendimento.</p>' +
                (existingDraft && existingDraft.status === 'pending'
                    ? '<div class="note warn" style="margin-top:14px">Este modelo já está em revisão.</div>'
                    : '') +
                '<label class="fld" for="nt-f-name">Nome do modelo</label>' +
                '<input type="text" id="nt-f-name" placeholder="como o agente vê na lista" value="' +
                esc(src ? src.label : '') + '">' +
                '<div class="grid-2">' +
                '<div><label class="fld" for="nt-f-sub">Substatus</label>' +
                '<select id="nt-f-sub" onchange="renderTemplateFields()">' + subOptions + '</select></div>' +
                '<div><label class="fld" for="nt-f-esc">Aparece em</label>' +
                '<select id="nt-f-esc">' + escOptions + '</select></div>' +
                '</div>' +
                '<label class="fld" for="nt-f-lang">Idioma</label>' +
                '<select id="nt-f-lang">' + langOptions + '</select>' +
                '<div id="nt-fields" style="margin-top:8px"></div>' +
                '<div class="modal-actions">' +
                '<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>' +
                '<button class="btn btn-ghost" id="nt-draft">Salvar rascunho</button>' +
                '<button class="btn btn-primary" id="nt-save">Enviar para revisão</button>' +
                '</div></div></div>';

            renderTemplateFields(v.fields || {});

            document.getElementById('nt-save').onclick = function () {
                submitTemplate(itemId, existingDraft ? existingDraft.draftId : null, v, this);
            };
            document.getElementById('nt-draft').onclick = function () {
                submitTemplate(itemId, existingDraft ? existingDraft.draftId : null, v, this, true);
            };
            document.getElementById('nt-f-name').focus();
        }

        // Os campos oferecidos vêm do substatus escolhido, então é impossível
        // montar uma nota com um campo que ela não tem — que é exatamente a
        // falha silenciosa encontrada nos cenários antigos.
        function renderTemplateFields(valores) {
            var host = document.getElementById('nt-fields');
            if (!host) return;

            var sub = document.getElementById('nt-f-sub').value;
            var def = subDef(sub);

            // Ao TROCAR de substatus, preserva o que já foi digitado: trocar por
            // engano não pode apagar o trabalho.
            var atuais = valores;
            if (!atuais) {
                atuais = {};
                Array.prototype.forEach.call(host.querySelectorAll('textarea'), function (el) {
                    if (el.value.trim()) atuais['field-' + el.id.replace('ntf-', '')] = el.value;
                });
            }

            if (!def || !def.fields.length) {
                host.innerHTML = '<div class="note warn">Este substatus não tem campos de texto.</div>';
                return;
            }

            var req = def.requiredFields || [];
            var pref = def.prefixedFields || [];

            host.innerHTML =
                '<div class="cat-head" style="margin-top:22px">Campos de ' + esc(def.name) + '</div>' +
                def.fields.map(function (f) {
                    var obrig = req.indexOf(f) !== -1;
                    var temPrefixo = pref.indexOf(f) !== -1;
                    return '<label class="fld" for="ntf-' + esc(f) + '">' + esc(fieldLabel(f)) +
                        (obrig ? ' <span style="color:var(--danger)">*</span>' : '') +
                        (temPrefixo ? ' <span class="pill draft">a nota já prefixa</span>' : '') +
                        '</label>' +
                        '<textarea id="ntf-' + esc(f) + '" style="min-height:60px" ' +
                        'placeholder="deixe vazio para o agente preencher">' +
                        esc(atuais['field-' + f] || '') + '</textarea>';
                }).join('');
        }

        function submitTemplate(itemId, draftId, original, btn, apenasRascunho) {
            var nome = document.getElementById('nt-f-name').value.trim();
            if (!nome) return toast('Dê um nome ao modelo.', true);

            var sub = document.getElementById('nt-f-sub').value;
            var def = subDef(sub);
            var fields = {};

            (def ? def.fields : []).forEach(function (f) {
                var el = document.getElementById('ntf-' + f);
                if (el && el.value.trim()) fields['field-' + f] = el.value.trim();
            });

            // Tarefas vinculadas não são editáveis por aqui, mas precisam
            // sobreviver à edição: sem isso, editar o texto de um cenário
            // silenciosamente desligaria a seleção de tarefa que ele fazia.
            var value = JSON.stringify(Object.assign(
                { fields: fields },
                original && original.linkedTask ? { linkedTask: original.linkedTask } : {},
                original && original.activeTasks ? { activeTasks: original.activeTasks } : {}
            ));

            (apenasRascunho ? salvarRascunho : enviarProposta)({
                draftId: draftId || '',
                itemId: itemId || '',
                module: 'note_template',
                key: sub,
                field: document.getElementById('nt-f-esc').value,
                lang: document.getElementById('nt-f-lang').value,
                label: nome,
                value: value
            }, btn, loadNoteTemplates);
        }

        // --- Tasks (catálogo + screenshots do Win Criteria) ---
        //
        // A unidade aqui é a TASK, e não o screenshot: o que o agente marca na
        // nota é a task, e a lista de evidências é propriedade dela. Um item por
        // task, em `lang: 'ALL'`, com a tradução no próprio valor — mesma escolha
        // dos links (desc/desc_es) e pelo mesmo motivo: a QUANTIDADE de
        // evidências é uma decisão só, e duas linhas por idioma deixariam PT e ES
        // pedirem números diferentes de screenshot para o mesmo Win Criteria.
        var TSK_ITEMS = [];
        var TSK_DRAFTS = [];

        var TSK_MODOS = [
            { key: 'implementation', label: 'Implementação', ajuda: 'quando o agente implementa pelo anunciante' },
            { key: 'education', label: 'Educação', ajuda: 'quando o agente ensina o anunciante a implementar' }
        ];

        // Idiomas que traduzem as evidências. PT é a base e não aparece aqui.
        // Acrescentar um idioma é acrescentar uma entrada: o editor, as
        // contagens e o payload saem dela.
        var TSK_TRAD_LANGS = [
            { code: 'es', label: 'ES' },
            { code: 'en', label: 'EN' }
        ];

        function loadTaskCatalog() {
            google.script.run
                .withSuccessHandler(function (items) {
                    TSK_ITEMS = items || [];
                    google.script.run
                        .withSuccessHandler(function (d) { TSK_DRAFTS = d || []; delete DRAFTS_OFFLINE.tasks; renderTaskCatalog(); })
                        .withFailureHandler(function () { TSK_DRAFTS = []; DRAFTS_OFFLINE.tasks = true; renderTaskCatalog(); })
                        .listContentDrafts('task_screenshots');
                })
                .withFailureHandler(function (err) {
                    document.getElementById('tsk-list').innerHTML =
                        '<div class="state"><span class="material-symbols-rounded">error</span>' +
                        '<h2>Não foi possível carregar as tasks</h2><p>' + esc(err.message) + '</p></div>';
                })
                .listContentItems('task_screenshots');
        }

        function tskDraftForItem(itemId) {
            for (var i = 0; i < TSK_DRAFTS.length; i++) {
                if (TSK_DRAFTS[i].itemId === itemId) return TSK_DRAFTS[i];
            }
            return null;
        }

        function parseTask(raw) {
            var v;
            try { v = JSON.parse(raw || '{}'); } catch (e) { v = {}; }
            var s = v.screenshots || {};
            var out = {
                name: v.name || '',
                popular: v.popular === true,
                screenshots: {
                    implementation: Array.isArray(s.implementation) ? s.implementation : [],
                    education: Array.isArray(s.education) ? s.education : []
                },
                traducoes: {}
            };
            // `null` quando o modo não tem tradução própria: é diferente de
            // "traduzido para lista vazia", e é o que faz o agente cair no
            // texto base em vez de ficar sem campo.
            TSK_TRAD_LANGS.forEach(function (l) {
                var t = v['screenshots_' + l.code] || {};
                out.traducoes[l.code] = {
                    implementation: Array.isArray(t.implementation) ? t.implementation : null,
                    education: Array.isArray(t.education) ? t.education : null
                };
            });
            return out;
        }

        // Quantas linhas já têm redação própria num idioma. É a informação que
        // decide se vale abrir a task: "12 screenshots, 5 traduzidos" é trabalho
        // pendente, e sem isso ele fica invisível até alguém abrir uma por uma.
        function tskTraduzidos(v, modo, lang) {
            var lista = v.traducoes[lang][modo];
            if (!lista) return 0;
            var n = 0;
            for (var i = 0; i < lista.length; i++) {
                if (String(lista[i] || '').trim()) n++;
            }
            return n;
        }

        function renderTaskCatalog() {
            var host = document.getElementById('tsk-list');
            var summary = document.getElementById('tsk-summary');

            if (!TSK_ITEMS.length) {
                summary.textContent = 'Nenhuma task publicada ainda.';
                host.innerHTML =
                    '<div class="state"><span class="material-symbols-rounded">checklist</span>' +
                    '<h2>Nenhuma task na Central ainda</h2>' +
                    '<p>Enquanto isso o app segue com o catálogo embutido no código. ' +
                    'Rode a semeadura (seedTasksNow) para trazer as atuais.</p></div>';
                return;
            }

            var pend = TSK_DRAFTS.length;
            summary.textContent = TSK_ITEMS.length + ' tasks publicadas' +
                (pend ? ' · ' + pend + ' com alteração em andamento' : '');

            // Duas seções: o que o agente vê primeiro (Acesso rápido) e o resto do
            // catálogo. É a mesma divisão da tela dele, então quem edita enxerga
            // onde a task vai aparecer sem ter que abrir o app.
            var grupos = [
                { titulo: 'Acesso rápido', itens: TSK_ITEMS.filter(function (i) { return parseTask(i.value).popular; }) },
                { titulo: 'Catálogo completo', itens: TSK_ITEMS.filter(function (i) { return !parseTask(i.value).popular; }) }
            ];

            var html = '';
            grupos.forEach(function (g) {
                if (!g.itens.length) return;
                html += '<div class="cat-head">' + esc(g.titulo) +
                    ' <span class="pill draft">' + g.itens.length + '</span></div>';

                g.itens.forEach(function (it) {
                    var v = parseTask(it.value);
                    var d = tskDraftForItem(it.id);
                    var badge = selosDoRascunho(d);

                    var partes = TSK_MODOS.map(function (m) {
                        var total = v.screenshots[m.key].length;
                        if (!total) return m.label + ': nenhum';
                        var porIdioma = TSK_TRAD_LANGS.map(function (l) {
                            var n = tskTraduzidos(v, m.key, l.code);
                            return n === total ? l.label + ' ok' : l.label + ' ' + n + '/' + total;
                        }).join(', ');
                        return m.label + ': ' + total + ' (' + porIdioma + ')';
                    });

                    var descarte = (d && d.status === 'draft' && !travadoPorOutro(d))
                        ? '<button class="btn btn-danger btn-sm" onclick="descartarRascunho(\'' +
                          d.draftId + '\', loadTaskCatalog)">Descartar rascunho</button>'
                        : '';

                    // Histórico é LEITURA: quem enxerga o item enxerga por onde ele
                    // passou. Só reverter é que depende de aprovar.
                    var historico = '<button class="btn btn-ghost btn-sm" '
                        + 'onclick="abrirHistorico(\'' + it.id + '\',\'' + it.lineage + '\',\'task_screenshots\')">Histórico</button>'
                        + botaoComoAgente(it.id);

                    var actions = podeEscrever('task_screenshots')
                        ? '<div style="display:flex;gap:8px">' + historico + descarte +
                        '<button class="btn btn-ghost btn-sm" onclick="openTaskEditor(\'' + it.id + '\')">Editar</button>' +
                        '<button class="btn btn-danger btn-sm" onclick="askRemoval(\'' + it.id + '\')">Tirar do ar</button>' +
                        '</div>'
                        : '<div style="display:flex;gap:8px">' + historico + descarte + '</div>';

                    html += '<div class="item-row" data-item="' + esc(it.id) + '">' +
                        '<div class="item-main">' +
                        '<div class="item-name">' + esc(v.name || it.label) + ' ' + badge + '</div>' +
                        '<div class="item-meta"><code>' + esc(it.key) + '</code> — ' +
                        esc(partes.join(' · ')) + '</div>' +
                        '</div>' + actions + '</div>';
                });
            });

            host.innerHTML = avisoRascunhosOffline('tasks') + html;
        }

        // Uma chave a partir do nome, para quem está criando não ter de inventar
        // formato. Continua editável: é identidade, e quem conhece o catálogo
        // pode querer casar com o nome usado no Win Criteria.
        function tskChaveDoNome(nome) {
            return String(nome || '')
                .normalize('NFD').replace(DIACRITICOS_NA_TELA, '')
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, '_')
                .replace(/^_+|_+$/g, '')
                .slice(0, 40);
        }

        // Pareia as duas caixas POR NÚMERO DE LINHA, que é o que o olho faz ao
        // olhar as duas colunas lado a lado.
        //
        // Linha em branco no PT não é screenshot e sai da lista — junto com a
        // linha de ES na mesma posição, senão um separador em branco no meio da
        // lista deslocaria todas as traduções seguintes em silêncio. Linha de ES
        // que não pareia com nenhum screenshot é ERRO, e não texto descartado:
        // quem escreveu ali acha que traduziu algo.
        function tskPares(textoPt, textoTrad) {
            var pt = String(textoPt || '').split('\n');
            var es = String(textoTrad || '').split('\n');

            var base = [];
            var trad = [];
            var orfas = [];

            pt.forEach(function (linha, i) {
                var rotulo = String(linha).trim();
                if (!rotulo) return;
                base.push(rotulo);
                trad.push(String(es[i] == null ? '' : es[i]).trim());
            });

            es.forEach(function (linha, i) {
                if (!String(linha).trim()) return;
                if (i >= pt.length || !String(pt[i] || '').trim()) orfas.push(i + 1);
            });

            return { base: base, trad: trad, orfas: orfas };
        }

        // Editor. O nome é UM para todos os idiomas (como hoje: o catálogo do
        // agente nunca traduziu nome de task); o que tem coluna por idioma é a
        // lista de evidências, lado a lado, linha a linha.
        function openTaskEditor(itemId) {
            var item = null;
            for (var i = 0; i < TSK_ITEMS.length; i++) {
                if (TSK_ITEMS[i].id === itemId) item = TSK_ITEMS[i];
            }

            var existingDraft = itemId ? tskDraftForItem(itemId) : null;
            var src = existingDraft || item;
            var v = parseTask(src ? src.value : '{}');
            var chave = src ? src.key : '';

            var blocos = TSK_MODOS.map(function (m) {
                var base = v.screenshots[m.key];

                // A tradução é POSICIONAL: linha 3 traduz o screenshot 3.
                // Preenchida até o tamanho da base para todas as caixas
                // nascerem com o mesmo número de linhas — é a leitura que o
                // SME faz, e o desalinhamento é invisível sem isso.
                var colunas = TSK_TRAD_LANGS.map(function (l) {
                    var trad = v.traducoes[l.code][m.key] || [];
                    var linhas = base.map(function (_, i) { return String(trad[i] || ''); });
                    return '<div>' +
                        '<label class="fld" for="tsk-' + l.code + '-' + m.key + '">Tradução (' +
                        esc(l.label) + ') — mesma ordem</label>' +
                        '<textarea id="tsk-' + l.code + '-' + m.key + '" class="tsk-lista" ' +
                        'placeholder="deixe a linha em branco para manter o texto em PT">' +
                        esc(linhas.join('\n')) + '</textarea>' +
                        '</div>';
                }).join('');

                return '<div class="tsk-modo">' +
                    '<div class="cat-head" style="margin-top:22px">' + esc(m.label) +
                    ' <span class="pill draft">' + esc(m.ajuda) + '</span></div>' +
                    '<div class="grid-2">' +
                    '<div>' +
                    '<label class="fld" for="tsk-pt-' + m.key + '">Screenshots (PT) — um por linha</label>' +
                    '<textarea id="tsk-pt-' + m.key + '" class="tsk-lista" ' +
                    'placeholder="ex.: Tag criada&#10;Teste GTM&#10;Versão Publicada">' +
                    esc(base.join('\n')) + '</textarea>' +
                    '</div>' +
                    colunas +
                    '</div>' +
                    '<p class="card-sub tsk-contagem" id="tsk-contagem-' + m.key + '"></p>' +
                    '</div>';
            }).join('');

            document.getElementById('modal-root').innerHTML =
                '<div class="modal-backdrop" onclick="if(event.target===this)closeModal()">' +
                '<div class="modal" style="max-width:820px" role="dialog" aria-modal="true">' +
                '<h2>' + (item ? 'Editar task' : 'Nova task') + '</h2>' +
                '<p class="card-sub">Isso cria uma proposta. O que o agente vê só muda depois da aprovação.</p>' +
                (existingDraft && existingDraft.status === 'pending'
                    ? '<div class="note warn" style="margin-top:14px">Esta task já está em revisão.</div>'
                    : '') +
                '<div class="grid-2">' +
                '<div><label class="fld" for="tsk-f-name">Nome</label>' +
                '<input type="text" id="tsk-f-name" placeholder="como o agente vê na lista" ' +
                'maxlength="60" value="' + esc(v.name) + '"></div>' +
                '<div><label class="fld" for="tsk-f-key">Chave</label>' +
                (item
                    ? '<input type="text" id="tsk-f-key" value="' + esc(chave) + '" readonly ' +
                      'aria-describedby="tsk-key-ajuda">'
                    : '<input type="text" id="tsk-f-key" placeholder="ads_conversion_tracking" ' +
                      'maxlength="40" value="' + esc(chave) + '" aria-describedby="tsk-key-ajuda">') +
                '</div>' +
                '</div>' +
                '<p class="card-sub" id="tsk-key-ajuda">' +
                (item
                    ? 'A chave não muda: é o que os modelos de nota, os rascunhos salvos e os ' +
                      'atalhos do agente já guardam.'
                    : 'Identidade da task. Sai do nome automaticamente e não muda depois de criada.') +
                '</p>' +
                '<label class="chk" style="margin-top:16px">' +
                '<input type="checkbox" id="tsk-f-popular"' + (v.popular ? ' checked' : '') + '> ' +
                'Mostrar no <strong>Acesso rápido</strong> do agente' +
                '</label>' +
                blocos +
                '<div class="modal-actions">' +
                '<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>' +
                '<button class="btn btn-ghost" id="tsk-draft">Salvar rascunho</button>' +
                '<button class="btn btn-primary" id="tsk-save">Enviar para revisão</button>' +
                '</div></div></div>';

            // Chave sugerida enquanto o nome é digitado, e só em task nova: numa
            // existente ela é identidade e o campo é de leitura.
            if (!item) {
                var campoNome = document.getElementById('tsk-f-name');
                var campoChave = document.getElementById('tsk-f-key');
                var chaveTocada = !!chave;
                campoChave.addEventListener('input', function () { chaveTocada = true; });
                campoNome.addEventListener('input', function () {
                    if (!chaveTocada) campoChave.value = tskChaveDoNome(campoNome.value);
                });
            }

            TSK_MODOS.forEach(function (m) {
                document.getElementById('tsk-pt-' + m.key)
                    .addEventListener('input', function () { atualizarContagemTask(m.key); });
                TSK_TRAD_LANGS.forEach(function (l) {
                    document.getElementById('tsk-' + l.code + '-' + m.key)
                        .addEventListener('input', function () { atualizarContagemTask(m.key); });
                });
                atualizarContagemTask(m.key);
            });

            document.getElementById('tsk-save').onclick = function () {
                submitTask(itemId, existingDraft ? existingDraft.draftId : null, src, this);
            };
            document.getElementById('tsk-draft').onclick = function () {
                submitTask(itemId, existingDraft ? existingDraft.draftId : null, src, this, true);
            };
            document.getElementById('tsk-f-name').focus();
        }

        // A contagem existe porque o desalinhamento é invisível: uma linha a mais
        // numa tradução desloca todas as seguintes, e o agente daquele idioma
        // passa a ver a legenda de outra evidência sem nada dar erro.
        function atualizarContagemTask(modo) {
            var alvo = document.getElementById('tsk-contagem-' + modo);
            if (!alvo) return;

            var textoPt = document.getElementById('tsk-pt-' + modo).value;
            var pares = TSK_TRAD_LANGS.map(function (l) {
                return {
                    lang: l,
                    par: tskPares(textoPt, document.getElementById('tsk-' + l.code + '-' + modo).value)
                };
            });

            var comOrfas = pares.filter(function (x) { return x.par.orfas.length; });
            if (comOrfas.length) {
                alvo.textContent = comOrfas.map(function (x) {
                    return 'A linha ' + x.par.orfas.join(', ') + ' da coluna em ' + x.lang.label +
                        ' não fica ao lado de nenhum screenshot';
                }).join('; ') + ' — a tradução vai sair deslocada.';
                alvo.classList.add('erro');
                return;
            }

            alvo.classList.remove('erro');

            var base = pares[0].par.base;
            if (!base.length) {
                alvo.textContent = 'Nenhum screenshot neste modo — o agente não vê cartão para ele.';
                return;
            }

            var resumo = pares.map(function (x) {
                var n = x.par.trad.filter(function (t) { return t.length > 0; }).length;
                return n + ' em ' + x.lang.label + (n < base.length ? ' (resto sai em PT)' : '');
            }).join(' · ');

            alvo.textContent = base.length + ' screenshot' + (base.length === 1 ? '' : 's') +
                ' · ' + resumo;
        }

        function submitTask(itemId, draftId, src, btn, apenasRascunho) {
            var nome = document.getElementById('tsk-f-name').value.trim();
            if (!nome) return toast('Dê um nome à task.', true);

            var chave = document.getElementById('tsk-f-key').value.trim();
            if (!/^[a-z][a-z0-9_]{2,39}$/.test(chave)) {
                return toast('A chave usa de 3 a 40 caracteres entre letras minúsculas, números e "_", começando por letra.', true);
            }

            var screenshots = {};
            var traducoes = {};
            TSK_TRAD_LANGS.forEach(function (l) { traducoes[l.code] = {}; });
            var total = 0;

            for (var i = 0; i < TSK_MODOS.length; i++) {
                var modo = TSK_MODOS[i].key;
                var baseModo = null;

                for (var j = 0; j < TSK_TRAD_LANGS.length; j++) {
                    var lang = TSK_TRAD_LANGS[j];
                    var par = tskPares(
                        document.getElementById('tsk-pt-' + modo).value,
                        document.getElementById('tsk-' + lang.code + '-' + modo).value
                    );

                    if (par.orfas.length) {
                        return toast('Em "' + TSK_MODOS[i].label + '", a linha ' + par.orfas.join(', ') +
                            ' da coluna em ' + lang.label + ' não fica ao lado de nenhum screenshot.', true);
                    }

                    baseModo = par.base;

                    // A tradução viaja com as linhas em branco: é a POSIÇÃO que
                    // casa cada uma com o screenshot que ela traduz, e branco
                    // quer dizer "mantém o texto de PT".
                    if (par.trad.some(function (t) { return t.length > 0; })) {
                        traducoes[lang.code][modo] = par.trad;
                    }
                }

                screenshots[modo] = baseModo || [];
                total += screenshots[modo].length;
            }

            if (!total) {
                return toast('A task precisa de pelo menos um screenshot em um dos modos.', true);
            }

            var value = { name: nome, popular: document.getElementById('tsk-f-popular').checked,
                          screenshots: screenshots };
            TSK_TRAD_LANGS.forEach(function (l) {
                if (Object.keys(traducoes[l.code]).length) {
                    value['screenshots_' + l.code] = traducoes[l.code];
                }
            });

            (apenasRascunho ? salvarRascunho : enviarProposta)({
                draftId: draftId || '',
                itemId: itemId || '',
                module: 'task_screenshots',
                key: chave,
                lang: 'ALL',
                label: nome,
                value: JSON.stringify(value),
                sortOrder: src ? src.sortOrder : TSK_ITEMS.reduce(function (max, i) {
                    return Math.max(max, i.sortOrder);
                }, 0) + 1
            }, btn, loadTaskCatalog);
        }

        // --- E-mails ---
        var EM_ITEMS = [];
        var EM_DRAFTS = [];

        function loadEmails() {
            google.script.run
                .withSuccessHandler(function (items) {
                    EM_ITEMS = items || [];
                    google.script.run
                        .withSuccessHandler(function (d) { EM_DRAFTS = d || []; delete DRAFTS_OFFLINE.emails; renderEmails(); })
                        .withFailureHandler(function () { EM_DRAFTS = []; DRAFTS_OFFLINE.emails = true; renderEmails(); })
                        .listContentDrafts('email_template');
                })
                .withFailureHandler(function (err) {
                    document.getElementById('em-list').innerHTML =
                        '<div class="state"><span class="material-symbols-rounded">error</span>' +
                        '<h2>Não foi possível carregar os modelos</h2><p>' + esc(err.message) + '</p></div>';
                })
                .listContentItems('email_template');
        }

        function emDraftForItem(itemId) {
            for (var i = 0; i < EM_DRAFTS.length; i++) {
                if (EM_DRAFTS[i].itemId === itemId) return EM_DRAFTS[i];
            }
            return null;
        }

        function parseEmail(raw) {
            try { return JSON.parse(raw || '{}'); } catch (e) { return {}; }
        }

        function renderEmails() {
            var host = document.getElementById('em-list');
            var lang = idiomaAtual();
            var mine = EM_ITEMS.filter(function (i) { return i.lang === lang; });

            if (!mine.length) {
                host.innerHTML =
                    '<div class="state"><span class="material-symbols-rounded">mail</span>' +
                    '<h2>Nenhum modelo publicado em ' + esc(lang) + '</h2>' +
                    '<p>Enquanto isso o assistente segue com os modelos embutidos no código. ' +
                    'Rode a semeadura (seedEmailsNow) para trazer os atuais.</p></div>';
                return;
            }

            var byCat = {};
            mine.forEach(function (it) { (byCat[it.field || 'Sem categoria'] = byCat[it.field || 'Sem categoria'] || []).push(it); });

            var html = '';
            Object.keys(byCat).sort().forEach(function (cat) {
                html += '<div class="cat-head">' + esc(cat) +
                    ' <span class="pill draft">' + byCat[cat].length + '</span></div>';

                byCat[cat].forEach(function (it) {
                    var v = parseEmail(it.value);
                    var d = emDraftForItem(it.id);
                    var badge = selosDoRascunho(d);

                    var nPh = (v.placeholders || []).length;
                    var phInfo = lang === 'PT'
                        ? nPh + ' campo' + (nPh === 1 ? '' : 's')
                        : Object.keys(v.labels || {}).length + ' rótulos';

                    // Descartar só aparece quando existe rascunho não enviado e
                    // ele é seu: proposta em revisão se resolve pela fila.
                    var descarte = (d && d.status === 'draft' && !travadoPorOutro(d))
                        ? '<button class="btn btn-danger btn-sm" onclick="descartarRascunho(\'' +
                          d.draftId + '\', loadEmails)">Descartar rascunho</button>'
                        : '';

                    // Histórico é LEITURA: quem enxerga o item enxerga por onde ele
                    // passou. Só reverter é que depende de aprovar.
                    var historico = '<button class="btn btn-ghost btn-sm" '
                        + 'onclick="abrirHistorico(\'' + it.id + '\',\'' + it.lineage + '\',\'email_template\')">Histórico</button>'
                        + botaoComoAgente(it.id);

                    var actions = podeEscrever('email_template')
                        ? '<div style="display:flex;gap:8px">' + historico + descarte +
                        '<button class="btn btn-ghost btn-sm" onclick="openEmailEditor(\'' + it.id + '\')">Editar</button>' +
                        '</div>'
                        : '<div style="display:flex;gap:8px">' + historico + descarte + '</div>';

                    html += '<div class="item-row" data-item="' + esc(it.id) + '">' +
                        '<div class="item-main">' +
                        '<div class="item-name">' + esc(it.label) + ' ' + badge + '</div>' +
                        '<div class="item-meta">' + esc(v.subject || '') + ' · ' + esc(phInfo) + '</div>' +
                        '</div>' + actions + '</div>';
                });
            });

            host.innerHTML = avisoRascunhosOffline('emails') + html;
        }

        function openEmailEditor(itemId) {
            var item = null;
            for (var i = 0; i < EM_ITEMS.length; i++) {
                if (EM_ITEMS[i].id === itemId) item = EM_ITEMS[i];
            }
            if (!item) return;

            var existingDraft = emDraftForItem(itemId);
            var src = existingDraft || item;
            var v = parseEmail(src.value);
            var lang = item.lang;

            var phList = lang === 'PT'
                ? (v.placeholders || []).map(function (p) {
                    return '<code style="font-size:12px">' + esc(p.key) + '</code>';
                }).join(' ')
                : Object.keys(v.labels || {}).map(function (k) {
                    return '<code style="font-size:12px">' + esc(k) + '</code>';
                }).join(' ');

            document.getElementById('modal-root').innerHTML =
                '<div class="modal-backdrop" onclick="if(event.target===this)closeModal()">' +
                '<div class="modal" style="max-width:820px" role="dialog" aria-modal="true">' +
                '<h2>Editar modelo — ' + esc(lang) + '</h2>' +
                '<p class="card-sub">' + esc(item.label) + '</p>' +
                (existingDraft && existingDraft.status === 'pending'
                    ? '<div class="note warn" style="margin-top:14px">Este modelo já está em revisão.</div>'
                    : '') +
                '<div class="note" style="margin-top:14px">Campos deste modelo: ' +
                (phList || '<em>nenhum</em>') +
                '<br>Use-os no texto exatamente assim. Um campo não usado — ou um texto entre ' +
                'colchetes que não seja campo — é recusado ao salvar.</div>' +
                '<label class="fld" for="em-subject">Assunto</label>' +
                '<input type="text" id="em-subject" value="' + esc(v.subject || '') + '">' +
                '<label class="fld" for="em-body">Corpo (HTML)</label>' +
                '<textarea id="em-body" style="min-height:200px;font-family:ui-monospace,monospace;font-size:12.5px">' +
                esc(v.template || '') + '</textarea>' +
                '<div class="row-between" style="margin-top:18px">' +
                '<div class="card-title" style="margin:0">Prévia</div>' +
                '<button class="btn btn-ghost btn-sm" onclick="refreshEmailPreview()">Atualizar prévia</button>' +
                '</div>' +
                '<div id="em-preview" style="border:1px solid var(--border-subtle);border-radius:var(--radius-sm);' +
                'padding:16px;margin-top:8px;background:#fff;color:#202124;max-height:280px;overflow:auto"></div>' +
                '<div class="modal-actions">' +
                '<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>' +
                '<button class="btn btn-ghost" id="em-draft">Salvar rascunho</button>' +
                '<button class="btn btn-primary" id="em-save">Enviar para revisão</button>' +
                '</div></div></div>';

            refreshEmailPreview();
            document.getElementById('em-body').addEventListener('input', refreshEmailPreview);

            document.getElementById('em-save').onclick = function () {
                submitEmail(item, existingDraft ? existingDraft.draftId : null, v, this);
            };
            document.getElementById('em-draft').onclick = function () {
                submitEmail(item, existingDraft ? existingDraft.draftId : null, v, this, true);
            };
        }

        // A prévia renderiza o HTML como o anunciante vai receber. É o ponto da
        // fase: sem ver, dá pra publicar um <p> não fechado e só descobrir no
        // e-mail já enviado.
        function refreshEmailPreview() {
            var body = document.getElementById('em-body');
            var host = document.getElementById('em-preview');
            if (!body || !host) return;
            // Mesmo isolamento da prévia da fila: aqui o texto é seu, então o
            // risco é menor, mas manter dois caminhos diferentes para renderizar
            // a mesma coisa é como um deles fica para trás.
            host.innerHTML = previaIsolada(body.value, 200);
        }

        function submitEmail(item, draftId, original, btn, apenasRascunho) {
            var subject = document.getElementById('em-subject').value.trim();
            var template = document.getElementById('em-body').value.trim();

            if (!subject) return toast('O e-mail precisa de um assunto.', true);
            if (!template) return toast('O e-mail precisa de um corpo.', true);

            // Só assunto e corpo são editáveis: a lista de campos (e, fora do
            // PT, os rótulos) segue como está. Mexer nela pela tela exigiria
            // casar as linguagens de uma vez, e é justamente onde um erro vaza
            // placeholder literal para o anunciante.
            //
            // "Fora do PT", e não "ES": o EN guarda `labels` como o ES. Com o
            // teste antigo, salvar um modelo EN gravava `placeholders: []` e
            // apagava os rótulos sem aviso.
            var value = (item.lang !== 'PT')
                ? JSON.stringify({ subject: subject, template: template, labels: original.labels || {} })
                : JSON.stringify({ subject: subject, template: template, placeholders: original.placeholders || [] });

            (apenasRascunho ? salvarRascunho : enviarProposta)({
                draftId: draftId || '',
                itemId: item.id,
                module: 'email_template',
                key: item.key,
                field: item.field,
                lang: item.lang,
                label: item.label,
                value: value,
                sortOrder: item.sortOrder
            }, btn, loadEmails);
        }

        // --- Dicas ---
        var TP_ITEMS = [];
        var TP_DRAFTS = [];

        function loadTips() {
            google.script.run
                .withSuccessHandler(function (items) {
                    TP_ITEMS = items || [];
                    google.script.run
                        .withSuccessHandler(function (d) { TP_DRAFTS = d || []; delete DRAFTS_OFFLINE.tips; renderTips(); })
                        .withFailureHandler(function () { TP_DRAFTS = []; DRAFTS_OFFLINE.tips = true; renderTips(); })
                        .listContentDrafts('tips');
                })
                .withFailureHandler(function (err) {
                    document.getElementById('tp-list').innerHTML =
                        '<div class="state"><span class="material-symbols-rounded">error</span>' +
                        '<h2>Não foi possível carregar as dicas</h2><p>' + esc(err.message) + '</p></div>';
                })
                .listContentItems('tips');
        }

        function tpDraftForItem(itemId) {
            for (var i = 0; i < TP_DRAFTS.length; i++) {
                if (TP_DRAFTS[i].itemId === itemId) return TP_DRAFTS[i];
            }
            return null;
        }

        function renderTips() {
            var host = document.getElementById('tp-list');
            var summary = document.getElementById('tp-summary');

            if (!TP_ITEMS.length) {
                summary.textContent = 'Nenhuma dica publicada ainda.';
                host.innerHTML =
                    '<div class="state"><span class="material-symbols-rounded">lightbulb</span>' +
                    '<h2>Nenhuma dica na Central ainda</h2>' +
                    '<p>Enquanto isso o app segue lendo a aba Tips, como sempre leu. ' +
                    'Rode a semeadura (seedTipsNow) para trazer as atuais.</p></div>';
                return;
            }

            summary.textContent = TP_ITEMS.length + ' dicas publicadas' +
                (TP_DRAFTS.length ? ' · ' + TP_DRAFTS.length + ' com alteração em andamento' : '');

            host.innerHTML = avisoRascunhosOffline('tips') + TP_ITEMS.map(function (it) {
                var d = tpDraftForItem(it.id);
                var badge = selosDoRascunho(d);

                var descarte = (d && d.status === 'draft' && !travadoPorOutro(d))
                    ? '<button class="btn btn-danger btn-sm" onclick="descartarRascunho(\'' +
                      d.draftId + '\', loadTips)">Descartar rascunho</button>'
                    : '';

                // Histórico é LEITURA: quem enxerga o item enxerga por onde ele
                // passou. Só reverter é que depende de aprovar.
                var historico = '<button class="btn btn-ghost btn-sm" '
                    + 'onclick="abrirHistorico(\'' + it.id + '\',\'' + it.lineage + '\',\'tips\')">Histórico</button>'
                    + botaoComoAgente(it.id);

                var actions = podeEscrever('tips')
                    ? '<div style="display:flex;gap:8px">' + historico + descarte +
                    '<button class="btn btn-ghost btn-sm" onclick="openTipEditor(\'' + it.id + '\')">Editar</button>' +
                    '<button class="btn btn-danger btn-sm" onclick="askRemoval(\'' + it.id + '\')">Remover</button>' +
                    '</div>'
                    : '<div style="display:flex;gap:8px">' + historico + descarte + '</div>';

                return '<div class="item-row" data-item="' + esc(it.id) + '">' +
                    '<div class="item-main">' +
                    '<div class="item-meta" style="font-size:14px;color:var(--text-primary)">' +
                    esc(it.value) + ' ' + badge + '</div>' +
                    '</div>' + actions + '</div>';
            }).join('');
        }

        function openTipEditor(itemId) {
            var item = null;
            for (var i = 0; i < TP_ITEMS.length; i++) {
                if (TP_ITEMS[i].id === itemId) item = TP_ITEMS[i];
            }

            var existingDraft = itemId ? tpDraftForItem(itemId) : null;
            var src = existingDraft || item;

            document.getElementById('modal-root').innerHTML =
                '<div class="modal-backdrop" onclick="if(event.target===this)closeModal()">' +
                '<div class="modal" role="dialog" aria-modal="true">' +
                '<h2>' + (item ? 'Editar dica' : 'Nova dica') + '</h2>' +
                '<p class="card-sub">Aparece durante os carregamentos. Frases curtas funcionam melhor.</p>' +
                (existingDraft && existingDraft.status === 'pending'
                    ? '<div class="note warn" style="margin-top:14px">Esta dica já está em revisão.</div>'
                    : '') +
                '<label class="fld" for="tp-text">Texto</label>' +
                '<textarea id="tp-text" style="min-height:70px">' + esc(src ? src.value : '') + '</textarea>' +
                '<div class="modal-actions">' +
                '<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>' +
                '<button class="btn btn-ghost" id="tp-draft">Salvar rascunho</button>' +
                '<button class="btn btn-primary" id="tp-save">Enviar para revisão</button>' +
                '</div></div></div>';

            document.getElementById('tp-save').onclick = function () {
                submitTip(itemId, existingDraft ? existingDraft.draftId : null, src, this);
            };
            document.getElementById('tp-draft').onclick = function () {
                submitTip(itemId, existingDraft ? existingDraft.draftId : null, src, this, true);
            };
            document.getElementById('tp-text').focus();
        }

        function submitTip(itemId, draftId, src, btn, apenasRascunho) {
            var text = document.getElementById('tp-text').value.trim();
            if (!text) return toast('Escreva o texto da dica.', true);

            var sortOrder = src ? src.sortOrder : TP_ITEMS.reduce(function (max, i) {
                return Math.max(max, i.sortOrder);
            }, 0) + 1;

            (apenasRascunho ? salvarRascunho : enviarProposta)({
                draftId: draftId || '',
                itemId: itemId || '',
                module: 'tips',
                key: 'geral',
                lang: 'ALL',
                // A dica é o próprio conteúdo: não há título separado.
                label: text,
                value: text,
                sortOrder: sortOrder
            }, btn, loadTips);
        }

</script>
