<!-- Parte de gas-backend/ContentDashboard.html. Ver o cabeçalho de lá. -->
<!-- Módulos de CATÁLOGO: passam pela fila de aprovação.
     Links, Call Script, Case Notes, E-mails e Dicas. -->
<script>
        // --- Links ---
        function loadLinks() {
            google.script.run
                .withSuccessHandler(function (items) {
                    LIVE_LINKS = items || [];
                    google.script.run
                        .withSuccessHandler(function (drafts) {
                            MY_DRAFTS = drafts || [];
                            delete DRAFTS_OFFLINE.links;
                            renderLinks();
                        })
                        .withFailureHandler(function () { MY_DRAFTS = []; DRAFTS_OFFLINE.links = true; renderLinks(); })
                        .listContentDrafts('links');
                })
                .withFailureHandler(function (err) {
                    document.getElementById('links-list').innerHTML =
                        '<div class="state"><span class="material-symbols-rounded">error</span>' +
                        '<h2>Não foi possível carregar os links</h2><p>' + esc(err.message) + '</p></div>';
                })
                .listContentItems('links');
        }

        function draftForItem(itemId) {
            for (var i = 0; i < MY_DRAFTS.length; i++) {
                if (MY_DRAFTS[i].itemId === itemId) return MY_DRAFTS[i];
            }
            return null;
        }

        function renderLinks() {
            var host = document.getElementById('links-list');
            var summary = document.getElementById('links-summary');

            if (!LIVE_LINKS.length) {
                summary.textContent = 'Nenhum link publicado ainda.';
                host.innerHTML =
                    '<div class="state"><span class="material-symbols-rounded">link_off</span>' +
                    '<h2>Nenhum link na planilha ainda</h2>' +
                    '<p>Enquanto isso o app segue usando a lista embutida no código. ' +
                    'Rode a semeadura (seedContentModule) ou crie o primeiro link aqui.</p></div>';
                return;
            }

            var byCat = {};
            LIVE_LINKS.forEach(function (it) {
                (byCat[it.key] = byCat[it.key] || []).push(it);
            });

            var pend = MY_DRAFTS.length;
            summary.textContent = LIVE_LINKS.length + ' links publicados' +
                (pend ? ' · ' + pend + ' com alteração em andamento' : '');

            var html = '';
            Object.keys(byCat).sort().forEach(function (cat) {
                html += '<div class="cat-head">' + esc(CATEGORY_LABELS[cat] || cat) +
                    ' <span class="pill draft">' + byCat[cat].length + '</span></div>';

                byCat[cat].forEach(function (it) {
                    var v = parseLinkValue(it.value);
                    var d = draftForItem(it.id);
                    var badge = selosDoRascunho(d);

                    // Descartar só aparece quando existe rascunho não enviado e
                    // ele é seu: proposta em revisão se resolve pela fila.
                    var descarte = (d && d.status === 'draft' && !travadoPorOutro(d))
                        ? '<button class="btn btn-danger btn-sm" onclick="descartarRascunho(\'' +
                          d.draftId + '\', loadLinks)">Descartar rascunho</button>'
                        : '';

                    // Histórico é LEITURA: quem enxerga o item enxerga por onde ele
                    // passou. Só reverter é que depende de aprovar.
                    var historico = '<button class="btn btn-ghost btn-sm" '
                        + 'onclick="abrirHistorico(\'' + it.id + '\',\'' + it.lineage + '\',\'links\')">Histórico</button>'
                        + botaoComoAgente(it.id);

                    var actions = podeEscrever('links')
                        ? '<div style="display:flex;gap:8px">' + historico + descarte +
                        '<button class="btn btn-ghost btn-sm" onclick="openLinkEditor(\'' + it.id + '\')">Editar</button>' +
                        '<button class="btn btn-danger btn-sm" onclick="askRemoval(\'' + it.id + '\')">Tirar do ar</button>' +
                        '</div>'
                        : '<div style="display:flex;gap:8px">' + historico + descarte + '</div>';

                    html += '<div class="item-row" data-item="' + esc(it.id) + '">' +
                        '<div class="item-main">' +
                        '<div class="item-name">' + esc(v.name) + ' ' + badge + '</div>' +
                        '<div class="item-meta">' + esc(v.desc) + ' — ' + esc(v.url) + '</div>' +
                        '</div>' + actions + '</div>';
                });
            });

            host.innerHTML = avisoRascunhosOffline('links') + html;
        }

        function closeModal() {
            document.getElementById('modal-root').innerHTML = '';
        }

        // Salvar e enviar para revisão, numa viagem só ao servidor.
        //
        // Antes eram duas chamadas encadeadas (três nos e-mails e nas notas, que
        // ainda validavam antes), cada uma com a latência do google.script.run —
        // e um estado ruim no meio: falhar no envio deixava um rascunho salvo
        // que a pessoa achava ter mandado. A validação não se perdeu: o servidor
        // valida dentro de saveAndSubmitContentDraft(), antes de gravar.
        // Quais módulos falharam ao carregar os rascunhos nesta sessão.
        //
        // Antes a falha virava lista vazia e a tela desenhava "nenhuma proposta
        // em andamento" — indistinguível de realmente não haver nenhuma. Quem
        // então editava um item com proposta pendente levava uma recusa do
        // servidor sem ter como explicar. Erro que o usuário não vê é erro que
        // ele paga depois.
        var DRAFTS_OFFLINE = {};

        function avisoRascunhosOffline(module) {
            if (!DRAFTS_OFFLINE[module]) return '';
            return '<div class="note warn" style="margin-bottom:12px">' +
                'Não foi possível carregar as propostas em andamento deste módulo. ' +
                'A lista abaixo mostra só o que está no ar — um item pode ter uma ' +
                'proposta em revisão que não aparece aqui. ' +
                '<button class="btn btn-ghost btn-sm" style="margin-left:8px" ' +
                'onclick="switchTab(\'' + module + '\')">Tentar de novo</button></div>';
        }

        // Salvar SEM enviar. O rascunho existia no modelo de dados desde o
        // começo e era inalcançável: todo editor tinha um botão só, que salvava
        // e submetia no mesmo gesto. Sem isto não havia como guardar trabalho
        // parcial — fechar o editor descartava tudo — e a trava de edição
        // cooperativa nunca chegava a valer, porque nada ficava aberto.
        function salvarRascunho(payload, btn, aoConcluir) {
            var rotulo = btn.textContent;
            btn.disabled = true;
            btn.textContent = 'Salvando…';

            google.script.run
                .withSuccessHandler(function () {
                    closeModal();
                    toast('Rascunho salvo. Ninguém vê até você enviar.');
                    if (aoConcluir) aoConcluir();
                })
                .withFailureHandler(function (err) {
                    btn.disabled = false;
                    btn.textContent = rotulo;
                    toast(err.message, true);
                })
                .saveContentDraft(payload);
        }

        // Descartar o que foi guardado e não vai virar proposta. Sem esta saída
        // o rascunho vira armadilha: fica na lista, conta na home e a próxima
        // edição do item reabre o texto abandonado.
        function descartarRascunho(draftId, aoConcluir) {
            document.getElementById('modal-root').innerHTML =
                '<div class="modal-backdrop" onclick="if(event.target===this)closeModal()">' +
                '<div class="modal" style="max-width:440px" role="dialog" aria-modal="true"' +
                ' aria-labelledby="desc-titulo">' +
                '<h2 id="desc-titulo">Descartar este rascunho?</h2>' +
                '<p class="card-sub">O texto guardado some. O que está no ar não muda.</p>' +
                '<div class="modal-actions">' +
                '<button class="btn btn-ghost" onclick="closeModal()">Manter</button>' +
                '<button class="btn btn-danger" id="desc-go">Descartar</button>' +
                '</div></div></div>';

            document.getElementById('desc-go').onclick = function () {
                this.disabled = true;
                google.script.run
                    .withSuccessHandler(function () {
                        closeModal();
                        toast('Rascunho descartado.');
                        if (aoConcluir) aoConcluir();
                    })
                    .withFailureHandler(function (err) { toast(err.message, true); })
                    .discardContentDraft(draftId);
            };
        }

        // Quem está com o item aberto AGORA, se for outra pessoa. A trava é
        // cooperativa e expira sozinha (CONTENT_LOCK_TTL_MS no servidor); aqui
        // a janela é a mesma, para a tela não anunciar uma trava que o servidor
        // já não respeita.
        var TRAVA_TTL_MS = 10 * 60 * 1000;

        function travadoPorOutro(rascunho) {
            if (!rascunho || !rascunho.lockedBy || !SESSION) return '';
            if (rascunho.lockedBy === SESSION.ldap) return '';

            var quando = new Date(rascunho.lockedAt).getTime();
            if (isNaN(quando) || (Date.now() - quando) > TRAVA_TTL_MS) return '';

            return rascunho.lockedBy;
        }

        // Rótulo do rascunho na linha do item: o que ele é, e de quem.
        function selosDoRascunho(rascunho) {
            if (!rascunho) return '';

            if (rascunho.status === 'pending') {
                return ' <span class="estado estado-espera">em revisão</span>';
            }

            var quem = travadoPorOutro(rascunho);
            if (quem) {
                return ' <span class="estado estado-espera">' + esc(quem) + ' está editando</span>';
            }
            return ' <span class="estado estado-espera">rascunho seu</span>';
        }

        function enviarProposta(payload, btn, aoConcluir) {
            var rotulo = btn.textContent;
            btn.disabled = true;
            btn.textContent = 'Enviando…';

            google.script.run
                .withSuccessHandler(function () {
                    closeModal();
                    toast('Proposta enviada para revisão.');
                    if (aoConcluir) aoConcluir();
                    loadPendingCount();
                })
                .withFailureHandler(function (err) {
                    btn.disabled = false;
                    btn.textContent = rotulo;
                    toast(err.message, true);
                })
                .saveAndSubmitContentDraft(payload);
        }

        function openLinkEditor(itemId) {
            var item = null;
            for (var i = 0; i < LIVE_LINKS.length; i++) {
                if (LIVE_LINKS[i].id === itemId) item = LIVE_LINKS[i];
            }

            var existingDraft = itemId ? draftForItem(itemId) : null;
            var src = existingDraft || item;
            var v = parseLinkValue(src ? src.value : '{}');
            var cat = src ? src.key : 'tasks';

            var catOptions = Object.keys(CATEGORY_LABELS).map(function (k) {
                return '<option value="' + k + '"' + (k === cat ? ' selected' : '') + '>' +
                    esc(CATEGORY_LABELS[k]) + '</option>';
            }).join('');

            document.getElementById('modal-root').innerHTML =
                '<div class="modal-backdrop" onclick="if(event.target===this)closeModal()">' +
                '<div class="modal" role="dialog" aria-modal="true">' +
                '<h2>' + (item ? 'Editar link' : 'Novo link') + '</h2>' +
                '<p class="card-sub">Isso cria uma proposta. O link no ar só muda depois da aprovação.</p>' +
                (existingDraft && existingDraft.status === 'pending'
                    ? '<div class="note warn" style="margin-top:14px">Este item já está em revisão. Cancele o envio para editar de novo.</div>'
                    : '') +
                '<label class="fld" for="lnk-name">Nome</label>' +
                '<input type="text" id="lnk-name" value="' + esc(v.name) + '">' +
                '<label class="fld" for="lnk-url">URL</label>' +
                '<input type="url" id="lnk-url" value="' + esc(v.url) + '">' +
                '<div class="grid-2">' +
                '<div><label class="fld" for="lnk-desc">Descrição (PT)</label>' +
                '<input type="text" id="lnk-desc" value="' + esc(v.desc) + '"></div>' +
                '<div><label class="fld" for="lnk-desc-es">Descrição (ES)</label>' +
                '<input type="text" id="lnk-desc-es" value="' + esc(v.desc_es) + '"></div>' +
                '</div>' +
                '<label class="fld" for="lnk-cat">Categoria</label>' +
                '<select id="lnk-cat">' + catOptions + '</select>' +
                '<div class="modal-actions">' +
                '<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>' +
                '<button class="btn btn-ghost" id="lnk-draft">Salvar rascunho</button>' +
                '<button class="btn btn-primary" id="lnk-save">Enviar para revisão</button>' +
                '</div></div></div>';

            document.getElementById('lnk-save').onclick = function () {
                submitLink(itemId, existingDraft ? existingDraft.draftId : null, this);
            };
            document.getElementById('lnk-draft').onclick = function () {
                submitLink(itemId, existingDraft ? existingDraft.draftId : null, this, true);
            };
            document.getElementById('lnk-name').focus();
        }

        function submitLink(itemId, draftId, btn, apenasRascunho) {
            var name = document.getElementById('lnk-name').value.trim();
            var url = document.getElementById('lnk-url').value.trim();

            if (!name) return toast('Dê um nome ao link.', true);
            if (!/^https?:\/\/|^http:\/\/go\//i.test(url)) {
                return toast('A URL precisa começar com http:// ou https://', true);
            }

            var payload = {
                draftId: draftId || '',
                itemId: itemId || '',
                module: 'links',
                key: document.getElementById('lnk-cat').value,
                lang: 'ALL',
                label: name,
                value: JSON.stringify({
                    name: name,
                    url: url,
                    desc: document.getElementById('lnk-desc').value.trim(),
                    desc_es: document.getElementById('lnk-desc-es').value.trim()
                })
            };

            (apenasRascunho ? salvarRascunho : enviarProposta)(payload, btn, loadLinks);
        }

        function askRemoval(itemId) {
            document.getElementById('modal-root').innerHTML =
                '<div class="modal-backdrop" onclick="if(event.target===this)closeModal()">' +
                '<div class="modal" role="dialog" aria-modal="true">' +
                '<h2>Tirar este link do ar?</h2>' +
                '<p class="card-sub">Também passa por aprovação. Nada é apagado — a versão fica arquivada e pode voltar.</p>' +
                '<label class="fld" for="rm-reason">Motivo</label>' +
                '<textarea id="rm-reason" placeholder="ex.: ferramenta descontinuada"></textarea>' +
                '<div class="modal-actions">' +
                '<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>' +
                '<button class="btn btn-danger" id="rm-go">Enviar para revisão</button>' +
                '</div></div></div>';

            document.getElementById('rm-go').onclick = function () {
                var reason = document.getElementById('rm-reason').value.trim();
                if (!reason) return toast('Explique o motivo.', true);
                this.disabled = true;

                google.script.run
                    .withSuccessHandler(function () {
                        closeModal();
                        toast('Pedido de remoção enviado.');
                        refreshContentLists();
                        loadPendingCount();
                    })
                    .withFailureHandler(function (err) { toast(err.message, true); })
                    .requestContentRemoval(itemId, reason);
            };
        }

        // --- Call Script ---
        var CS_ITEMS = [];
        var CS_DRAFTS = [];

        var CS_GROUPS = [
            { key: 'inicio', label: 'Início' },
            { key: 'meio', label: 'Implementação (Tag Support)' },
            { key: 'fim', label: 'Encerramento' }
        ];

        function loadCallScript() {
            google.script.run
                .withSuccessHandler(function (items) {
                    CS_ITEMS = items || [];
                    google.script.run
                        .withSuccessHandler(function (d) { CS_DRAFTS = d || []; delete DRAFTS_OFFLINE.callscript; renderCallScript(); })
                        .withFailureHandler(function () { CS_DRAFTS = []; DRAFTS_OFFLINE.callscript = true; renderCallScript(); })
                        .listContentDrafts('call_script');
                })
                .withFailureHandler(function (err) {
                    document.getElementById('cs-list').innerHTML =
                        '<div class="state"><span class="material-symbols-rounded">error</span>' +
                        '<h2>Não foi possível carregar o roteiro</h2><p>' + esc(err.message) + '</p></div>';
                })
                .listContentItems('call_script');
        }

        function csDraftForItem(itemId) {
            for (var i = 0; i < CS_DRAFTS.length; i++) {
                if (CS_DRAFTS[i].itemId === itemId) return CS_DRAFTS[i];
            }
            return null;
        }

        function renderCallScript() {
            var host = document.getElementById('cs-list');
            var lang = idiomaAtual();
            var flow = document.getElementById('cs-flow').value;

            var mine = CS_ITEMS.filter(function (i) { return i.lang === lang && i.key === flow; });

            if (!mine.length) {
                host.innerHTML =
                    '<div class="state"><span class="material-symbols-rounded">support_agent</span>' +
                    '<h2>Nenhum passo publicado para ' + esc(lang + ' ' + flow) + '</h2>' +
                    '<p>Enquanto isso o app segue com o roteiro embutido no código. ' +
                    'Rode a semeadura (seedCallScriptNow) ou crie o primeiro passo aqui.</p></div>';
                return;
            }

            var html = '';
            CS_GROUPS.forEach(function (g) {
                var steps = mine.filter(function (i) { return i.field === g.key; })
                    .sort(function (a, b) { return a.sortOrder - b.sortOrder; });

                html += '<div class="cat-head">' + esc(g.label) +
                    ' <span class="pill draft">' + steps.length + '</span></div>';

                // A seção de Implementação ainda não existe em ES: é conteúdo que
                // nunca chegou, não bug. Dizer isso explicitamente evita que pareça
                // uma falha de carregamento.
                if (!steps.length) {
                    html += '<div class="item-row"><div class="item-main">' +
                        '<div class="item-meta">Sem passos cadastrados nesta seção. ' +
                        'Use “Novo passo” para preencher.</div></div></div>';
                    return;
                }

                steps.forEach(function (it, idx) {
                    var d = csDraftForItem(it.id);
                    var badge = selosDoRascunho(d);

                    // Descartar só aparece quando existe rascunho não enviado e
                    // ele é seu: proposta em revisão se resolve pela fila.
                    var descarte = (d && d.status === 'draft' && !travadoPorOutro(d))
                        ? '<button class="btn btn-danger btn-sm" onclick="descartarRascunho(\'' +
                          d.draftId + '\', loadCallScript)">Descartar rascunho</button>'
                        : '';

                    // Histórico é LEITURA: quem enxerga o item enxerga por onde ele
                    // passou. Só reverter é que depende de aprovar.
                    var historico = '<button class="btn btn-ghost btn-sm" '
                        + 'onclick="abrirHistorico(\'' + it.id + '\',\'' + it.lineage + '\',\'call_script\')">Histórico</button>'
                        + botaoComoAgente(it.id);

                    var actions = podeEscrever('call_script')
                        ? '<div style="display:flex;gap:8px">' + historico + descarte +
                        '<button class="btn btn-ghost btn-sm" onclick="openStepEditor(\'' + it.id + '\')">Editar</button>' +
                        '<button class="btn btn-danger btn-sm" onclick="askRemoval(\'' + it.id + '\')">Remover</button>' +
                        '</div>'
                        : '<div style="display:flex;gap:8px">' + historico + descarte + '</div>';

                    html += '<div class="item-row" data-item="' + esc(it.id) + '">' +
                        '<div class="item-main">' +
                        '<div class="item-name">' + (idx + 1) + '. ' + badge + '</div>' +
                        '<div class="item-meta">' + esc(it.value) + '</div>' +
                        '</div>' + actions + '</div>';
                });
            });

            host.innerHTML = avisoRascunhosOffline('callscript') + html;
        }

        function openStepEditor(itemId) {
            var item = null;
            for (var i = 0; i < CS_ITEMS.length; i++) {
                if (CS_ITEMS[i].id === itemId) item = CS_ITEMS[i];
            }

            var existingDraft = itemId ? csDraftForItem(itemId) : null;
            var src = existingDraft || item;
            var lang = idiomaAtual();
            var flow = document.getElementById('cs-flow').value;
            var group = src ? src.field : 'inicio';
            var text = src ? src.value : '';

            var groupOptions = CS_GROUPS.map(function (g) {
                return '<option value="' + g.key + '"' + (g.key === group ? ' selected' : '') + '>' +
                    esc(g.label) + '</option>';
            }).join('');

            document.getElementById('modal-root').innerHTML =
                '<div class="modal-backdrop" onclick="if(event.target===this)closeModal()">' +
                '<div class="modal" role="dialog" aria-modal="true">' +
                '<h2>' + (item ? 'Editar passo' : 'Novo passo') + '</h2>' +
                '<p class="card-sub">' + esc(lang + ' ' + flow) +
                ' — vira proposta; o roteiro no ar só muda depois da aprovação.</p>' +
                (existingDraft && existingDraft.status === 'pending'
                    ? '<div class="note warn" style="margin-top:14px">Este passo já está em revisão.</div>'
                    : '') +
                '<label class="fld" for="cs-group">Seção</label>' +
                '<select id="cs-group">' + groupOptions + '</select>' +
                '<label class="fld" for="cs-text">Texto do passo</label>' +
                '<textarea id="cs-text" placeholder="o que o agente deve dizer ou fazer">' + esc(text) + '</textarea>' +
                '<div class="modal-actions">' +
                '<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>' +
                '<button class="btn btn-ghost" id="cs-draft">Salvar rascunho</button>' +
                '<button class="btn btn-primary" id="cs-save">Enviar para revisão</button>' +
                '</div></div></div>';

            document.getElementById('cs-save').onclick = function () {
                submitStep(itemId, existingDraft ? existingDraft.draftId : null, src, this);
            };
            document.getElementById('cs-draft').onclick = function () {
                submitStep(itemId, existingDraft ? existingDraft.draftId : null, src, this, true);
            };
            document.getElementById('cs-text').focus();
        }

        function submitStep(itemId, draftId, src, btn, apenasRascunho) {
            var text = document.getElementById('cs-text').value.trim();
            if (!text) return toast('Escreva o texto do passo.', true);

            var group = document.getElementById('cs-group').value;
            var lang = idiomaAtual();
            var flow = document.getElementById('cs-flow').value;

            // Passo novo vai para o fim da seção; passo existente mantém a posição.
            var sortOrder;
            if (src) {
                sortOrder = src.sortOrder;
            } else {
                var inGroup = CS_ITEMS.filter(function (i) {
                    return i.lang === lang && i.key === flow && i.field === group;
                });
                sortOrder = inGroup.reduce(function (max, i) {
                    return Math.max(max, i.sortOrder);
                }, 0) + 1;
            }

            (apenasRascunho ? salvarRascunho : enviarProposta)({
                draftId: draftId || '',
                itemId: itemId || '',
                module: 'call_script',
                key: flow,
                field: group,
                lang: lang,
                label: text,
                value: text,
                sortOrder: sortOrder
            }, btn, loadCallScript);
        }

        // --- Case Notes (modelos de nota inteira) ---
        var NT_ITEMS = [];
        var NT_DRAFTS = [];
        var NOTE_FIELDS = [];
        var NOTE_SUBSTATUS = [];

        function subDef(key) {
            for (var i = 0; i < NOTE_SUBSTATUS.length; i++) {
                if (NOTE_SUBSTATUS[i].key === key) return NOTE_SUBSTATUS[i];
            }
            return null;
        }

        function fieldLabel(key) {
            for (var i = 0; i < NOTE_FIELDS.length; i++) {
                if (NOTE_FIELDS[i].key === key) return NOTE_FIELDS[i].labelPt;
            }
            return key;
        }

        function loadNoteCatalog(done) {
            if (NOTE_SUBSTATUS.length) return done();

            google.script.run
                .withSuccessHandler(function (cat) {
                    NOTE_FIELDS = (cat && cat.fields) || [];
                    NOTE_SUBSTATUS = (cat && cat.substatus) || [];

                    var sel = document.getElementById('nt-sub');
                    sel.innerHTML = '<option value="">Todos</option>' +
                        NOTE_SUBSTATUS.map(function (s) {
                            return '<option value="' + esc(s.key) + '">' + esc(s.name) + '</option>';
                        }).join('');
                    done();
                })
                .withFailureHandler(function (err) { toast(err.message, true); done(); })
                .getNoteFieldCatalog();
        }

        function loadNoteTemplates() {
            loadNoteCatalog(function () {
                google.script.run
                    .withSuccessHandler(function (items) {
                        NT_ITEMS = items || [];
                        google.script.run
                            .withSuccessHandler(function (d) { NT_DRAFTS = d || []; delete DRAFTS_OFFLINE.notes; renderNoteTemplates(); })
                            .withFailureHandler(function () { NT_DRAFTS = []; DRAFTS_OFFLINE.notes = true; renderNoteTemplates(); })
                            .listContentDrafts('note_template');

                    .listContentItems('note_template');

        function ntDraftForItem(itemId) {
            for (var i = 0; i < NT_DRAFTS.length; i++) {
                if (NT_DRAFTS[i].itemId === itemId) return NT_DRAFTS[i];
            }
            return null;
        }

        function parseTpl(raw) {
            try { return JSON.parse(raw || '{}'); } catch (e) { return { fields: {} }; }
        }

        function renderNoteTemplates() {
            var host = document.getElementById('nt-list');
            var fSub = document.getElementById('nt-sub').value;
            var lang = idiomaAtual();

            var mine = NT_ITEMS.filter(function (i) {
                if (i.lang !== lang) return false;
                if (fSub && i.key !== fSub) return false;
                return true;
            });

            if (!mine.length) {
                host.innerHTML =
                    '<div class="state"><span class="material-symbols-rounded">edit_note</span>' +
                    '<h2>Nenhum modelo em ' + esc(lang) + (fSub ? ' para este substatus' : '') + '</h2>' +
                    '<p>Enquanto isso o app segue com os cenários embutidos no código. ' +
                    'Rode a semeadura (seedNoteTemplatesNow) para trazer os atuais.</p></div>';
                return;
            }

            var porSub = {};
            mine.forEach(function (it) { (porSub[it.key] = porSub[it.key] || []).push(it); });

            var html = '';
            Object.keys(porSub).sort().forEach(function (sub) {
                var def = subDef(sub);
                html += '<div class="cat-head">' + esc(def ? def.name : sub) +
                    ' <span class="pill draft">' + porSub[sub].length + '</span></div>';

                porSub[sub].forEach(function (it) {
                    var v = parseTpl(it.value);
                    var nCampos = Object.keys(v.fields || {}).length;
                    var d = ntDraftForItem(it.id);
                    var badge = selosDoRascunho(d);
                    var escopo = (it.field && it.field !== 'all')
                        ? '<span class="pill draft">' + esc(String(it.field).toUpperCase()) + '</span>'
                        : '';

                    // Descartar só aparece quando existe rascunho não enviado e
                    // ele é seu: proposta em revisão se resolve pela fila.
                    var descarte = (d && d.status === 'draft' && !travadoPorOutro(d))
                        ? '<button class="btn btn-danger btn-sm" onclick="descartarRascunho(\'' +
                          d.draftId + '\', loadNoteTemplates)">Descartar rascunho</button>'
                        : '';

                    // Histórico é LEITURA: quem enxerga o item enxerga por onde ele
                    // passou. Só reverter é que depende de aprovar.
                    var historico = '<button class="btn btn-ghost btn-sm" '
                        + 'onclick="abrirHistorico(\'' + it.id + '\',\'' + it.lineage + '\',\'note_template\')">Histórico</button>'
                        + botaoComoAgente(it.id);

                    var actions = podeEscrever('note_template')
                        ? '<div style="display:flex;gap:8px">' + historico + descarte +
                        '<button class="btn btn-ghost btn-sm" onclick="openTemplateEditor(\'' + it.id + '\')">Editar</button>' +
                        '<button class="btn btn-danger btn-sm" onclick="askRemoval(\'' + it.id + '\')">Remover</button>' +
                        '</div>'
                        : '<div style="display:flex;gap:8px">' + historico + descarte + '</div>';

                    html += '<div class="item-row" data-item="' + esc(it.id) + '">' +
                        '<div class="item-main">' +
                        '<div class="item-name">' + esc(it.label) + ' ' + badge + ' ' + escopo + '</div>' +
                        '<div class="item-meta">' + nCampos + ' campo' + (nCampos === 1 ? '' : 's') +
                        ' preenchido' + (nCampos === 1 ? '' : 's') + '</div>' +
                        '</div>' + actions + '</div>';
                });
            });

            host.innerHTML = avisoRascunhosOffline('notes') + html;
        }

        // Construtor da nota: escolhido o substatus, a tela oferece exatamente os
        // campos daquela nota. É o que substitui o antigo "um trecho por campo" —
        // aqui a unidade é a nota inteira, que é como o agente pensa.
        function openTemplateEditor(itemId) {
            var item = null;
            for (var i = 0; i < NT_ITEMS.length; i++) {
                if (NT_ITEMS[i].id === itemId) item = NT_ITEMS[i];
            }

            var existingDraft = itemId ? ntDraftForItem(itemId) : null;
            var src = existingDraft || item;
            var v = src ? parseTpl(src.value) : { fields: {} };

            var curSub = src ? src.key : (document.getElementById('nt-sub').value || (NOTE_SUBSTATUS[0] || {}).key);
            var curLang = src ? src.lang : idiomaAtual();
            var curEsc = src ? (src.field || 'all') : 'all';

            var subOptions = NOTE_SUBSTATUS.map(function (s) {
                return '<option value="' + esc(s.key) + '"' + (s.key === curSub ? ' selected' : '') + '>' +
                    esc(s.name) + '</option>';
            }).join('');

            var escOptions = [['all', 'BAU e LM'], ['bau', 'Só BAU'], ['lm', 'Só LM']].map(function (o) {
                return '<option value="' + o[0] + '"' + (o[0] === curEsc ? ' selected' : '') + '>' +
                    esc(o[1]) + '</option>';
            }).join('');

            var langOptions = ['PT', 'ES'].map(function (l) {
                return '<option value="' + l + '"' + (l === curLang ? ' selected' : '') + '>' + l + '</option>';
            }).join('');

            document.getElementById('modal-root').innerHTML =
                '<div class="modal-backdrop" onclick="if(event.target===this)closeModal()">' +
                '<div class="modal" style="max-width:760px" role="dialog" aria-modal="true">' +
                '<h2>' + (item ? 'Editar modelo de nota' : 'Nova nota') + '</h2>' +
                '<p class="card-sub">O status vem do substatus escolhido. Preencha só o que deve vir pronto — ' +
                'o resto o agente completa no atendimento.</p>' +
                (existingDraft && existingDraft.status === 'pending'
                    ? '<div class="note warn" style="margin-top:14px">Este modelo já está em revisão.</div>'
                    : '') +
                '<label class="fld" for="nt-f-name">Nome do modelo</label>' +
                '<input type="text" id="nt-f-name" placeholder="como o agente vê na lista" value="' +
                esc(src ? src.label : '') + '">' +
                '<div class="grid-2">' +
                '<div><label class="fld" for="nt-f-sub">Substatus</label>' +
                '<select id="nt-f-sub" onchange="renderTemplateFields()">' + subOptions + '</select></div>' +
                '<div><label class="fld" for="nt-f-esc">Aparece em</label>' +
                '<select id="nt-f-esc">' + escOptions + '</select></div>' +
                '</div>' +
                '<label class="fld" for="nt-f-lang">Idioma</label>' +
                '<select id="nt-f-lang">' + langOptions + '</select>' +
                '<div id="nt-fields" style="margin-top:8px"></div>' +
                '<div class="modal-actions">' +
                '<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>' +
                '<button class="btn btn-ghost" id="nt-draft">Salvar rascunho</button>' +
                '<button class="btn btn-primary" id="nt-save">Enviar para revisão</button>' +
                '</div></div></div>';

            renderTemplateFields(v.fields || {});

            document.getElementById('nt-save').onclick = function () {
                submitTemplate(itemId, existingDraft ? existingDraft.draftId : null, v, this);
            };
            document.getElementById('nt-draft').onclick = function () {
                submitTemplate(itemId, existingDraft ? existingDraft.draftId : null, v, this, true);
            };
            document.getElementById('nt-f-name').focus();
        }

        // Os campos oferecidos vêm do substatus escolhido, então é impossível
        // montar uma nota com um campo que ela não tem — que é exatamente a
        // falha silenciosa encontrada nos cenários antigos.
        function renderTemplateFields(valores) {
            var host = document.getElementById('nt-fields');
            if (!host) return;

            var sub = document.getElementById('nt-f-sub').value;
            var def = subDef(sub);

            // Ao TROCAR de substatus, preserva o que já foi digitado: trocar por
            // engano não pode apagar o trabalho.
            var atuais = valores;
            if (!atuais) {
                atuais = {};
                Array.prototype.forEach.call(host.querySelectorAll('textarea'), function (el) {
                    if (el.value.trim()) atuais['field-' + el.id.replace('ntf-', '')] = el.value;
                });
            }

            if (!def || !def.fields.length) {
                host.innerHTML = '<div class="note warn">Este substatus não tem campos de texto.</div>';
                return;
            }

            var req = def.requiredFields || [];
            var pref = def.prefixedFields || [];

            host.innerHTML =
                '<div class="cat-head" style="margin-top:22px">Campos de ' + esc(def.name) + '</div>' +
                def.fields.map(function (f) {
                    var obrig = req.indexOf(f) !== -1;
                    var temPrefixo = pref.indexOf(f) !== -1;
                    return '<label class="fld" for="ntf-' + esc(f) + '">' + esc(fieldLabel(f)) +
                        (obrig ? ' <span style="color:var(--danger)">*</span>' : '') +
                        (temPrefixo ? ' <span class="pill draft">a nota já prefixa</span>' : '') +
                        '</label>' +
                        '<textarea id="ntf-' + esc(f) + '" style="min-height:60px" ' +
                        'placeholder="deixe vazio para o agente preencher">' +
                        esc(atuais['field-' + f] || '') + '</textarea>';
                }).join('');
        }

        function submitTemplate(itemId, draftId, original, btn, apenasRascunho) {
            var nome = document.getElementById('nt-f-name').value.trim();
            if (!nome) return toast('Dê um nome ao modelo.', true);

            var sub = document.getElementById('nt-f-sub').value;
            var def = subDef(sub);
            var fields = {};

            (def ? def.fields : []).forEach(function (f) {
                var el = document.getElementById('ntf-' + f);
                if (el && el.value.trim()) fields['field-' + f] = el.value.trim();
            });

            // Tarefas vinculadas não são editáveis por aqui, mas precisam
            // sobreviver à edição: sem isso, editar o texto de um cenário
            // silenciosamente desligaria a seleção de tarefa que ele fazia.
            var value = JSON.stringify(Object.assign(
                { fields: fields },
                original && original.linkedTask ? { linkedTask: original.linkedTask } : {},
                original && original.activeTasks ? { activeTasks: original.activeTasks } : {}
            ));

            (apenasRascunho ? salvarRascunho : enviarProposta)({
                draftId: draftId || '',
                itemId: itemId || '',
                module: 'note_template',
                key: sub,
                field: document.getElementById('nt-f-esc').value,
                lang: document.getElementById('nt-f-lang').value,
                label: nome,
                value: value
            }, btn, loadNoteTemplates);
        }

        function emDraftForItem(itemId) {

        function parseEmail(raw) {

            var mine = EM_ITEMS.filter(function (i) { return i.lang === lang; });

            if (!mine.length) {

                    // Descartar só aparece quando existe rascunho não enviado e

                    var descarte = (d && d.status === 'draft' && !travadoPorOutro(d))

                    // Histórico é LEITURA: quem enxerga o item enxerga por onde ele

                        + botaoComoAgente(it.id);

        function openEmailEditor(itemId) {
            var item = null;

        // A prévia renderiza o HTML como o anunciante vai receber. É o ponto da

        function refreshEmailPreview() {
            var body = document.getElementById('em-body');
            var host = document.getElementById('em-preview');
            if (!body || !host) return;
            // Mesmo isolamento da prévia da fila: aqui o texto é seu, então o
            // risco é menor, mas manter dois caminhos diferentes para renderizar
            // a mesma coisa é como um deles fica para trás.
            host.innerHTML = previaIsolada(body.value, 200);

        function submitEmail(item, draftId, original, btn, apenasRascunho) {
            var subject = document.getElementById('em-subject').value.trim();
            var template = document.getElementById('em-body').value.trim();

            if (!subject) return toast('O e-mail precisa de um assunto.', true);
            if (!template) return toast('O e-mail precisa de um corpo.', true);

            // rótulos) segue como está. Mexer nela pela tela exigiria casar as
            // duas linguagens de uma vez, e é justamente onde um erro vaza
            // placeholder literal para o anunciante.
            var value = (item.lang === 'ES')

                sortOrder: item.sortOrder

                '<div class="modal-backdrop" onclick="if(event.target===this)closeModal()">' +
                '<div class="modal" role="dialog" aria-modal="true">' +
                '<h2>' + (item ? 'Editar dica' : 'Nova dica') + '</h2>' +
                '<p class="card-sub">Aparece durante os carregamentos. Frases curtas funcionam melhor.</p>' +
                (existingDraft && existingDraft.status === 'pending'
                    ? '<div class="note warn" style="margin-top:14px">Esta dica já está em revisão.</div>'
                    : '') +
                '<label class="fld" for="tp-text">Texto</label>' +
                '<textarea id="tp-text" style="min-height:70px">' + esc(src ? src.value : '') + '</textarea>' +
                '<div class="modal-actions">' +
                '<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>' +
                '<button class="btn btn-ghost" id="tp-draft">Salvar rascunho</button>' +
                '<button class="btn btn-primary" id="tp-save">Enviar para revisão</button>' +
                '</div></div></div>';

            document.getElementById('tp-save').onclick = function () {
                submitTip(itemId, existingDraft ? existingDraft.draftId : null, src, this);
            };
            document.getElementById('tp-draft').onclick = function () {
                submitTip(itemId, existingDraft ? existingDraft.draftId : null, src, this, true);
            };
            document.getElementById('tp-text').focus();
        }

        function submitTip(itemId, draftId, src, btn, apenasRascunho) {
            var text = document.getElementById('tp-text').value.trim();
            if (!text) return toast('Escreva o texto da dica.', true);

            var sortOrder = src ? src.sortOrder : TP_ITEMS.reduce(function (max, i) {
                return Math.max(max, i.sortOrder);
            }, 0) + 1;

            (apenasRascunho ? salvarRascunho : enviarProposta)({
                draftId: draftId || '',
                itemId: itemId || '',
                module: 'tips',
                key: 'geral',
                lang: 'ALL',
                // A dica é o próprio conteúdo: não há título separado.
                label: text,
                value: text,
                sortOrder: sortOrder
            }, btn, loadTips);
        }

</script>
