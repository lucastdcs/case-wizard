<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="supported-color-schemes" content="light dark">
    <style>
        /* CSS Reset Universal para E-mail */
        body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
        table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
        img { -ms-interpolation-mode: bicubic; }

        body {
            margin: 0;
            padding: 0;
            background-color: {{t.pageBg}};
            font-family: {{t.fontSans}};
            -webkit-font-smoothing: antialiased;
            color: {{t.textStrong}};
        }

        /* Classes utilitárias. O Gmail descarta CSS por classe em vários contextos
           (o app mobile, sobretudo), então TODA regra declarada aqui tem equivalente
           inline no próprio elemento. O que está neste bloco é conveniência de
           leitura e reforço — nunca a única fonte de um estilo. */
        .word-break { word-break: break-word; word-wrap: break-word; overflow-wrap: break-word; }

        /* Modo escuro. Quando o cliente está em dark, o Gmail inverte as cores por
           conta própria e costuma errar o contraste em cartões claros. Declarar o
           par explicitamente é o que existe de mais confiável — não funciona em
           todo cliente, mas onde funciona evita o resultado acidental. */
        @media (prefers-color-scheme: dark) {
            body      { background-color: {{t.darkPageBg}} !important; color: {{t.darkTextStrong}} !important; }
            .dm-page  { background-color: {{t.darkPageBg}} !important; }
            .dm-card  { background-color: {{t.darkCardBg}} !important; border-color: {{t.darkBorder}} !important; }
            .dm-text  { color: {{t.darkTextStrong}} !important; }
            .dm-muted { color: {{t.darkTextMuted}} !important; }
            .dm-rule  { border-color: {{t.darkBorder}} !important; }
        }
    </style>
</head>
<body style="margin: 0; padding: 0; background-color: {{t.pageBg}}; font-family: {{t.fontSans}}; -webkit-font-smoothing: antialiased; color: {{t.textStrong}};">

    <!-- Preheader: a linha que o Gmail mostra na lista, ao lado do assunto. Sem
         ela o cliente repete o começo do corpo, que seria igual em todo e-mail. -->
    <div style="display: none; max-height: 0; overflow: hidden; mso-hide: all; font-size: 1px; line-height: 1px; color: {{t.pageBg}}; opacity: 0;">
        {{PREHEADER}}
    </div>

    <table width="100%" cellpadding="0" cellspacing="0" border="0" class="dm-page" style="background-color: {{t.pageBg}};">
        <tr>
            <td align="center" style="padding: 32px 16px;">

                <table width="100%" cellpadding="0" cellspacing="0" border="0" class="dm-card" style="max-width: 600px; width: 100%; background-color: {{t.cardBg}}; border: 1px solid {{t.border}}; border-radius: {{t.radiusCard}};">

                    <tr>
                        <td style="padding: 32px 32px 8px 32px;">

                            <!-- Identidade do produto. O único toque de Cases Wizard no
                                 e-mail: um chip escuro (a mesma família do dark glass da
                                 pill flutuante do app, em command-center.js — sem
                                 backdrop-filter, que nenhum cliente de e-mail aplica de
                                 verdade) com o raio da pill dentro de um badge circular, e
                                 a cor do tipo na base do chip. Pequeno de propósito: é o
                                 único elemento escuro da página.

                                 O raio da pill é um SVG (path "M13 2L3 14h9l-1 8 10-12h-9
                                 l1-8z"), mas SVG não renderiza em e-mail — nem inline. O
                                 emoji ⚡ é o substituto seguro: mesmo glifo, sem depender
                                 de rede nem de suporte a SVG. -->
                            <table cellpadding="0" cellspacing="0" border="0" style="margin: 0 0 26px 0;">
                                <tr>
                                    <td style="border-radius: 8px 8px 0 0; background: linear-gradient(135deg, {{t.glassBg1}} 0%, {{t.glassBg2}} 100%); border: 1px solid {{t.glassBorder}}; border-bottom: none; padding: 6px 12px 5px 6px;">
                                        <table cellpadding="0" cellspacing="0" border="0"><tr>
                                            <td style="width: 20px; height: 20px; border-radius: 50%; background-color: {{t.glassBadgeBg}}; text-align: center; vertical-align: middle; font-size: 11px; line-height: 20px;">⚡</td>
                                            <td style="padding-left: 7px; font-family: {{t.fontSans}}; font-size: {{t.sizeLabel}}; font-weight: 500; letter-spacing: 0.2px; color: {{t.glassText}}; vertical-align: middle;">Cases Wizard</td>
                                        </tr></table>
                                    </td>
                                </tr>
                                <tr>
                                    <td style="height: 2px; line-height: 2px; font-size: 0; background-color: {{ACCENT}}; border-radius: 0 0 8px 8px;">&nbsp;</td>
                                </tr>
                            </table>

                            <h1 style="margin: 0 0 12px 0; font-family: {{t.fontSans}}; font-size: {{t.sizeTitle}}; font-weight: 400; line-height: 1.35; color: {{t.textStrong}};" class="dm-text">{{TITLE}}</h1>

                            <p style="margin: 0 0 8px 0; font-family: {{t.fontSans}}; font-size: {{t.sizeBody}}; line-height: 1.6; color: {{t.textBody}};" class="dm-text">{{LEAD}}</p>

                            <p style="margin: 0 0 28px 0; font-family: {{t.fontSans}}; font-size: {{t.sizeSub}}; color: {{t.textMuted}};" class="dm-muted">{{META}}</p>

                            {{CALLOUT}}

                            {{ACTION}}

                            {{BLOCKS}}

                        </td>
                    </tr>

                    <tr>
                        <td style="padding: 20px 32px 28px 32px; border-top: 1px solid {{t.hairline}};" class="dm-rule">
                            <p style="margin: 0 0 6px 0; font-family: {{t.fontSans}}; font-size: {{t.sizeLabel}}; line-height: 1.6; color: {{t.textMuted}};" class="dm-muted">{{FOOTER_NOTE}}</p>
                            <p style="margin: 0; font-family: {{t.fontSans}}; font-size: {{t.sizeLabel}};">
                                <a href="{{FEEDBACK_URL}}" target="_blank" style="color: {{t.link}}; text-decoration: none;">{{FEEDBACK_LABEL}}</a>
                            </p>
                        </td>
                    </tr>

                </table>

            </td>
        </tr>
    </table>
</body>
</html>
