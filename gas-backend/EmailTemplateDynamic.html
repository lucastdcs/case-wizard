<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="supported-color-schemes" content="light dark">
    <style>
        /* CSS Reset Universal para E-mail */
        body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
        table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
        img { -ms-interpolation-mode: bicubic; }

        body {
            margin: 0;
            padding: 0;
            background-color: {{t.pageBg}};
            font-family: {{t.fontSans}};
            -webkit-font-smoothing: antialiased;
            color: {{t.textStrong}};
        }

        /* Classes utilitárias. O Gmail descarta CSS por classe em vários contextos
           (o app mobile, sobretudo), então TODA regra declarada aqui tem equivalente
           inline no próprio elemento. O que está neste bloco é conveniência de
           leitura e reforço — nunca a única fonte de um estilo. */
        .text-mono { font-family: {{t.fontMono}}; }
        .word-break { word-break: break-word; word-wrap: break-word; overflow-wrap: break-word; }

        /* Modo escuro. Quando o cliente está em dark, o Gmail inverte as cores por
           conta própria e costuma errar o contraste em cartões claros. Declarar o
           par explicitamente é o que existe de mais confiável — não funciona em
           todo cliente, mas onde funciona evita o resultado acidental. */
        @media (prefers-color-scheme: dark) {
            body       { background-color: {{t.darkPageBg}} !important; color: {{t.darkTextStrong}} !important; }
            .dm-page   { background-color: {{t.darkPageBg}} !important; }
            .dm-card   { background-color: {{t.darkCardBg}} !important; border-color: {{t.darkBorder}} !important; }
            .dm-panel  { background-color: {{t.darkPanelBg}} !important; border-color: {{t.darkBorder}} !important; }
            .dm-chip   { background-color: {{t.darkChipBg}} !important; border-color: {{t.darkBorder}} !important; }
            .dm-text   { color: {{t.darkTextStrong}} !important; }
            .dm-muted  { color: {{t.darkTextMuted}} !important; }
        }
    </style>
</head>
<body style="margin: 0; padding: 0; background-color: {{t.pageBg}}; font-family: {{t.fontSans}}; -webkit-font-smoothing: antialiased; color: {{t.textStrong}};">

    <!-- Preheader: a linha que o Gmail mostra na lista, ao lado do assunto. Sem
         ela o cliente repete o começo do corpo, que seria igual em todo e-mail. -->
    <div style="display: none; max-height: 0; overflow: hidden; mso-hide: all; font-size: 1px; line-height: 1px; color: {{t.pageBg}}; opacity: 0;">
        {{PREHEADER}}
    </div>

    <table width="100%" cellpadding="0" cellspacing="0" border="0" class="dm-page" style="background-color: {{t.pageBg}};">
        <tr>
            <td align="center" style="padding: 40px 16px;">

                <table width="100%" cellpadding="0" cellspacing="0" border="0" class="dm-card" style="max-width: 640px; width: 100%; background-color: {{t.cardBg}}; border-radius: {{t.radiusCard}}; overflow: hidden; border: 1px solid {{t.border}}; margin: 0 auto;">

                    <tr>
                        <td style="padding: 0;">
                            <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: {{t.headerBg}};">
                                <tr>
                                    <td align="center" style="padding: 32px 24px;">
                                        <div style="font-family: {{t.fontSans}}; font-size: {{t.sizeTitle}}; font-weight: 600; letter-spacing: -0.5px; margin-bottom: 8px; color: {{t.textOnDark}};">
                                            {{HEADER_ICON}} BAU Central
                                        </div>
                                        <div style="font-family: {{t.fontSans}}; font-size: {{t.sizeSub}}; color: {{THEME_COLOR}}; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px;">
                                            {{HEADER_SUBTITLE}}
                                        </div>
                                    </td>
                                </tr>
                                <!-- Faixa de cor por tipo de e-mail: uma linha de tabela de verdade,
                                     no lugar do divisor em gradiente posicionado por coordenada, que
                                     nenhum cliente de e-mail chegava a desenhar. -->
                                <tr>
                                    <td style="height: 3px; line-height: 3px; font-size: 0; background-color: {{THEME_COLOR}};">&nbsp;</td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <tr>
                        <td style="padding: 32px 24px;">

                            {{INTRO_BLOCK}}

                            <p style="margin: 0 0 24px 0; font-family: {{t.fontSans}}; font-size: {{t.sizeBody}}; line-height: 1.6; color: {{t.textBody}}; text-align: {{CONTENT_ALIGN}};" class="dm-text">
                                {{MAIN_MESSAGE}}
                            </p>

                            {{URGENCY_BADGE}}

                            {{BODY_BLOCKS}}

                            {{FOOTER_ACTION}}

                        </td>
                    </tr>

                    <tr>
                        <td style="padding: 24px; text-align: center; border-top: 1px solid {{t.border}};">

                            <p style="margin: 0 0 10px 0; font-family: {{t.fontSans}}; font-size: {{t.sizeLabel}}; color: {{t.textMuted}};" class="dm-muted">
                                Automated by <a href="https://moma.corp.google.com/chat?with=lucaste" target="_blank" style="color: {{t.link}}; text-decoration: none; font-weight: 600;">@lucaste</a>
                            </p>

                            {{FOOTER_NOTE}}

                            <p style="margin: 0; font-family: {{t.fontSans}}; font-size: {{t.sizeLabel}};">
                                <a href="https://forms.gle/AJX3NXz1TpJRm3mC7" target="_blank" style="color: {{t.link}}; text-decoration: none; font-weight: 500;">Report Bug / Feature Request</a>
                            </p>

                        </td>
                    </tr>

                </table>

            </td>
        </tr>
    </table>
</body>
</html>
