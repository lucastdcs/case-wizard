<!-- Parte de gas-backend/ContentDashboard.html. Ver o cabeçalho de lá. -->
<!-- Tokens e componentes da Central. Copiados do TLDashboard de propósito,
     não importados dele — ver o comentário no topo deste bloco. -->
<style>
        /* Tokens copiados do TLDashboard.html de propósito, não importados dele:
           lá o CSS é inline num arquivo de ~2000 linhas, e extrair um parcial
           compartilhado sem regressão custaria mais agora do que a duplicação.
           A origem é a mesma, então a identidade visual não diverge. */
        :root {
            --bg-base: #F1F3F4;
            --surface-level-1: #FFFFFF;
            --surface-level-2: #F8F9FA;
            --surface-level-3: #E8EAED;
            --border-subtle: #DADCE0;

            --text-primary: #202124;
            --text-secondary: #5F6368;
            --text-tertiary: #5F6368;

            --gemini-blue: #1A73E8;
            --gemini-blue-light: #E8F0FE;
            --gemini-purple: #9B72CB;
            --gemini-gradient: linear-gradient(90deg, #4285f4, #9b72cb, #d96570);

            --success: #1E8E3E;
            --success-light: #E6F4EA;
            --danger: #D93025;
            --danger-light: #FCE8E6;
            --warning: #F9AB00;
            --warning-light: #FEF7E0;
            --warning-text: #B06000;

            --radius-sm: 8px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-pill: 100px;

            --nav-bg: #3D3D3D;
            --nav-surface: #333333;
            --nav-border: rgba(255, 255, 255, 0.15);
            --nav-text-primary: #E3E3E3;
            --nav-text-secondary: #9AA0A6;

            --spring-expressive: cubic-bezier(0.175, 0.885, 0.32, 1.275);
            --spring-functional: cubic-bezier(0.2, 0, 0, 1);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Google Sans', system-ui, sans-serif;
            background-color: var(--bg-base);
            margin: 0;
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        .ambient-glow {
            position: fixed;
            top: -20vh;
            left: 10vw;
            width: 80vw;
            height: 50vh;
            background: radial-gradient(ellipse at center, rgba(66, 133, 244, 0.06) 0%, rgba(241, 243, 244, 0) 70%);
            z-index: -1;
            pointer-events: none;
        }

        /* --- Top nav --- */
        .topnav {
            background: rgba(61, 61, 61, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 0 32px;
            height: 72px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--nav-border);
            background-image: linear-gradient(to bottom, rgba(255, 255, 255, 0.05), transparent);
        }

        .topnav::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 1px;
            background: var(--gemini-gradient);
            opacity: 0.7;
        }

        .brand-main {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 20px;
            font-weight: 500;
            letter-spacing: -0.5px;
            color: var(--nav-text-primary);
        }

        .topnav-fim {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        /* O botão vive no vidro escuro do header, não na área clara: é chrome,
           irmão do chip de usuário, e não um controle do conteúdo. */
        .topnav-acao {
            display: flex;
            align-items: center;
            gap: 7px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--nav-border);
            color: var(--nav-text-primary);
            padding: 6px 14px 6px 11px;
            border-radius: var(--radius-pill);
            font-family: inherit;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .topnav-acao:hover { background: rgba(255, 255, 255, 0.16); }

        .topnav-acao:focus-visible {
            outline: 2px solid var(--nav-text-primary);
            outline-offset: 2px;
        }

        .topnav-acao .material-symbols-rounded { font-size: 19px; }

        .topnav-acao[aria-expanded="true"] {
            background: rgba(255, 255, 255, 0.2);
        }

        .user-chip {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--nav-text-secondary);
            font-size: 13px;
        }

        .role-badge {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid var(--nav-border);
            color: var(--nav-text-primary);
            padding: 4px 12px;
            border-radius: var(--radius-pill);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.6px;
        }

        /* --- Layout ---
           A tela é um trilho fixo à esquerda mais a área de conteúdo. O vidro
           escuro do header desce pelo trilho: é a assinatura do Cases Wizard, e
           fica no CHROME. A área de conteúdo segue Material claro, como manda
           specs/ui-ux/design-system.md - vidro ali deixaria a Central parecida
           com um SaaS genérico e diferente do TL Dashboard, que é a irmã dela. */
        .shell {
            display: grid;
            grid-template-columns: 248px minmax(0, 1fr);
            align-items: start;
        }

        .wrap {
            max-width: 1180px;
            padding: 32px;
            min-width: 0;
        }

        /* A barra de atividade é uma TERCEIRA coluna, como no TL Dashboard, e
           não uma gaveta por cima do conteúdo: o que ela mostra é para ser
           acompanhado ENQUANTO se trabalha, não consultado e fechado. */
        .shell.com-lateral {
            grid-template-columns: 248px minmax(0, 1fr) 304px;
        }

        .lateral {
            position: sticky;
            top: 72px;
            align-self: start;
            max-height: calc(100vh - 72px);
            overflow-y: auto;
            padding: 32px 24px 32px 0;
        }

        .lateral-bloco {
            background: var(--surface-level-1);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 18px 20px;
        }

        .lateral-titulo {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-secondary);
            margin-bottom: 14px;
        }

        .atividade-linha {
            display: flex;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-subtle);
        }

        .atividade-linha:last-child { border-bottom: none; }

        .atividade-foto {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            object-fit: cover;
            flex: 0 0 auto;
            background: var(--surface-level-3);
        }

        .atividade-texto {
            min-width: 0;
            font-size: 13px;
            line-height: 1.45;
            color: var(--text-primary);
        }

        .atividade-quem { font-weight: 600; }

        .atividade-meta {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        /* A justificativa de uma rejeição é a informação mais útil da linha, e
           também a mais longa: quebra em vez de estourar a coluna. */
        .atividade-detalhe {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 3px;
            overflow-wrap: anywhere;
        }

        /* --- Faixa da prévia "ver como" --- */
        .faixa-previa {
            position: sticky;
            top: 72px;
            z-index: 90;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 24px;
            background: var(--warning-light);
            border-bottom: 1px solid var(--warning);
            color: var(--warning-text);
            font-size: 13px;
        }

        .faixa-previa .material-symbols-rounded { font-size: 20px; }
        .faixa-previa > span:nth-of-type(2) { flex: 1; }
        .faixa-previa .faixa-nota { opacity: 0.85; }

        .faixa-previa .btn {
            border-color: var(--warning);
            color: var(--warning-text);
        }

        /* Com a faixa na tela, o trilho e a barra lateral começam mais abaixo:
           são os dois elementos grudados no topo. */
        body.em-previa .rail,
        body.em-previa .lateral { top: 116px; }
        body.em-previa .rail { height: calc(100vh - 116px); }

        /* --- Matriz de papéis --- */
        .rol-toolbar {
            display: flex;
            gap: 16px;
            align-items: flex-end;
            flex-wrap: wrap;
        }

        .rol-toolbar #rol-resumo {
            flex: 1 1 240px;
            margin: 0 0 8px;
        }

        /* A matriz é larga por natureza: rola dentro do cartão em vez de
           empurrar a página inteira para o lado. */
        .rol-scroll { overflow-x: auto; }

        .rol-matriz {
            border-collapse: collapse;
            width: 100%;
            min-width: 560px;
        }

        .rol-matriz th,
        .rol-matriz td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-subtle);
            text-align: center;
        }

        .rol-matriz thead th {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .rol-matriz tbody th {
            text-align: left;
            font-weight: 500;
            white-space: nowrap;
        }

        .rol-matriz tbody tr:last-child th,
        .rol-matriz tbody tr:last-child td { border-bottom: none; }

        .rol-matriz input[type="checkbox"] {
            width: 17px;
            height: 17px;
            accent-color: var(--gemini-blue);
            cursor: pointer;
        }

        /* Casa que não existe naquele regime. Cinza e sem controle: um checkbox
           desligado aqui prometeria uma operação que o módulo não tem. */
        .rol-na { color: var(--text-tertiary); opacity: 0.45; }

        .rol-global {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-subtle);
            cursor: pointer;
        }

        .rol-global:last-child { border-bottom: none; }

        .rol-global input[type="checkbox"] {
            width: 17px;
            height: 17px;
            margin-top: 2px;
            accent-color: var(--gemini-blue);
            flex: 0 0 auto;
        }

        .rol-global-ajuda {
            display: block;
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .rol-diff {
            margin: 8px 0 0;
            padding-left: 20px;
            font-size: 13px;
            line-height: 1.7;
        }

        /* Abaixo desta largura, trilho (248px) mais barra (304px) deixariam o
           editor com menos da metade da tela. A barra sai do grid e passa a
           flutuar sobre o conteúdo, fechável pelo mesmo botão.

           Empilhar embaixo, que seria o reflexo, não funciona aqui: o trilho
           tem altura de viewport inteira, então a linha de baixo do grid começa
           depois de uma tela de nada. */
        @media (max-width: 1180px) {
            .shell.com-lateral {
                grid-template-columns: 248px minmax(0, 1fr);
            }

            .lateral {
                position: fixed;
                top: 72px;
                right: 0;
                bottom: 0;
                width: min(340px, 92vw);
                max-height: none;
                z-index: 200;
                padding: 20px 16px;
                background: var(--bg-base);
                border-left: 1px solid var(--border-subtle);
                box-shadow: -10px 0 28px rgba(0, 0, 0, 0.14);
            }

            /* Flutuando, o painel já é a moldura: o cartão dentro dele viraria
               uma borda dentro de outra. */
            .lateral .lateral-bloco {
                background: transparent;
                border: none;
                padding: 0;
            }
        }

        /* Estados de boot e de acesso negado aparecem sem trilho: não há
           navegação a oferecer antes de saber quem é a pessoa. */
        .shell.sem-trilho {
            grid-template-columns: minmax(0, 1fr);
        }

        .shell.sem-trilho .wrap {
            margin: 0 auto;
        }

        /* --- Trilho --- */
        .rail {
            position: sticky;
            top: 72px;
            align-self: start;
            height: calc(100vh - 72px);
            overflow-y: auto;
            padding: 20px 12px 28px;
            background: rgba(61, 61, 61, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-right: 1px solid var(--nav-border);
            background-image: linear-gradient(to bottom, rgba(255, 255, 255, 0.04), transparent);
        }

        .rail-group {
            margin-bottom: 22px;
        }

        .rail-group:last-of-type {
            margin-bottom: 0;
        }

        /* O rótulo do grupo é o que carrega o REGIME de publicação. Antes isso
           morava num parágrafo dentro do painel, e a caixa de texto fazia o
           trabalho que a estrutura deveria fazer. */
        .rail-group-title {
            font-size: 10.5px;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: var(--nav-text-secondary);
            padding: 0 12px;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .rail-group-title small {
            display: block;
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.2px;
            text-transform: none;
            opacity: 0.75;
        }

        .rail-item {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 12px;
            margin-bottom: 2px;
            border: none;
            border-radius: var(--radius-sm);
            background: transparent;
            color: var(--nav-text-primary);
            font-family: inherit;
            font-size: 13.5px;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            transition: background .15s var(--spring-functional);
        }

        /* Caixa fixa para o ícone. Material Symbols desenha por ligadura: se a
           fonte não carregar (rede, CSP), o nome do ícone aparece como texto
           largo e empurra o rótulo do destino para fora. Com a caixa fixa, a
           falha da fonte custa o ícone, não a navegação. */
        .rail-item .material-symbols-rounded {
            font-size: 19px;
            flex: 0 0 19px;
            width: 19px;
            overflow: hidden;
            opacity: .8;
        }

        .rail-item .rail-label {
            flex: 1 1 auto;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .rail-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .rail-item[aria-current="page"] {
            background: rgba(255, 255, 255, 0.14);
        }

        .rail-item[aria-current="page"] .material-symbols-rounded {
            opacity: 1;
        }

        .rail-item:focus-visible {
            outline: 2px solid #8AB4F8;
            outline-offset: -2px;
        }

        .rail-item .rail-count {
            margin-left: auto;
            font-size: 11px;
            font-weight: 700;
            color: var(--nav-text-secondary);
        }

        /* Publicação direta ganha marca própria no trilho: é a diferença entre
           "isto vira proposta" e "isto vai ao ar agora, para todo agente". */
        .rail-item .ao-vivo {
            margin-left: auto;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--warning);
        }

        .rail-lang {
            margin: 4px 12px 20px;
        }

        .rail-lang label {
            display: block;
            font-size: 10.5px;
            font-weight: 700;
            letter-spacing: .8px;
            text-transform: uppercase;
            color: var(--nav-text-secondary);
            margin-bottom: 6px;
        }

        .rail-lang select {
            background: rgba(255, 255, 255, 0.10);
            border: 1px solid var(--nav-border);
            color: var(--nav-text-primary);
            font-size: 13px;
            padding: 7px 10px;
        }

        .rail-lang select:focus {
            outline: 2px solid #8AB4F8;
            background: rgba(255, 255, 255, 0.16);
        }

        /* Abaixo de 900px o trilho vira uma faixa horizontal rolável: um menu
           lateral fixo comeria metade da largura útil. */
        @media (max-width: 900px) {
            /* `.shell.com-lateral` tem especificidade maior que `.shell`: sem
               repetir a classe aqui, o trilho voltaria a ser uma coluna fixa
               de 248px no celular. */
            .shell,
            .shell.com-lateral {
                grid-template-columns: minmax(0, 1fr);
            }

            .rail {
                position: static;
                height: auto;
                display: flex;
                gap: 16px;
                overflow-x: auto;
                border-right: none;
                border-bottom: 1px solid var(--nav-border);
                padding: 14px 16px;
            }

            .rail-group {
                margin-bottom: 0;
                flex: 0 0 auto;
            }

            .rail-group .rail-items {
                display: flex;
                gap: 4px;
            }

            .rail-item {
                white-space: nowrap;
                margin-bottom: 0;
            }

            .rail-lang {
                margin: 0;
                flex: 0 0 auto;
            }
        }

        .page-head {
            margin-bottom: 24px;
        }

        .page-head h1 {
            font-size: 28px;
            font-weight: 500;
            margin: 0 0 6px;
            letter-spacing: -0.5px;
        }

        .page-head p {
            margin: 0;
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* --- Tabs --- */
        .tab-section {
            display: flex;
            gap: 8px;
            border-bottom: 1px solid var(--border-subtle);
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            padding: 12px 18px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color .2s var(--spring-functional), border-color .2s var(--spring-functional);
        }

        .tab-btn:hover {
            color: var(--text-primary);
        }

        .tab-btn.active {
            color: var(--gemini-blue);
            border-bottom-color: var(--gemini-blue);
        }

        .tab-btn:focus-visible {
            outline: 2px solid var(--gemini-blue);
            outline-offset: 2px;
            border-radius: var(--radius-sm) var(--radius-sm) 0 0;
        }

        .count-chip {
            background: var(--danger);
            color: #fff;
            border-radius: var(--radius-pill);
            font-size: 11px;
            font-weight: 700;
            padding: 1px 7px;
            min-width: 18px;
            text-align: center;
        }

        .count-chip.zero {
            display: none;
        }

        /* --- Cards --- */
        .card {
            background: var(--surface-level-1);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 20px 24px;
            margin-bottom: 16px;
        }

        .card-title {
            font-size: 15px;
            font-weight: 500;
            margin: 0 0 4px;
        }

        .card-sub {
            font-size: 13px;
            color: var(--text-secondary);
            margin: 0;
        }

        .row-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        /* --- Buttons --- */
        .btn {
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            border-radius: var(--radius-pill);
            padding: 9px 20px;
            border: 1px solid transparent;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background .2s var(--spring-functional), box-shadow .2s var(--spring-functional);
        }

        .btn:focus-visible {
            outline: 2px solid var(--gemini-blue);
            outline-offset: 2px;
        }

        .btn-primary {
            background: var(--gemini-blue);
            color: #fff;
        }

        .btn-primary:hover {
            box-shadow: 0 1px 6px rgba(26, 115, 232, .45);
        }

        .btn-ghost {
            background: transparent;
            color: var(--gemini-blue);
            border-color: var(--border-subtle);
        }

        .btn-ghost:hover {
            background: var(--gemini-blue-light);
        }

        .btn-danger {
            background: transparent;
            color: var(--danger);
            border-color: var(--danger-light);
        }

        .btn-danger:hover {
            background: var(--danger-light);
        }

        .btn-success {
            background: var(--success);
            color: #fff;
        }

        .btn:disabled {
            opacity: .45;
            cursor: not-allowed;
            box-shadow: none;
        }

        .btn-sm {
            font-size: 13px;
            padding: 6px 14px;
        }

        /* --- Forms --- */
        label.fld {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            margin: 14px 0 5px;
        }

        input[type=text],
        input[type=url],
        input[type=date],
        select,
        textarea {
            width: 100%;
            font-family: inherit;
            font-size: 14px;
            color: var(--text-primary);
            background: var(--surface-level-2);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            padding: 10px 12px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: 2px solid var(--gemini-blue);
            outline-offset: -1px;
            background: var(--surface-level-1);
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0 16px;
        }

        @media (max-width: 700px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
        }

        /* --- Status pills --- */
        .pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .4px;
            padding: 3px 10px;
            border-radius: var(--radius-pill);
            text-transform: uppercase;
        }

        .pill.live {
            background: var(--success-light);
            color: var(--success);
        }

        .pill.draft {
            background: var(--surface-level-3);
            color: var(--text-secondary);
        }

        .pill.pending {
            background: var(--warning-light);
            color: var(--warning-text);
        }

        .pill.archived {
            background: var(--danger-light);
            color: var(--danger);
        }

        /* O estado se diz em texto normal, com um ponto na cor semântica —
