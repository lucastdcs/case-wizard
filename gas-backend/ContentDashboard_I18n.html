        var UI_LANGS = ['pt', 'es', 'en'];
        var UI_LOCALE = { pt: 'pt-BR', es: 'es', en: 'en-US' };
        var UI_LANG = 'pt';

        // Chave própria: a escolha da Central não é a do app do agente (que tem
        // a dele, em Configurações) nem a do TL Dashboard.
        var UI_LANG_KEY = 'cw_content_ui_lang';

        // Valor de função recebe os argumentos (`tt('gate_links', 'QA')`).
        function tt(key) {
            var dict = UI_I18N[UI_LANG] || UI_I18N.pt;
            var v = dict[key] !== undefined ? dict[key] : UI_I18N.pt[key];
            if (typeof v === 'function') return v.apply(null, Array.prototype.slice.call(arguments, 1));
            return v === undefined ? key : v;
        }

        // `People` guarda "PT-BR" / "ES" / "EN" (defaultLanguageForSegment).
        function idiomaDoPerfil(defaultLanguage) {
            var v = String(defaultLanguage || '').toUpperCase();
            if (v === 'ES') return 'es';
            if (v === 'EN') return 'en';
            return 'pt';
        }

        // localStorage some em navegação privada e no iframe do Apps Script com
        // cookies de terceiros bloqueados: sem ele, vale o idioma do perfil.
        function idiomaSalvo() {
            var v = null;
            try { v = localStorage.getItem(UI_LANG_KEY); } catch (e) { }
            return UI_LANGS.indexOf(v) !== -1 ? v : null;
        }

        // Preenche todo elemento marcado. `data-i18n-html` é só para o texto
        // fixo deste dicionário (tem <strong>); nada que venha de dado passa
        // por ele.
        function aplicarTextosFixos() {
            document.querySelectorAll('[data-i18n]').forEach(function (el) {
                el.textContent = tt(el.getAttribute('data-i18n'));
            });
            document.querySelectorAll('[data-i18n-html]').forEach(function (el) {
                el.innerHTML = tt(el.getAttribute('data-i18n-html'));
            });
            document.querySelectorAll('[data-i18n-ph]').forEach(function (el) {
                el.setAttribute('placeholder', tt(el.getAttribute('data-i18n-ph')));
            });
            document.querySelectorAll('[data-i18n-aria]').forEach(function (el) {
                el.setAttribute('aria-label', tt(el.getAttribute('data-i18n-aria')));
            });
        }

        function definirIdiomaDaInterface(lang) {
            UI_LANG = UI_LANGS.indexOf(lang) !== -1 ? lang : 'pt';
            document.documentElement.lang = UI_LOCALE[UI_LANG];
            var sel = document.getElementById('lang-ui');
            if (sel) sel.value = UI_LANG;
            aplicarTextosFixos();

            // O que o JS escreveu com o idioma anterior: o cabeçalho da aba e os
            // avisos de permissão. Só depois do boot — antes não há sessão.
            if (SESSION && SESSION.hasAccess) {
                aplicarPermissoes(SESSION);
                pintarCabecalho(destinoDaURL());
            }
        }

        // A escolha manual vale mais que o perfil, e fica neste navegador.
        function aoTrocarIdiomaDaInterface() {
            var lang = document.getElementById('lang-ui').value;
            try { localStorage.setItem(UI_LANG_KEY, lang); } catch (e) { /* vale só nesta sessão */ }
            definirIdiomaDaInterface(lang);
        }
